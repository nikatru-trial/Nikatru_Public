# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/native-auth-proof.yml of com-nikatru/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Native auth proof

run-name: "Native auth proof · ${{ inputs.app }}${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}${{ inputs.private_pr && format(' — branch proof {0} (PR #{1})', inputs.private_ref, inputs.private_pr) || '' }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The app to prove: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      pending_flows:
        description: 'run (default): walk the core flow. skip: skip it and say so (sign-in only).'
        type: choice
        required: false
        default: run
        options:
          - run
          - skip
      sign_in:
        description: 'token (default): the harness session. form: the phones run the positive leg (--expect-sign-in) — the only proof a nativeAuth flip may cite.'
        type: choice
        required: false
        default: token
        options:
          - token
          - form
      targets:
        description: 'all (default), or a comma list of android,ios,macos,windows,linux: the targets this dispatch proves. A Worker slot run proves all.'
        required: false
        default: all
        type: string
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string
      private_pr:
        description: "A private_ref branch run only: the number of the private pull request whose head that branch is (its CI run is the gate). Empty for main."
        required: false
        default: ''
        type: string
      observed_window:
        description: "sign_in: form and targets: android only. <ISO>/<ISO> (UTC, at most 2 h, ended, within 6 days): the window a person signed in, signed up and recovered on a store-delivered build. Empty (default): no observed leg."
        required: false
        default: ''
        type: string
      observed_channel:
        description: 'The Play Integrity channel the observed build must have attested as: play (Google Play delivered) or sideload (the pinned sideload build).'
        type: choice
        required: false
        default: play
        options:
          - play
          - sideload
      private_ref:
        description: The PRIVATE ref this run builds, refs/heads/<branch> (generated; empty is the private main).
        required: false
        default: ''
        type: string

concurrency:
  group: native-auth-proof-${{ ((github.event.client_payload.event || github.event_name) == 'schedule' || inputs.worker_slot != '') && '(schedule)' || inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || inputs.private_ref || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
              second="$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | sed -n 2p)"
              if [ "$second" = "$NIKATRU_P_SHA" ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "attempt $NIKATRU_ATTEMPT: $sha is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${second:-none})"
            else
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$NIKATRU_ATTEMPT" -lt "$NIKATRU_ATTEMPTS" ]; then sleep "$NIKATRU_WAIT_S"; fi
      - name: Pin the commit every job of this run checks out (generated)
        id: pin
        shell: bash
        env:
          NIKATRU_PINNED: ${{ steps.nikatru-pin-test-1.outputs.sha }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$NIKATRU_P_SHA" ] && ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the dispatched sha \"$NIKATRU_P_SHA\" is not 40 lowercase hex characters: nothing is pinned"
            exit 1
          fi
          if [ "$NIKATRU_P_MAIN_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a push to main pinned $NIKATRU_PINNED, not the pushed sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
            tip="$(git -C .nikatru-main rev-parse HEAD)"
            if [ "$NIKATRU_PINNED" != "$tip" ]; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not private main's tip $tip (an older commit of main, or a push main has moved past: the tip's own run builds it): nothing is pinned"
              exit 1
            fi
          fi
          if [ "$NIKATRU_P_TAG_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a tag push pinned $NIKATRU_PINNED, not the dispatched sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            tagged="$(git -C .nikatru-tag rev-parse HEAD 2>/dev/null || true)"
            if [ "$tagged" != "$NIKATRU_PINNED" ]; then
              echo "::error::the dispatched tag resolves to ${tagged:-nothing}, not the dispatched sha $NIKATRU_PINNED: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the tagged sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
          fi
          if [ -z "$NIKATRU_PINNED" ]; then
            echo "::error::no candidate became the commit this run builds in 1 attempt(s) (a pull request's merge ref never named the dispatched head $NIKATRU_P_SHA as its second parent): nothing is built — push again, or re-run this workflow"
            exit 1
          fi
          echo "pinned $NIKATRU_PINNED"
          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

  nikatru-approve:
    name: Wait for a reviewer before unmerged code meets production credentials (generated) · private commit ${{ needs.nikatru-pin.outputs.sha }}
    needs: [nikatru-pin]
    if: (inputs.private_ref || '') != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    environment: store-publish
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
      - name: Name what a reviewer approved (generated)
        shell: bash
        env:
          NIKATRU_PINNED: ${{ needs.nikatru-pin.outputs.sha }}
        run: echo "approved a run of the pinned private commit $NIKATRU_PINNED"

  gate:
    needs: [nikatru-pin, nikatru-approve]
    name: The app input names one app of the workspace
    if: needs.nikatru-pin.result == 'success' && (needs.nikatru-approve.result == 'success' || (needs.nikatru-approve.result == 'skipped' && !((inputs.private_ref || '') != ''))) && !cancelled() && !failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    outputs:
      apps: ${{ steps.app.outputs.apps }}
      darwin: ${{ steps.darwin.outputs.darwin }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        if: ${{ (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main' || inputs.private_pr != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: ${{ (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main' || inputs.private_pr != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: ${{ (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main' || inputs.private_pr != '' }}
      - name: ci-gate passed for this commit (a branch run)
        if: ${{ (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main' || inputs.private_pr != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ (github.event.client_payload.event || github.event_name) }}
          PRIVATE_PR: ${{ inputs.private_pr }}
          REF: ${{ (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') }}
          GATE_MODE: ${{ inputs.worker_slot != '' && 'newest-green' || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-gate-passed.mjs "$(git rev-parse HEAD)" --schedule-lookback 20 --event "$EVENT_NAME" --output sha --pr "$PRIVATE_PR" --ref "$REF" --gate-mode "$GATE_MODE"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-auth-proof.gate.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The app input names one app of the workspace
        id: app
        env:
          APP_INPUT: ${{ inputs.app }}
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          WORKER_SLOT: ${{ inputs.worker_slot }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # why: ⏱ 2026-10-26 · cron-off-github-1026: the platform Worker's slot (worker_slot set) IS the schedule, so it
          # proves the whole set. `app` is required, so the Worker sends the placeholder `weekly-rotation`, never read
          # as an app: a worker-slot run carrying any other value is refused; a hand dispatch keeps its own check.
          if [ -n "$WORKER_SLOT" ] && [ "$APP_INPUT" != weekly-rotation ]; then
            echo "::error::a worker-slot run (${WORKER_SLOT}) proves every app; its app input must be the placeholder weekly-rotation, not '${APP_INPUT}'"
            exit 1
          fi
          if [ "$EVENT" = schedule ] || [ -n "$WORKER_SLOT" ]; then
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          else
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps --app "$APP_INPUT")"
          fi
          echo "apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-auth-proof.gate.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The targets input names targets of this proof
        id: targets
        env:
          TARGETS_INPUT: ${{ inputs.targets }}
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          WORKER_SLOT: ${{ inputs.worker_slot }}
          OBSERVED_WINDOW: ${{ inputs.observed_window }}
          SIGN_IN_FORM: ${{ inputs.sign_in == 'form' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          raw="$(printf '%s' "$TARGETS_INPUT" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$raw" ] || [ "$raw" = all ]; then
            targets=all
          else
            list=""
            IFS=',' read -r -a asked <<< "$raw"
            for t in "${asked[@]}"; do
              case "$t" in
                android|ios|macos|windows|linux) list="${list}${t}"$'\n' ;;
                *)
                  echo "::error::the targets input '${TARGETS_INPUT}' names '${t}': only all, or a comma list of android,ios,macos,windows,linux"
                  exit 1
                  ;;
              esac
            done
            targets="$(printf '%s' "$list" | sort -u | paste -sd, -)"
          fi
          if [ "$targets" != all ] && { [ "$EVENT" = schedule ] || [ -n "$WORKER_SLOT" ]; }; then
            echo "::error::a scheduled or worker-slot run proves every target; its targets input must be all, not '${TARGETS_INPUT}'"
            exit 1
          fi
          # why: an observed dispatch is the android-observed job's proof alone (review of #1189, finding 6): with any
          # other sign_in its job never runs, and with any other target the form legs it would also run can red the run
          # the register cites. So it is refused, as a bad target is.
          if [ -n "${OBSERVED_WINDOW:-}" ]; then
            if [ "${SIGN_IN_FORM:-}" != true ] || [ "$targets" != android ]; then
              echo "::error title=Targets::observed_window needs sign_in=form and targets=android (got sign_in form=${SIGN_IN_FORM:-false}, targets=${targets})"
              exit 1
            fi
          fi
          echo "targets: ${targets}"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-auth-proof.gate.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Did a Darwin input change since this app's last green proof
        id: darwin
        env:
          APPS: ${{ steps.app.outputs.apps }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          WORKER_SLOT: ${{ inputs.worker_slot }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # why: ⏱ 2026-10-29 · fold L303. darwin-inputs.mjs publishes `darwin-inputs: proven head <sha>`, and
          # --since-green takes the newest green run whose gate printed it as the next Darwin BASE. So a run that
          # does not run BOTH Darwin legs never runs it: with neither asked, darwin=false; with one, darwin=true
          # (the leg asked for runs) and still no base — the skipped leg's changes must not be diffed away.
          targets="${TARGETS:-all}"
          if [ "$targets" != all ]; then
            asked_ios=false; asked_macos=false
            case ",${targets}," in *,ios,*) asked_ios=true ;; esac
            case ",${targets}," in *,macos,*) asked_macos=true ;; esac
            if [ "$asked_ios" = false ] && [ "$asked_macos" = false ]; then
              echo "darwin=false" >> "$GITHUB_OUTPUT"
              echo "::nikatru-public::::notice title=DARWIN NOT RUN::targets=${targets} asked for no Darwin target; this run is no Darwin proof and no darwin-inputs base"
              exit 0
            fi
            if [ "$asked_ios" != "$asked_macos" ]; then
              echo "darwin=true" >> "$GITHUB_OUTPUT"
              echo "::nikatru-public::::notice title=DARWIN PARTIAL::targets=${targets} asked for one Darwin target; it runs, and this run is no darwin-inputs base"
              exit 0
            fi
          fi
          darwin=false
          # why: ⏱ 2026-10-31 · O-NATIVE-JOURNEY-TARGETS-INPUT. A run that asks for no Darwin target never runs
          # darwin-inputs: its `proven head` line would make a run whose Darwin legs never ran the next Darwin base
          # (darwin-inputs.mjs --since-green), and a later full run would diff from it and skip them wrongly.
          # An empty TARGETS (the targets step did not answer) is not knowing, and not knowing runs them.
          case ",${TARGETS:-}," in
            ,,|,all,|*,ios,*|*,macos,*) ;;
            *)
              echo "darwin=false" >> "$GITHUB_OUTPUT"
              echo "::nikatru-public::::notice title=DARWIN NOT RUN::targets=${TARGETS} asked for no Darwin target; this run is no Darwin proof and no darwin-inputs base"
              exit 0
              ;;
          esac
          list="$(jq -r '.[]' <<< "$APPS")"
          [ -n "$list" ] || { echo "::error title=Darwin inputs::the gate's app set is empty"; exit 1; }
          for app in $list; do
            node tooling/ci/darwin-inputs.mjs --since-green native-auth-proof.yml --app "$app" > "$RUNNER_TEMP/darwin.txt"
            cat "$RUNNER_TEMP/darwin.txt"
            if [ "$(tail -n 1 "$RUNNER_TEMP/darwin.txt")" != "darwin=false" ]; then darwin=true; fi
          done
          echo "darwin=${darwin}" >> "$GITHUB_OUTPUT"
          # why: ⏱ 2026-10-17 · review of #757 (MAJOR 1). The weekly schedule runs the Darwin legs on
          # the same rule, so a week with no Darwin input change proves Android, Linux, Windows and web
          # ONLY, and says so on the run: a green with the iOS/macOS jobs skipped is no proof for an
          # iOS or macOS row (channel-register.json: a row's nativeAuth cites a green job on ITS format).
          # Forcing them weekly is ~4 macOS legs per app per week in the 5-job macOS queue — throughput.
          # ⏱ 2026-10-17 · review of #757 (third review, MAJOR 1): published through `::nikatru-public::` — the shell's
          # quiet-step echoes nothing else of a green step, so a plain ::notice or a step-summary line never reached the
          # run. This step is the one public-shell.json publicLines names for this job. The proof itself is the ios /
          # macos JOB conclusion (skipped here), never this line.
          # ⏱ 2026-10-31 · O-NATIVE-AUTH-PROOF-NOTICE-NAMES-EVENT: the weekly Worker slot is a workflow_dispatch too, so
          # the line names the slot when there is one, never "this workflow_dispatch run".
          if [ "$darwin" = false ]; then
            if [ -n "${WORKER_SLOT:-}" ]; then run="weekly Worker-slot run (${WORKER_SLOT})"; else run="${EVENT} run"; fi
            echo "::nikatru-public::::notice title=DARWIN NOT PROVEN::no Darwin input changed since the last green proof, so this ${run} skips the ios and macos jobs and proves the non-Darwin targets only"
          fi
