name: PR re-check (gate-only re-judge of the PR head)

run-name: "${{ github.event.client_payload.ref && (startsWith(github.event.client_payload.ref, 'refs/heads/rehearsal/') && '[rehearsal] ' || startsWith(github.event.client_payload.ref, 'refs/heads/club/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/train/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/integ/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/land/club-') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/renovate/') && '[bot] ' || startsWith(github.event.client_payload.ref, 'refs/heads/dependabot/') && '[bot] ' || '[single] ') || '[pr] ' }}PR recheck · ${{ github.event.client_payload.head_sha }} (PR #${{ github.event.client_payload.pr }})"

on:
  repository_dispatch:
    types: [nikatru-pr-recheck]

concurrency:
  group: pr-recheck-${{ github.event.client_payload.pr }}
  cancel-in-progress: true

permissions:
  actions: write
  id-token: write

jobs:
  nikatru-recheck:
    name: Re-run only ci-gate of the run that judged the PR's head (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 20
    steps:
      - name: Re-run only ci-gate (generated)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_READ_SECRET: ${{ secrets.BRIDGE_READ_SECRET }}
          NIKATRU_BRIDGE_READ_URL: https://gh-bridge.nikatru.workers.dev/pr-meta
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          NIKATRU_GATE_JOB: ci-gate
          NIKATRU_ROOT: ci.yml
          NIKATRU_RUN_NAME: CI
          NIKATRU_REHEARSAL_TITLE: REHEARSAL
          NIKATRU_WAIT_S: 900
          NIKATRU_POLL_S: 20
          NIKATRU_OIDC_AUDIENCE: nikatru-gh-bridge-propose
        run: |
          # tooling/ci/pr-recheck.sh, written here verbatim by the generator (its header comment dropped).
          set -euo pipefail

          if ! [[ "${NIKATRU_P_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || ! [[ "${NIKATRU_P_PR:-}" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the recheck dispatch names no PR number and head sha"
            exit 1
          fi

          # stderr: unknown also fires inside a $(…) helper, whose stdout is captured; the runner reads both.
          unknown() {
            echo "::error::UNKNOWN — the PR's gate run could not be identified: $1" >&2
            exit 1
          }

          for v in NIKATRU_GATE_JOB NIKATRU_ROOT NIKATRU_RUN_NAME GITHUB_REPOSITORY; do
            [ -n "${!v:-}" ] || unknown "$v is not set"
          done
          [[ "${NIKATRU_WAIT_S:-}" =~ ^[0-9]{1,5}$ ]] || unknown "NIKATRU_WAIT_S is not a number of seconds"
          [[ "${NIKATRU_POLL_S:-}" =~ ^[0-9]{1,4}$ ]] || unknown "NIKATRU_POLL_S is not a number of seconds"
          [ -n "${BRIDGE_READ_SECRET:-}" ] || unknown "BRIDGE_READ_SECRET is not set: the bridge read cannot be signed"
          [[ "${NIKATRU_BRIDGE_READ_URL:-}" =~ ^https://[A-Za-z0-9.-]+/pr-meta$ ]] || [[ "${NIKATRU_BRIDGE_READ_URL:-}" =~ ^http://127\.0\.0\.1:[0-9]+/pr-meta$ ]] || unknown "NIKATRU_BRIDGE_READ_URL is not the bridge's https /pr-meta URL"
          [[ "${NIKATRU_REHEARSAL_TITLE:-}" =~ ^([A-Z]{1,32})?$ ]] || unknown "NIKATRU_REHEARSAL_TITLE holds a character this script will not pass"
          retry_base_s="${NIKATRU_RETRY_BASE_S:-1}"
          [[ "$retry_base_s" =~ ^[0-9]{1,2}$ ]] || unknown "NIKATRU_RETRY_BASE_S is not a number of seconds"
          audience="${NIKATRU_OIDC_AUDIENCE:-nikatru-gh-bridge-propose}"
          [[ "$audience" =~ ^[A-Za-z0-9._-]+$ ]] || unknown "NIKATRU_OIDC_AUDIENCE holds a character this script will not pass"

          # One signed live read of the private PR (POST /pr-meta): its head NOW, its state, and the
          # newest gate status on that head. Sets live_head, live_state and gate_url.
          read_live() {
            local ts sig meta line oidc
            ts=$(date +%s)
            # ⏱ sysfix-a4-gh-bridge (A4-01): this job's OIDC token — the bridge reads only this run's own PR.
            oidc=$(curl -sS --fail --max-time 30 --max-redirs 0 -H "authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=$audience" | jq -r 'try .value catch ""') || unknown "the runner would not mint this job's OIDC token"
            [[ "$oidc" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]] || unknown "the runner answered with no OIDC token"
            sig=$(python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["BRIDGE_READ_SECRET"].encode(), sys.argv[1].encode(), hashlib.sha256).hexdigest())' "$NIKATRU_P_PR.$NIKATRU_P_HEAD_SHA.$ts")
            meta=$(curl -sS --fail --max-time 30 --max-redirs 0 -X POST -H 'content-type: application/json' -H "x-bridge-signature: sha256=$sig" -H "x-bridge-oidc: $oidc" --data "{\"number\":$NIKATRU_P_PR,\"sha\":\"$NIKATRU_P_HEAD_SHA\",\"ts\":$ts}" "$NIKATRU_BRIDGE_READ_URL") || unknown "the bridge's live read of PR #$NIKATRU_P_PR failed"
            line=$(jq -r --argjson n "$NIKATRU_P_PR" 'try (if .number == $n and (.head_sha | test("^[0-9a-f]{40}$")) and (.state | type) == "string" and (.ci_gate == null or (.ci_gate.target_url | type) == "string" or .ci_gate.target_url == null) then "\(.head_sha) \(.state) \(.ci_gate.target_url // "-") \(if (.updated_at | type) == "string" and (.updated_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) then .updated_at else "-" end)" else "" end) catch ""' <<<"$meta") || line=""
            [ -n "$line" ] || unknown "the bridge's answer for PR #$NIKATRU_P_PR is not the /pr-meta shape"
            # live_updated: the PR's last change (/pr-meta `updated_at`), "-" when the bridge did not carry one; only (g) reads it.
            read -r live_head live_state gate_url live_updated <<<"$line"
          }

          # (g) The step of the gate job that reads the PR as it is now (gen-public-shell.mjs names it; the shell's ci.yml).
          # run_view carries its start as each job's readAt, from the jobs pages it reads already (no extra GitHub call).
          GATE_READ_STEP="Read the pull request as it is now, by the shell's own reporter (generated)"


          # (a), and (c) before a re-run: a head that moved, or a PR that is not open, is not this recheck's.
          still_ours() {
            if [ "$live_head" != "$NIKATRU_P_HEAD_SHA" ]; then
              echo "PR #$NIKATRU_P_PR's head is now $live_head, not $NIKATRU_P_HEAD_SHA: that head's own run reads the body live; nothing re-run"
              exit 0
            fi
            if [ "$live_state" != open ]; then
              echo "PR #$NIKATRU_P_PR is $live_state, not open: nothing re-run"
              exit 0
            fi
          }

          # THE ONE title rule, for every read that names this PR's run of the head (newest_unfinished_run, newest_head_run):
          # a title, its kind code `[x] ` stripped, is OWN_TITLE, or OWN_REHEARSAL_TITLE when a rehearsal title is configured.
          # ⏱ 2026-11-12 (O-RECHECK-MISSES-DISPATCH-RUNS): a rehearsal's run is titled `<name> · REHEARSAL · <sha> (PR #n)`
          # (ci.yml's run-name, REHEARSAL_RUN_TITLE), so that exact title is this PR's run too; #1347's recheck missed it.
          # ⏱ 2026-11-18 · integ-m2-1117b r10: main's #1577 newest_head_run carried its own copy of the rule without the
          # rehearsal title club M2 had added to the other; both reads now call this one jq def (pr-recheck.test pins it).
          OWN_TITLE="$NIKATRU_RUN_NAME · $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR)"
          OWN_REHEARSAL_TITLE=""
          [ -z "${NIKATRU_REHEARSAL_TITLE:-}" ] || OWN_REHEARSAL_TITLE="$NIKATRU_RUN_NAME · $NIKATRU_REHEARSAL_TITLE · $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR)"
          OURS_JQ='def ours: ((. // "") | sub("^\\[[a-z]+\\] "; "")) as $d | ($d == $t or ($t2 != "" and $d == $t2));'

          # The newest root run of THIS PR's head that has not completed and whose id is greater than $1
          # (0 = any), named by its exact title (OURS_JQ). Prints the id, or nothing. One function for (d) and (e).
          newest_unfinished_run() {
            local after="$1" st runs found newest=""
            for st in queued in_progress waiting pending requested; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$NIKATRU_ROOT" --status "$st" --limit 100 --json databaseId,displayTitle,status) || unknown "the $NIKATRU_ROOT runs that are $st could not be listed"
              found=$(jq -r --arg t "$OWN_TITLE" --arg t2 "$OWN_REHEARSAL_TITLE" --argjson after "$after" "$OURS_JQ"' try ([.[] | select((.displayTitle | ours) and .status != "completed" and (.databaseId | type) == "number" and .databaseId > $after) | .databaseId] | max // "" | tostring) catch "?"' <<<"$runs") || found="?"
              [ "$found" != "?" ] || unknown "the $NIKATRU_ROOT runs that are $st are not a run list"
              if [ -n "$found" ] && { [ -z "$newest" ] || [ "$found" -gt "$newest" ]; }; then newest="$found"; fi
            done
            printf '%s' "$newest"
          }

          # One gh read, asked again on a 429, a 5xx or a dropped connection with tooling/ops/bounded-retry.mjs's plan
          # (backoffPlan(): READ_ATTEMPTS=3 attempts, gaps RETRY_BASE_MS doubling — 1 s, 2 s). The shell checks out nothing, so
          # the plan is mirrored here and pr-recheck.test.mjs holds the two equal: RETRY_GAPS_S is backoffPlan() in seconds,
          # read_attempts is READ_ATTEMPTS, and NIKATRU_RETRY_BASE_S (default 1; 0 in the test) scales the gaps. The classifier
          # mirrors isTransientStatus (429, every 5xx) and readWithBoundedRetry's transport retry of a read (a GET is safe to
          # ask again); any other failure (a 404, a 403) is an answer and is not asked again.
          # gh_read <what failed> gh <args…>: prints gh's stdout. Any other failure, or one past the last attempt, is UNKNOWN
          # (fail closed) naming <what> and gh's first error line.
          # The command is passed whole, so `gh api --paginate …per_page=50` stays on the line assert-run-jobs-reader reads.
          RETRY_GAPS_S="1 2"
          read_attempts=3
          gh_read() {
            local what="$1" out errf gap why attempt=0
            shift
            errf=$(mktemp)
            for gap in $RETRY_GAPS_S -; do
              attempt=$(( attempt + 1 ))
              if out=$("$@" 2>"$errf"); then
                rm -f "$errf"
                printf '%s' "$out"
                return 0
              fi
              why=$(head -n 1 "$errf" | tr -cd '[:print:]' | cut -c1-160)
              if [ "$gap" = - ] || [ "$attempt" -ge "$read_attempts" ] || ! grep -Eqi 'HTTP (5[0-9]{2}|429)|connection reset|connection refused|i/o timeout|TLS handshake timeout|unexpected EOF|context deadline exceeded' "$errf"; then
                echo "$what: the read failed (attempt $attempt of $read_attempts): ${why:-gh failed}" >&2
                break
              fi
              gap=$(( gap * retry_base_s ))
              echo "$what: GitHub answered ${why:-an error}, a retryable answer (attempt $attempt of $read_attempts): asking again in ${gap}s" >&2
              sleep "$gap"
            done
            rm -f "$errf"
            unknown "$what (${why:-gh failed})"
          }

          # Run $1 as {status, jobs:[{name, databaseId, status, startedAt}]} (the shape `gh run view --json status,jobs` had).
          # ⏱ 2026-11-15 · speed-pr-1115 (O-PR-RECHECK-502-ON-BIG-RUNS): that was ONE `gh run view --json status,jobs` (jobs
          # in one 100-job page), and GitHub answered HTTP 502 on big runs (99 jobs): 4 of 4 recheck failures on 11-15. Now the
          # run is read alone, then its latest jobs in pages of 50 (tooling/ops/run-jobs.mjs JOB_PAGE_SIZE), each read
          # bounded-retried by gh_read. The pages must add up to the run's total_count: a short read is UNKNOWN, never judged on
          # the jobs it happened to see (a missing gate job would read as "absent", which exits 0).
          run_view() {
            local run="$1" meta status body n jobs
            meta=$(gh_read "run $run could not be read" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run") || exit 1
            status=$(jq -r 'try (if (.status | type) == "string" then .status else "" end) catch ""' <<<"$meta") || status=""
            [ -n "$status" ] || unknown "run $run is not a run"
            body=$(gh_read "the jobs of run $run could not be read" gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=50") || exit 1
            jobs=$(jq -cs --arg s "$GATE_READ_STEP" 'try (if length > 0 and all(.[]; (.jobs | type) == "array" and (.total_count | type) == "number") then {total: ([.[].total_count] | max), jobs: [.[].jobs[] | {name, databaseId: .id, status, startedAt: .started_at, readAt: ([.steps[]? | select(.name == $s) | .started_at] | if length == 1 and (.[0] | type) == "string" and (.[0] | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$")) then (.[0] | sub("\\.[0-9]+Z$"; "Z")) else "-" end)}]} else "" end) catch ""' <<<"$body") || jobs=""
            [ -n "$jobs" ] && [ "$jobs" != '""' ] || unknown "run $run has no single $NIKATRU_GATE_JOB job: its jobs are not a job list"
            n=$(jq -r 'if (.jobs | length) == .total then "ok" else "\(.jobs | length) of \(.total)" end' <<<"$jobs")
            [ "$n" = ok ] || unknown "the jobs of run $run read short ($n): run $run listed fewer jobs than its total_count"
            jq -c --arg s "$status" '{status: $s, jobs: .jobs}' <<<"$jobs"
          }

          # (d) when no status names a run and none is running: THIS PR's newest root run of the head, of any status, from
          # the root's run list newest first, HEAD_RUN_PAGES pages of 50 at most (a page short of 50 is the list's end). The
          # shell's runs are all of the shell's own main sha, so the run is named by its title, as newest_unfinished_run names
          # it. Prints the id, or nothing when the list holds no such run; past the cap it is UNKNOWN naming the cap.
          HEAD_RUN_PAGES=20
          HEAD_RUN_PER_PAGE=50
          newest_head_run() {
            local page body found id n
            for ((page = 1; page <= HEAD_RUN_PAGES; page++)); do
              body=$(gh_read "the $NIKATRU_ROOT run list (page $page) could not be read" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$NIKATRU_ROOT/runs?per_page=$HEAD_RUN_PER_PAGE&page=$page") || exit 1
              found=$(jq -r --arg t "$OWN_TITLE" --arg t2 "$OWN_REHEARSAL_TITLE" "$OURS_JQ"' try (if (.workflow_runs | type) == "array" then "\([.workflow_runs[] | select((.display_title | ours) and (.id | type) == "number") | .id] | max // "")|\(.workflow_runs | length)" else "?" end) catch "?"' <<<"$body") || found="?"
              [ "$found" != "?" ] || unknown "the $NIKATRU_ROOT run list (page $page) is not a run list"
              id="${found%|*}"
              n="${found#*|}"
              if [ -n "$id" ]; then
                printf '%s' "$id"
                return 0
              fi
              [ "$n" -ge "$HEAD_RUN_PER_PAGE" ] || return 0
            done
            unknown "no $NIKATRU_GATE_JOB status names a run, no $NIKATRU_ROOT run of $NIKATRU_P_HEAD_SHA is running, and the newest $((HEAD_RUN_PAGES * HEAD_RUN_PER_PAGE)) $NIKATRU_ROOT runs hold none of PR #$NIKATRU_P_PR"
          }

          # The status of run $1's gate job: "absent" when it has none yet. Read, never trusted from a list.
          gate_status_of() {
            local run="$1" view st
            view=$(run_view "$run") || exit 1
            st=$(jq -r --arg n "$NIKATRU_GATE_JOB" 'try ([.jobs[] | select(.name == $n)] as $g | if ($g | length) == 0 then "absent" elif ($g | length) == 1 and ($g[0].status | type) == "string" then $g[0].status else "" end) catch ""' <<<"$view") || st=""
            [ -n "$st" ] || unknown "run $run has more than one $NIKATRU_GATE_JOB job, or is not a run"
            printf '%s' "$st"
          }

          prefix="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/"
          deadline=$(( $(date +%s) + NIKATRU_WAIT_S ))
          pinned=""
          scanned=""
          head_run=""
          while :; do
            read_live
            still_ours
            if [ "$gate_url" = - ]; then
              # (d) no gate status yet: the bridge writes a head's statuses only when its run ENDS (report.ts), so this is
              # normally the head's own run still building. Name it by its title, as (e) does, and judge ITS gate job.
              own=$(newest_unfinished_run 0)
              if [ -n "$own" ]; then
                ogate=$(gate_status_of "$own")
                case "$ogate" in
                  absent | queued | waiting | pending | requested)
                    echo "run $own of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) has not reached $NIKATRU_GATE_JOB ($ogate): it reads the body live; nothing re-run"
                    exit 0
                    ;;
                esac
                # its gate has started and may have read the old body: act on that run exactly as (b)/(c)/(e) do.
                [ -n "$pinned" ] || deadline=$(( $(date +%s) + NIKATRU_WAIT_S ))
                pinned="$own"
                gate_url="$prefix$own"
              elif [ -n "$pinned" ]; then
                # the run pinned here has just completed; its status is on its way: judge that run itself.
                gate_url="$prefix$pinned"
              else
                # O-PR-RECHECK-LEAVES-GATE-PENDING: no status names a run (an edit's PENDING carries no URL) and none is
                # running: the gate run has most likely COMPLETED. Read the run list once, and act on this PR's newest run.
                if [ -z "$scanned" ]; then
                  scanned=1
                  head_run=$(newest_head_run) || exit 1
                fi
                if [ -n "$head_run" ]; then
                  echo "no $NIKATRU_GATE_JOB status names a run of $NIKATRU_P_HEAD_SHA (the edit's PENDING, or none) and none is running: run $head_run is PR #$NIKATRU_P_PR's newest $NIKATRU_ROOT run of it; acting on it"
                  gate_url="$prefix$head_run"
                else
                  # neither a status, a running run, nor a listed run of this head: truly not found, so it stays fail-closed (r3).
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    unknown "no $NIKATRU_GATE_JOB status and no running $NIKATRU_ROOT run of $NIKATRU_P_HEAD_SHA after ${NIKATRU_WAIT_S}s, and the $NIKATRU_ROOT run list holds none of PR #$NIKATRU_P_PR"
                  fi
                  sleep "$NIKATRU_POLL_S"
                  continue
                fi
              fi
            fi
            case "$gate_url" in
              "$prefix"*) rest="${gate_url#"$prefix"}" ;;
              *) unknown "the $NIKATRU_GATE_JOB status names no run of this repository" ;;
            esac
            id="${rest%%/*}"
            [[ "$id" =~ ^[1-9][0-9]{0,19}$ ]] || unknown "the $NIKATRU_GATE_JOB status names no run id"
            # (e) named a newer run of this PR's head whose gate may hold the old body's verdict: act on it.
            if [ -n "$pinned" ] && [ "$pinned" -gt "$id" ]; then id="$pinned"; fi
            view=$(run_view "$id") || exit 1
            gate=$(jq -r --arg n "$NIKATRU_GATE_JOB" 'try ([.jobs[] | select(.name == $n)] as $g | if ($g | length) == 1 then "\(.status) \($g[0].databaseId) \($g[0].status) \(if ($g[0].startedAt | type) == "string" and ($g[0].startedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) then $g[0].startedAt else "-" end) \($g[0].readAt // "-")" else "" end) catch ""' <<<"$view") || gate=""
            [ -n "$gate" ] || unknown "run $id has no single $NIKATRU_GATE_JOB job"
            read -r run_status job_id job_status job_started read_at <<<"$gate"
            case "$job_status" in
              queued | waiting | pending | requested)
                echo "$NIKATRU_GATE_JOB of run $id is $job_status: it has not read the body yet, and reads it live; nothing re-run"
                exit 0
                ;;
            esac
            if [ "$run_status" = completed ] && [ "$job_status" = completed ]; then
              read_live
              still_ours
              # (e) a NEWER root run of this PR's head that has not completed: re-running run $id would
              # cancel it through the root's per-PR group. The newest such run is read, never trusted from the list.
              other=$(newest_unfinished_run "$id")
              if [ -n "$other" ]; then
                ogate=$(gate_status_of "$other")
                case "$ogate" in
                  absent | queued | waiting | pending | requested)
                    echo "run $other of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) is newer and its $NIKATRU_GATE_JOB has not read the body yet ($ogate): it reads it live, and re-running run $id would cancel it through the per-PR group; nothing re-run"
                    exit 0
                    ;;
                esac
                echo "run $other of $NIKATRU_P_HEAD_SHA (PR #$NIKATRU_P_PR) is newer and its $NIKATRU_GATE_JOB is $ogate: it may hold the old body's verdict; acting on run $other, not run $id"
                pinned="$other"
                continue
              fi
              # (f) its gate started at or after this recheck was dispatched: it read the body as it is now.
              if [ "$job_started" != - ]; then
                self=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-}" --jq .created_at) || self=""
                if [[ "$self" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] && ! [[ "$job_started" < "$self" ]]; then
                  echo "$NIKATRU_GATE_JOB of run $id started at $job_started, after this recheck was dispatched ($self): its gate started after the edit and read the body as it is now; nothing re-run"
                  exit 0
                fi
              fi
              # (g) its own live read of the PR started AFTER the PR's last change: that read held the edit. Strictly after:
              # both times are whole seconds, so a read in the same second as the change may have missed it, and re-runs.
              if [ "${live_updated:--}" != - ] && [ "${read_at:--}" != - ]; then
                if [[ "$read_at" > "$live_updated" ]]; then
                  echo "$NIKATRU_GATE_JOB of run $id read the pull request at $read_at, after its last change ($live_updated): it judged the body as it is now; nothing re-run"
                  exit 0
                fi
              fi
              gh run rerun "$id" --job "$job_id" --repo "$GITHUB_REPOSITORY"
              echo "re-ran $NIKATRU_GATE_JOB of run $id for $NIKATRU_P_HEAD_SHA: it reads the body as it is now"
              exit 0
            fi
            # (b) in progress: it may already have read the old body; wait for the run to complete, bounded.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::run $id is still $run_status ($NIKATRU_GATE_JOB $job_status) after ${NIKATRU_WAIT_S}s: re-run its $NIKATRU_GATE_JOB once it completes"
              exit 1
            fi
            sleep "$NIKATRU_POLL_S"
          done
