          name: nikatru-handoff-wave-${{ matrix.id }}-answers
          path: .nikatru-handoff/sealed
      - name: Unseal the wave-${{ matrix.id }}-answers hand-off (generated)
        id: nikatru-unseal-2
        if: ${{ (success()) && steps.nikatru-restore-2.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-wave-${{ matrix.id }}-answers-${{ github.run_id }}-run
          NIKATRU_HANDOFF_PREFIX: nikatru-handoff-wave-${{ matrix.id }}-answers-${{ github.run_id }}-
        run: node tooling/ci/shell-handoff.mjs unseal
      - name: Place the wave-${{ matrix.id }}-answers hand-off where download-artifact put it (generated)
        if: ${{ (success()) && steps.nikatru-unseal-2.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TO: ${{ runner.temp }}/wave
        run: |
          mkdir -p "$NIKATRU_TO"
          cp -a .nikatru-handoff/x/. "$NIKATRU_TO/"
          rm -rf .nikatru-handoff/x
      - name: QA with Claude (read-only tools, verdicts scanned)
        timeout-minutes: 75
        env:
          NIKATRU_WAVE_MODE: qa
          NIKATRU_WAVE_ACCOUNT: ${{ matrix.qa }}
          NIKATRU_WAVE_DIR: ${{ runner.temp }}/wave
          NIKATRU_WAVE_LANE: gha-q-${{ github.run_id }}-${{ matrix.id }}
          NIKATRU_WAVE_MODEL: claude-opus-5-5
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (matrix.qa == 'acct1' && secrets.CLAUDE_CODE_OAUTH_TOKEN_ACCT1) || (matrix.qa == 'acct2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_ACCT2) || (matrix.qa == 'acct3' && secrets.CLAUDE_CODE_OAUTH_TOKEN_ACCT3) || (matrix.qa == 'acct4' && secrets.CLAUDE_CODE_OAUTH_TOKEN_ACCT4) || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/i18n/wave/claude-step.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name translations-wave.qa.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Bind each verdict to the answer it reviewed (no secret)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/i18n/wave/packets.mjs seal-qa --dir "$RUNNER_TEMP/wave"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name translations-wave.qa.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage wave-${{ matrix.id }}-qa for this run's later jobs (generated)
        id: nikatru-stage-3
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/wave
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Seal wave-${{ matrix.id }}-qa for this run's later jobs (generated)
        id: nikatru-seal-3
        if: ${{ (!cancelled()) && steps.nikatru-stage-3.outputs.has == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-wave-${{ matrix.id }}-qa-${{ github.run_id }}-run
        run: node tooling/ci/shell-handoff.mjs seal
      - name: Hand off wave-${{ matrix.id }}-qa to this run's later jobs, sealed (generated)
        if: ${{ (!cancelled()) && steps.nikatru-seal-3.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nikatru-handoff-wave-${{ matrix.id }}-qa
          path: .nikatru-handoff/sealed
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          overwrite: true
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-translations-wave.qa.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  import:
    name: Import, retire the auto-rulings, propose the train
    needs: [nikatru-pin, plan, qa]
    if: ${{ !cancelled() && needs.plan.outputs.fire == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    concurrency:
      group: translations-wave-import
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
        timeout-minutes: 5
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        id: nikatru-trusted-tree
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          NIKATRU_TRUSTED_GIT="$(command -v git)"; case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::git does not resolve to an absolute path ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          main="$(git -C .nikatru-trusted rev-parse HEAD:.github/actions)"
          if [ -z "$tree" ] || [ "$tree" != "$main" ]; then echo "::error::.nikatru-trusted: the working tree ($tree) is not private main's .github/actions ($main)"; exit 1; fi
          rm -rf "$RUNNER_TEMP/nikatru-trusted-actions" && mkdir -p "$RUNNER_TEMP/nikatru-trusted-actions" && cp -R .nikatru-trusted/.github "$RUNNER_TEMP/nikatru-trusted-actions/"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "git=$NIKATRU_TRUSTED_GIT" >> "$GITHUB_OUTPUT"
      - name: Verify private main's composite actions are the checked-out tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TRUSTED_TREE: ${{ steps.nikatru-trusted-tree.outputs.tree }}
          NIKATRU_TRUSTED_GIT: ${{ steps.nikatru-trusted-tree.outputs.git }}
        run: |
          case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::.nikatru-trusted: no git path was recorded before the job's own steps ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          rm -rf .nikatru-trusted/.github && mkdir -p .nikatru-trusted && cp -R "$RUNNER_TEMP/nikatru-trusted-actions/.github" .nikatru-trusted/
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          if [ -z "$NIKATRU_TRUSTED_TREE" ] || [ "$tree" != "$NIKATRU_TRUSTED_TREE" ]; then echo "::error::.nikatru-trusted is not the tree checked out from private main ($NIKATRU_TRUSTED_TREE, now $tree): a step of this job edited its copy"; exit 1; fi
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Restore every wave-*-qa hand-off of this run (generated)
        id: nikatru-restore-4
        timeout-minutes: 6
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nikatru-handoff-wave-*-qa
          path: .nikatru-handoff/legs-4
      - name: Unseal and place each wave-*-qa hand-off (generated)
        id: nikatru-unseal-4
        if: ${{ (success()) && steps.nikatru-restore-4.outcome == 'success' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_LEGS: .nikatru-handoff/legs-4
          NIKATRU_HANDOFF_LEG: '^wave-[A-Za-z0-9._-]+-qa$'
          NIKATRU_HANDOFF_RUN: ${{ github.run_id }}
          NIKATRU_TO: ${{ runner.temp }}/wave-in
          NIKATRU_HANDOFF_FLAT: 'false'
        run: node tooling/ci/shell-handoff.mjs unseal-legs
      - name: Verify every answer against its packet and QA, import, render, retire the auto-rulings
        id: import
        timeout-minutes: 80
        env:
          NIKATRU_REF_NAME: train/translations-${{ github.run_id }}
          TRANSLATIONS_BASE: HEAD
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/i18n/wave/import.mjs --in "$RUNNER_TEMP/wave-in" --today "$(date -u +%F)"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name translations-wave.import.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Propose the translations train into main (pull request)
        if: ${{ steps.import.outputs.count != '0' && needs.plan.outputs.dry_run != 'true' }}
        timeout-minutes: 5
        env:
          NIKATRU_PROPOSE_PATH_LINES: ${{ steps.import.outputs.paths }}
          NIKATRU_PROPOSE_BRANCH: train/translations-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: 'Translations train ${{ github.run_id }}: the wave from main (subscription, Actions)'
          NIKATRU_PROPOSE_MESSAGE: |
            Translations train ${{ github.run_id }}: the wave from main (subscription, Actions)

            Translated and QA'd by different Claude subscription sessions in translations-wave.yml run ${{ github.run_id }}; imported by translate.mjs's import step; ${{ steps.import.outputs.owed }} unit(s) still owed.
          NIKATRU_PROPOSE_BODY: |
            Rows: none - machine-written translations train; translate.mjs's import step and the train guards grade it.

            Made by `translations-wave.yml` run `${{ github.run_id }}`: every answer verified against its packet sha and a DIFFERENT session's QA verdict, imported by translate.mjs's import step, rendered by the train's chain, the auto-rulings it covered retired. ${{ steps.import.outputs.owed }} unit(s) still owed: the next wave re-exports exactly them.
          NIKATRU_PROPOSE_ARTIFACT: proposal-translations-wave.import
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name translations-wave.import.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Nothing to propose
        if: ${{ steps.import.outputs.count == '0' || needs.plan.outputs.dry_run == 'true' }}
        timeout-minutes: 1
        env:
          WAVE_COUNT: ${{ steps.import.outputs.count }}
          WAVE_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "translations-wave: nothing proposed (count $WAVE_COUNT, dry run $WAVE_DRY_RUN)"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name translations-wave.import.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-translations-wave.import.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [plan, expiry-page, translate, qa, import]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: plan=${{ needs.plan.result }} expiry-page=${{ needs.expiry-page.result }} translate=${{ needs.translate.result }} qa=${{ needs.qa.result }} import=${{ needs.import.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
