          command: deploy ${{ runner.temp }}/bundle/index.js --no-bundle --config wrangler.jsonc --env-file /dev/null --env sandbox --var RELEASE:${{ env.NIKATRU_SHA }}${{ steps.walkvars.outputs.args }}
