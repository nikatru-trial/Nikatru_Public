          if [ "$WORKER_INPUT" = "all" ]; then
            workers="$all"
            platform=true
          elif [ "$WORKER_INPUT" = "platform" ]; then
            workers='[]'
            platform=true
          elif printf '%s' "$all" | jq -e --arg w "$WORKER_INPUT" 'any(.[]; .worker == $w)' > /dev/null; then
            workers="$(printf '%s' "$all" | jq -c --arg w "$WORKER_INPUT" 'map(select(.worker == $w))')"
            platform=false
