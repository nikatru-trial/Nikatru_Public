          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: "Check out private main's gate scripts beside it (the two checks below run these) (generated: the private tree)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          path: .sandbox-main
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            tooling/ci
            tooling/ops
            tooling/generated
            tooling/app-yaml
            tooling/e2e
            tooling/store
            services
            contracts/entitlement
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Refuse any ref but main
        working-directory: .sandbox-main
        run: node tooling/ci/assert-deploy-ref.mjs --allow sandbox
      - name: ci-gate passed for the commit checked out
        if: inputs.ref != ''
        working-directory: .sandbox-main
        env:
          NIKATRU_JUDGED_TREE: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RULE: ${{ inputs.gate_rule || 'gate' }}
          PR: ${{ inputs.pr }}
        run: node tooling/ci/assert-gate-passed.mjs "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" --pr "$PR" --rule "$RULE"
      - name: Check out private main's composite actions (generated)
        if: matrix.worker.worker != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: matrix.worker.worker != 'none'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: matrix.worker.worker != 'none'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - run: node "$GITHUB_WORKSPACE/.sandbox-main/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts
        if: matrix.worker.worker != 'none'
        working-directory: ${{ matrix.worker.dir }}
      - run: node "$GITHUB_WORKSPACE/.sandbox-main/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund --prefix services/_shared
        if: matrix.worker.worker != 'none'
      - name: The deployed tree is still main's, in THIS job (limb T and the migrations), before any secret step
        if: matrix.worker.worker != 'none'
        working-directory: .sandbox-main
        run: node tooling/ci/sandbox-deploy-preflight.mjs --tree .. --main . --history . && node tooling/ci/assert-sandbox-migrations.mjs --main . --tree ..
      - name: Bundle the app Worker with no token in the environment
        if: matrix.worker.worker != 'none'
        working-directory: ${{ matrix.worker.dir }}
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config wrangler.jsonc --env sandbox --env-file /dev/null
      - name: The sandbox-only credentials are set (named, before any deploy)
        if: matrix.worker.worker != 'none'
        env:
          CLOUDFLARE_SANDBOX_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_WORKERS_TOKEN }}
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        run: |
          missing=0
          for n in CLOUDFLARE_SANDBOX_WORKERS_TOKEN SANDBOX_ADMIN_ROUTE_SECRET; do
            if [ -z "${!n}" ]; then echo "::error title=Sandbox deploy cannot run::$n is not set in the sandbox environment (the lead sets it from the vault). Nothing was deployed."; missing=1; fi
          done
          exit "$missing"
      - name: Apply the Worker's D1 migrations to the sandbox through platform-sandbox (before deploy)
        if: ${{ (matrix.worker.migrations) && matrix.worker.worker != 'none' }}
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          DIR: ${{ matrix.worker.dir }}
          BINDING: ${{ matrix.worker.migrations }}
        working-directory: .sandbox-main
        run: node tooling/ci/sandbox-admin.mjs --migrate --worker "${DIR#services/}" --binding "$BINDING" --root "$GITHUB_WORKSPACE"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        if: matrix.worker.worker != 'none'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_WORKERS_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: deploy ${{ runner.temp }}/bundle/index.js --no-bundle --config wrangler.jsonc --env-file /dev/null --env sandbox --var RELEASE:${{ env.NIKATRU_SHA }}
      - name: Smoke — the sandbox Worker answers at THIS commit
        if: matrix.worker.worker != 'none'
        env:
          WORKER: ${{ matrix.worker.worker }}
        working-directory: .sandbox-main
        run: |
          host="$(node tooling/store/capture-backend.mjs --print-host "$WORKER")"
          node tooling/ops/post-deploy-smoke.mjs --url "$host/v1/health" --field build --expect "$NIKATRU_SHA" --require-ok
