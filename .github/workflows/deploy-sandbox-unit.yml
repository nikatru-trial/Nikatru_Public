          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/sandbox-deploy-preflight.mjs --probe-route --main .
      - name: A branch proof's deploy token cannot reach production (main's copy, before any deploy)
