        working-directory: .sandbox-main
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/sandbox-deploy-preflight.mjs --tree .. --main . --history .
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name deploy-sandbox-unit.workers.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Never install an ancestor over a newer build (SUPERSEDED skips that target)
        id: supersede
