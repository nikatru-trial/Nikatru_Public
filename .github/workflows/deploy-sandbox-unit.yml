            echo "::error::the worker input was '${WORKER_INPUT}', which is not all, platform, or an app Worker worker-set.mjs prints with an env.sandbox block: $(printf '%s' "$all" | jq -r 'map(.worker) | join(", ")'). Nothing was deployed."
