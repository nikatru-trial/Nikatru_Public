        if: needs.workers.outputs.platform == 'true'
        working-directory: services/platform
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config wrangler.jsonc --env sandbox --env-file /dev/null
      - name: Main's checkout is untouched before the first secret step after the workspace install (HEAD, clean worktree, env)
        if: needs.workers.outputs.platform == 'true'
        env:
          MAIN_COMMIT: ${{ steps.sandbox-main.outputs.commit }}
