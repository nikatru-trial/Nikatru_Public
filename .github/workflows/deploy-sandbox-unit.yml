            { echo "workers=${none}"; echo "count=0"; echo "platform=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # why: MAIN'S worker-set.mjs over MAIN's tree (⏱ 2026-11-12 · review of #1380 at 9b83ef42, MAJOR 2b): the matrix
          # `dir` each publishing job deploys with the token is main's, never the deployed head's choice (a dir outside
          # services/, or one limb T does not compare). Its root is its own checkout, .sandbox-main.
