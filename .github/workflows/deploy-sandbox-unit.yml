          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/sandbox-deploy-preflight.mjs --probe-route --main .
      - name: A branch proof's deploy token cannot reach production (main's copy, before any deploy)
        if: inputs.when != 'skip' && (inputs.pr != '' || (github.event.client_payload.ref || 'refs/heads/main') != 'refs/heads/main')
        working-directory: .sandbox-main
        env:
          CLOUDFLARE_SANDBOX_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ci/sandbox-deploy-preflight.mjs --probe-token --main .
      - name: The walk slot's scripts answer the sandbox token (limb S for a slot, main's copy)
        if: inputs.walk_slot != '' && needs.workers.outputs.platform == 'true'
        working-directory: .sandbox-main
        env:
          CLOUDFLARE_SANDBOX_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOT: ${{ inputs.walk_slot }}
        run: |
          set -euo pipefail
          scripts="$(node tooling/ci/sandbox-walk-version.mjs --slot-scripts --slot "$SLOT")"
          node tooling/ci/sandbox-deploy-preflight.mjs --probe-slots --slot-scripts "$scripts" --main .
      - name: A slot walk's branch moves no app Worker (main's copy)
        if: inputs.walk_slot != '' && needs.workers.outputs.platform == 'true'
        working-directory: .sandbox-main
        run: node tooling/ci/sandbox-walk-version.mjs --app-moved --main . --tree "$GITHUB_WORKSPACE"
      - name: A slot walk with its own platform database waits on the admin route's slot host
        if: inputs.walk_slot != '' && inputs.platform_db != ''
        run: |
          echo "::error title=Money walk slot refused::this branch carries a platform migration (its own database), and sandbox-admin.mjs migrates only through platform-sandbox's host: a slot walk cannot migrate its database yet. Walk it serially (the MONEY_WALK_SLOTS variable off) until sandbox-admin.mjs takes the slot's host."
          exit 1
      - name: A branch deploy never runs while a main-only secret is live on platform-sandbox
