# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Part of deploy · Sandbox deploy unit

on:
  workflow_call:
    inputs:
      nikatru_sha:
        description: The private commit the calling run pinned (generated; empty resolves it here).
        required: false
        default: ''
        type: string
      worker:
        description: "Which sandbox Worker to deploy (as the dispatch input)."
        required: false
        default: all
        type: string
      when:
        description: "always (deploy) or skip (ci.yml: this push touches no money path)."
        required: false
        default: always
        type: string
      ref:
        description: "The private commit to deploy (the sha the caller's gate passed); empty deploys the run's own commit."
        required: false
        default: ''
        type: string
      pr:
        description: "The private pull request whose head `ref` is (a private_ref branch run); empty for main."
        required: false
        default: ''
        type: string
      proof:
        description: "'true' for a money proof's own install (ci.yml money-sandbox, money-sandbox-e2e deploy); 'false' never installs an ancestor over a newer build."
        required: false
        default: 'false'
        type: string
      gate_rule:
        description: "'gate' (default) or 'lanes': the rule the in-job gates apply to a pull request head (money-sandbox-e2e.yml's branch proof only)."
        required: false
        default: 'gate'
        type: string
      platform_db:
        description: "A branch proof's own platform database id (money-sandbox-e2e.yml ephemeral-db); empty = the shared sandbox database."
        required: false
        default: ''
        type: string
      platform_db_name:
        description: "That database's name (nk-proof-<run>-<attempt>); empty with platform_db."
        required: false
        default: ''
        type: string
      migrate_after:
        description: "'true' migrates PLATFORM_DB after the deploy, through the new build's binding (restore after an ephemeral proof); 'false' before."
        required: false
        default: 'false'
        type: string
      walk_slot:
        description: "A branch walk's slot number (money-sandbox-e2e.yml walk-slot); empty deploys platform-sandbox as today."
        required: false
        default: ''
        type: string
      walk_stamp:
        description: "That walk's stamp, <run>-<attempt>s<slot> (walk-router.ts WALK_RUN_RE); empty with walk_slot."
        required: false
        default: ''
        type: string
    outputs:
      walk_origin:
        description: "The walk slot's platform origin this deploy put the build on; empty for platform-sandbox."
        value: ${{ jobs.platform.outputs.walk_origin }}
    secrets:
      CLOUDFLARE_SANDBOX_WORKERS_TOKEN:
        required: false
      SANDBOX_ADMIN_ROUTE_SECRET:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      PRIVATE_DEPLOY_KEY:
        required: true
      NIKATRU_DETAIL_KEY:
        required: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  workers:
    name: The sandbox Worker set comes from the register
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workers: ${{ steps.supersede.outputs.workers || steps.set.outputs.workers }}
      count: ${{ steps.supersede.outputs.count || steps.set.outputs.count }}
      platform: ${{ steps.supersede.outputs.platform || steps.set.outputs.platform }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: "Check out private main beside it (the migrations to compare with, and the check itself) (generated: the private tree)"
        if: inputs.when != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          path: .sandbox-main
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            services
            tooling/ci
            tooling/ops
            tooling/store
            tooling/e2e
            tooling/app-yaml
            tooling/lib
            tooling/sites
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: The matrix comes from worker-set.mjs, and the input names one of it
        id: set
        env:
          WORKER_INPUT: ${{ inputs.worker || 'all' }}
          WHEN: ${{ inputs.when || 'always' }}
          WALK_SLOT: ${{ inputs.walk_slot }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # why: NO JOB-LEVEL `if:` IN A POST-GATE CALLEE (assert-green-means-ran A9): a skipped job
          # reads green. `when: skip` (ci.yml: no money path touched) is decided HERE and printed;
          # every later step is gated on these outputs, and the matrix is never empty (GitHub
          # refuses an empty one): a `none` row whose every step is skipped.
          none='[{"worker":"none","dir":"."}]'
          if [ "$WHEN" = "skip" ]; then
            echo "when=skip: this push touches no money path; nothing is deployed to the sandbox."
            { echo "workers=${none}"; echo "count=0"; echo "platform=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # why: MAIN'S worker-set.mjs over MAIN's tree (⏱ 2026-11-12 · review of #1380 at 9b83ef42, MAJOR 2b): the matrix
          # `dir` each publishing job deploys with the token is main's, never the deployed head's choice (a dir outside
          # services/, or one limb T does not compare). Its root is its own checkout, .sandbox-main.
          all="$(node .sandbox-main/tooling/ci/worker-set.mjs --for-deploy --json --app-workers --env sandbox)"
          if [ "$WORKER_INPUT" = "all" ]; then
            workers="$all"
            platform=true
          elif [ "$WORKER_INPUT" = "platform" ]; then
            workers='[]'
            platform=true
          elif printf '%s' "$all" | jq -e --arg w "$WORKER_INPUT" 'any(.[]; .worker == $w)' > /dev/null; then
            workers="$(printf '%s' "$all" | jq -c --arg w "$WORKER_INPUT" 'map(select(.worker == $w))')"
            platform=false
          else
            echo "::error::the worker input was '${WORKER_INPUT}', which is not all, platform, or an app Worker worker-set.mjs prints with an env.sandbox block: $(printf '%s' "$all" | jq -r 'map(.worker) | join(", ")'). Nothing was deployed."
            exit 1
          fi
          if [ -n "$WALK_SLOT" ]; then workers='[]'; echo "walk slot ${WALK_SLOT}: the app Workers stay main's (shared); only the platform script deploys, onto the slot."; fi
          count="$(printf '%s' "$workers" | jq 'length')"
          echo "sandbox app Workers this run deploys (${count}): $(printf '%s' "$workers" | jq -r 'map(.worker) | join(", ")'); platform: ${platform}"
          if [ "$count" = "0" ]; then workers="$none"; fi
          {
            echo "workers=${workers}"
            echo "count=${count}"
            echo "platform=${platform}"
