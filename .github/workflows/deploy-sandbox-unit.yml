        id: nikatru-setup-ok
        run: echo "every setup step before the first check succeeded"
      - name: Every migration this deploy carries is private main's
        if: inputs.when != 'skip'
        working-directory: .sandbox-main
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
