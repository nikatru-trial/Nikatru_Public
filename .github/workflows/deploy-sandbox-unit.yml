        required: false
        default: ''
        type: string
      proof:
        description: "'true' for a money proof's own install (ci.yml money-sandbox, money-sandbox-e2e deploy); 'false' never installs an ancestor over a newer build."
        required: false
        default: 'false'
        type: string
      gate_rule:
