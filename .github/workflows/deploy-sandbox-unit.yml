          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOT: ${{ inputs.walk_slot }}
        run: node tooling/ci/assert-sandbox-branch-secrets.mjs --walk-script --worker platform-sandbox --run "0-$SLOT" --root .
      - name: The walk vars this deploy carries (main's copy)
        id: walkvars
        if: needs.workers.outputs.platform == 'true'
        working-directory: .sandbox-main
        env:
          SLOT: ${{ inputs.walk_slot }}
