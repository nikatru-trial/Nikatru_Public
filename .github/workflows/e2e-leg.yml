            fi
          done
          exit "$missing"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.journey-prepare.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Derive what this run expects (stack, Workers trust, captcha gate)
