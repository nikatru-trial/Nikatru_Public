      - name: Derive what this run expects (stack and Workers trust)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
