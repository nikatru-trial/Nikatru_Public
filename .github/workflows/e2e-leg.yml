        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/verify_consent.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.28 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The captured frames carry drawn text
        if: steps.drive.outcome == 'success'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/e2e/assert-frames-carry-text.mjs apps/${{ matrix.app }}/screenshots
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.29 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store e2e-screenshots-${{ matrix.app }} in the bridge's private home (generated)
        if: always() && steps.user.outcome != 'skipped'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: apps/${{ matrix.app }}/screenshots/
          NIKATRU_ARTIFACT_NAME: e2e-screenshots-${{ matrix.app }}
          NIKATRU_IF_NO_FILES: warn
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Purge test data (always — keep prod pristine)
        if: always() && steps.user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          PLATFORM_D1_DATABASE_ID: ${{ steps.backend.outputs.platform_db }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/purge.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.31 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Purge the delete-leg user too (already gone on a green run)
        if: always() && steps.delete_user.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_URL || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.auth_target || 'production') == 'selfhosted' && secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY || (inputs.auth_target || 'production') == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          E2E_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          E2E_APP_ID: ${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/purge.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.32 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-e2e-leg.e2e.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-e2e-leg.e2e.${{ strategy.job-index }}
          enableCrossOsArchive: true

  native:
    name: Native leg — ${{ matrix.target }} (${{ matrix.app }})
    needs: prepare
    if: inputs.leg == 'e2e' && (inputs.worker_slot == '43 4 * * *')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
        target:
          - android
          - ios
          - macos
          - windows
          - linux
        include:
          - target: android
            os: ubuntu-24.04
            device: emulator-5554
            callback: --callback
            sign_in: token
            tap: --notification-tap
          - target: ios
            os: macos-26
            device: booted
            callback: --callback
            sign_in: token
            tap: ''
          - target: macos
            os: macos-26
            device: macos
            callback: --callback
            sign_in: token
            tap: ''
          - target: windows
            os: windows-2025
            device: windows
            callback: ''
            sign_in: token
            tap: ''
          - target: linux
            os: ubuntu-24.04
            device: linux
            callback: --callback
            sign_in: token
            tap: ''
    env:
      APP: ${{ matrix.app }}
      PROOF_NEEDS_DEVICE: 'true'
      TARGET: ${{ matrix.target }}
      SIGN_IN: ${{ matrix.sign_in }}
      TAP: ${{ matrix.tap }}
      PENDING_FLOWS: run
      DEVICE: ${{ matrix.device }}
      CALLBACK: ${{ matrix.callback }}
      REFUSAL_ANCHOR: ${{ needs.prepare.outputs.refusal_anchor }}
      REFUSAL_APPS: ${{ needs.prepare.outputs.apps }}
      E2E_PROOF_LOG: native-auth-proof.log
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Check out private main's composite actions (generated)
        if: env.PROOF_NEEDS_DEVICE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: env.PROOF_NEEDS_DEVICE == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        if: env.PROOF_NEEDS_DEVICE == 'true'
        with:
          android-ndk: ${{ matrix.target == 'android' }}
      - name: Git may write paths past MAX_PATH
        if: env.PROOF_NEEDS_DEVICE == 'true' && (matrix.target == 'windows')
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          git config --global core.longpaths true
          git config --global --get core.longpaths
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.native.4 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        if: env.PROOF_NEEDS_DEVICE == 'true' && (matrix.target == 'linux')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
