          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.reminder-digest.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
