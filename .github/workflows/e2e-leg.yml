          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Measure the target's captcha posture (ignores it, or enforces it)
        env:
