          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-fallback-fonts.mjs --stage apps/${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The app's API base, from the composer's rule
        run: |
