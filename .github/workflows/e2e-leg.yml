          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.e2e.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage the fallback fonts the bootstrap points at
