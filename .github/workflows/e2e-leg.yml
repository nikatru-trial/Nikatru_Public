  email-sign-up:
    name: A new e-mail customer, end to end (ephemeral identity, ${{ matrix.app }}, n=${{ matrix.n }}, captcha ${{ matrix.captcha }})
    if: inputs.leg == 'new-user'
    needs: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
        n: [1, 2]
        include:
          - n: 1
            onboarding: full
            captcha: pass
          - n: 2
            onboarding: skip
            captcha: 'off'
    env:
      WRANGLER_SEND_METRICS: 'false'
      NUJ_MAIL_READER: mailpit
      SUPABASE_URL: http://127.0.0.1:54321
      WORKER_URL: http://127.0.0.1:8787
      APP_API_URL: https://127.0.0.1:8788
      NUJ_MAIL_URL: http://127.0.0.1:8025
      ALLOW_LIST_ORIGIN_OVERRIDE: http://127.0.0.1:8787
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: The stack's directory and the run's UTC date
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "NUJ_STACK_DIR=${RUNNER_TEMP}/nuj-email" >> "$GITHUB_ENV"
          echo "E2E_NUJ_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        with:
          cache-dependency-path: |
            services/platform/package-lock.json
            services/${{ matrix.app }}-api/package-lock.json
      - name: This run's build identity (APP_VERSION)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          echo "NUJ_APP_VERSION=nuj-${{ github.run_number }}-${NIKATRU_SHA::7}" >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Refuse any non-local URL before a request
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/new-user/journey.mjs isolation
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install the platform Worker
        working-directory: services/platform
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --no-audit --no-fund
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install the app Worker
        working-directory: services/${{ matrix.app }}-api
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --no-audit --no-fund
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Bring up the ephemeral identity stack, with the mail catcher (captcha off, or the always-pass test key)
        timeout-minutes: 8
        env:
          NUJ_CAPTCHA: ${{ matrix.captcha }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/first-sign-in/stack.mjs up --mail --captcha "$NUJ_CAPTCHA"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Apply the D1 migrations (local, one shared state)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          (cd services/${{ matrix.app }}-api && npx wrangler d1 migrations apply APP_DB --local --env sandbox --persist-to "$RUNNER_TEMP/wrangler-state")
          (cd services/platform && npx wrangler d1 migrations apply PLATFORM_DB --local --env sandbox --persist-to "$RUNNER_TEMP/wrangler-state")
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Start the app Worker and the platform Worker against the ephemeral GoTrue
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          stack="${GITHUB_WORKSPACE}/tooling/e2e/first-sign-in/stack.mjs"
          certs="${NUJ_STACK_DIR}/certs"
          appenv="$(node "$stack" worker-env app)"
          platenv="$(node "$stack" worker-env platform)"
          (cd services/${{ matrix.app }}-api && nohup npx wrangler dev --env sandbox --local --ip 127.0.0.1 --port 8788 --inspector-port 9230 \
            --local-protocol https --https-key-path "$certs/local.key" --https-cert-path "$certs/local.pem" \
            --persist-to "$RUNNER_TEMP/wrangler-state" --env-file "$appenv" > "$RUNNER_TEMP/wrangler-app.log" 2>&1 &)
          (cd services/platform && NODE_EXTRA_CA_CERTS="$certs/ca.pem" nohup npx wrangler dev --env sandbox --local --ip 127.0.0.1 --port 8787 --inspector-port 9229 \
            --persist-to "$RUNNER_TEMP/wrangler-state" --env-file "$platenv" > "$RUNNER_TEMP/wrangler.log" 2>&1 &)
          tries=0
          while [ "$tries" -lt 120 ]; do
            if curl -sf --cacert "$certs/ca.pem" "${APP_API_URL}/v1/health" > /dev/null && curl -sf "${WORKER_URL}/v1/health" > /dev/null; then exit 0; fi
            tries=$((tries + 1))
            sleep 1
          done
          echo "::error::the Workers did not both answer (:8788 https, :8787)"
          tail -60 "$RUNNER_TEMP/wrangler-app.log"
          tail -60 "$RUNNER_TEMP/wrangler.log"
          exit 2
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The stack is ready (captcha off, or ON and paired; the catcher answers, the Worker trusts the stack)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/new-user/journey.mjs stack-ready
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The leg plan (walk, or PENDING with its reason)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/new-user/journey.mjs plan
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c
      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage the fallback fonts the bootstrap points at
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/store/capture-fallback-fonts.mjs --stage apps/${{ matrix.app }}
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The new customer — the sign-up form to delete-account (ephemeral)
        id: drive
        timeout-minutes: 25
        working-directory: apps/${{ matrix.app }}
        env:
          NUJ_N: ${{ matrix.n }}
          NUJ_ONBOARDING: ${{ matrix.onboarding }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          chromedriver --port=4444 > "${RUNNER_TEMP}/chromedriver.log" 2>&1 &
          journey="${GITHUB_WORKSPACE}/tooling/e2e/new-user/journey.mjs"
          stack="${GITHUB_WORKSPACE}/tooling/e2e/first-sign-in/stack.mjs"
          anon="$(node "$stack" anon-key)"
          echo "::add-mask::${anon}"
          site="$(node "$stack" site-key)"
          E2E_NUJ_NONCE="$(node "$journey" nonce)"
          echo "::add-mask::${E2E_NUJ_NONCE}"
          export E2E_NUJ_NONCE
          node "$journey" watch --n "$NUJ_N" > "${RUNNER_TEMP}/watch.log" 2>&1 &
          watcher=$!
          drive_code=0
          node "$journey" isolation
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/new_user_journey_test.dart \
            -d web-server --web-port=3000 --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--disable-gpu \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --web-browser-flag=--ignore-certificate-errors \
            --browser-dimension=430x932@1 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$anon" \
            --dart-define=API_BASE_URL="$APP_API_URL" \
            --dart-define=PLATFORM_BASE_URL="$WORKER_URL" \
            --dart-define=CONFIG_BASE_URL="$WORKER_URL" \
            --dart-define=PIN_BACKEND_HOSTS=true \
            --dart-define=APP_VERSION="$NUJ_APP_VERSION" \
            --dart-define=RELEASE_CHANNEL=web \
            --dart-define=E2E_NUJ_TARGET=ephemeral \
            --dart-define=TURNSTILE_SITE_KEY="$site" \
            --dart-define=E2E_NUJ_N="$NUJ_N" \
            --dart-define=E2E_NUJ_DATE="$E2E_NUJ_DATE" \
            --dart-define=E2E_NUJ_NONCE="$E2E_NUJ_NONCE" \
            --dart-define=E2E_NUJ_ONBOARDING="$NUJ_ONBOARDING" 2>&1 | tee "${RUNNER_TEMP}/drive.log" || drive_code=$?
          watch_code=0
          wait "$watcher" || watch_code=$?
          cat "${RUNNER_TEMP}/watch.log"
          if [ "$watch_code" -ne 0 ]; then
            echo "::error title=New-user journey (ephemeral) n=${NUJ_N}::the watcher exited ${watch_code} (allow-list, mail or link); its NUJ lines above name the leg"
            exit 1
          fi
          node "$journey" grade --n "$NUJ_N" --log "${RUNNER_TEMP}/drive.log"
          node "$journey" verify --n "$NUJ_N"
          exit "$drive_code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stack and Worker logs
        if: failure()
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/first-sign-in/stack.mjs logs
          tail -150 "$RUNNER_TEMP/wrangler.log" || true
          tail -150 "$RUNNER_TEMP/wrangler-app.log" || true
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Tear down
        if: always()
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/e2e/first-sign-in/stack.mjs down
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.email-sign-up.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-e2e-leg.email-sign-up.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
