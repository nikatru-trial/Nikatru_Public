        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter config "--enable-${TARGET}-desktop"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name e2e-leg.native.6 -- "$NIKATRU_SHELL" --noprofile --norc -eo pipefail "$NIKATRU_QUIET"
      - name: flutter pub get
