        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: The gate's answer, or always (nightly, dispatch)
        id: plan
        env:
          GATE: ${{ inputs.gate == true }}
          MONEY: ${{ inputs.money }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ "$GATE" = "true" ]; then
            case "$MONEY" in
              true|false) echo "money=${MONEY}" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error title=Money gate::money-plan answered \"$MONEY\", not true or false: FAILING CLOSED."; exit 1 ;;
            esac
            echo "the money gate: money=${MONEY}."
          else
            echo "money=true" >> "$GITHUB_OUTPUT"
            echo "a nightly or dispatched proof: the money path is proven whatever changed."
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name money-sandbox-legs.plan.1 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
