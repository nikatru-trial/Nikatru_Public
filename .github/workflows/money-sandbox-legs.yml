      - name: Check out private main's composite actions (generated)
        if: needs.plan.outputs.money == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: needs.plan.outputs.money == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        if: needs.plan.outputs.money == 'true'
        with:
          cache: 'false'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Linux build and session deps
        if: needs.plan.outputs.money == 'true'
        timeout-minutes: 9
        run: |
          # why the guard: ⏱ 2026-10-23 (lead, run 39978965907) — a branch run builds a checkout that may predate #981's
          # tooling/ops/ci-install-cache.mjs; without it the install runs plain and bounded (no cache), never a missing module.
          cached_install() {
            if [ -f "$GITHUB_WORKSPACE/tooling/ops/ci-install-cache.mjs" ]; then
              node "$GITHUB_WORKSPACE/tooling/ops/ci-install-cache.mjs" run --cache-dir "${DEBS_DIR:-$RUNNER_TEMP/ci-install-debs}" --attempt-minutes "${ATTEMPT_MINUTES:-4}" -- "$@"
              return
            fi
            bound="$(awk -v m="${ATTEMPT_MINUTES:-4}" 'BEGIN { print int(m * 120) + 1 }')"
            echo "::warning title=Install uncached::this checkout has no tooling/ops/ci-install-cache.mjs (it predates #981): $* runs uncached, bounded at ${bound} s"
            if [ "$1" = sudo ]; then timeout -k 15 "$bound" sudo apt-get update; fi
            timeout -k 15 "$bound" "$@"
          }
          cached_install \
            sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            xvfb gnome-keyring dbus-x11 libsecret-tools
      - name: Enable the Linux desktop target
        if: needs.plan.outputs.money == 'true'
        run: flutter config --enable-linux-desktop
      - name: Resolve the workspace
        if: needs.plan.outputs.money == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Install the fleet Playwright (lockfile)
        if: needs.plan.outputs.money == 'true'
        working-directory: _playwright
        run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Open the paywall on the SANDBOX Worker only
        if: needs.plan.outputs.money == 'true'
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        run: node tooling/e2e/money/sandbox-paywall.mjs --open --unless-superseded --history .money-history --by "$GITHUB_RUN_ID"
      - name: The harness, the sandbox Worker and the pinned commit are one commit
        if: needs.plan.outputs.money == 'true'
        run: node tooling/e2e/money/preflight.mjs --one-commit "$NIKATRU_SHA"
      - name: Walk every desktop leg on Linux
        id: walk
        if: needs.plan.outputs.money == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.PADDLE_SANDBOX_CLIENT_TOKEN }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          NK_KEYRING_PROBE: required
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(head -c 24 /dev/urandom | base64 | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            xvfb-run -a -s "-screen 0 1920x1200x24" node tooling/e2e/money/desktop.mjs --target linux --log "$RUNNER_TEMP/money-desktop.log"
          '
          echo "walked=true" >> "$GITHUB_OUTPUT"

