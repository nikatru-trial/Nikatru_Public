      - uses: ./.nikatru-trusted/.github/actions/enable-kvm
        if: success() && !cancelled() && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android')
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Boot an emulator
        if: success() && !cancelled() && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android')
        timeout-minutes: 10
        env:
          API_LEVEL: '34'
        run: bash tooling/ci/boot-emulator.sh --avd money --api "$API_LEVEL"
      - name: Ensure the paywall is open on the SANDBOX Worker only (no write while it is served open)
        timeout-minutes: 15
        if: success() && !cancelled() && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android')
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        run: node tooling/e2e/money/sandbox-paywall.mjs --ensure-open --unless-superseded --history .money-history --by "$GITHUB_RUN_ID"
      - name: The harness, the sandbox Worker and the pinned commit are one commit
        if: success() && !cancelled() && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android')
        run: node tooling/e2e/money/preflight.mjs --one-commit "$NIKATRU_SHA"
      - name: Walk every APK leg on the emulator
        id: walk
        timeout-minutes: 60
        if: success() && !cancelled() && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP: ${{ needs.preflight.outputs.app }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
          PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.PADDLE_SANDBOX_CLIENT_TOKEN }}
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        run: |
          set -euo pipefail
          # why ITS OWN BUYER (lead ruling 2026-11-18: every proof job walks with its own accounts): a fresh throwaway made
          # by THIS job on every attempt; apk.mjs (desktop.mjs desktopBuyer, APK_BUYER) refuses any other address. Removed
          # by this job's always() step below, its Razorpay plans first.
          date +%s > "$RUNNER_TEMP/apk-walk-started"
          out="$RUNNER_TEMP/apk-buyer.out"
          : > "$out"
          if ! GITHUB_OUTPUT="$out" node tooling/e2e/provision_user.mjs; then
            echo "::error title=APK money proof::this job's own buyer could not be provisioned; no APK leg ran."
            exit 1
          fi
          MONEY_APK_EMAIL="$(sed -n 's/^email=//p' "$out")"
          MONEY_APK_PASSWORD="$(sed -n 's/^password=//p' "$out")"
          echo "::add-mask::${MONEY_APK_PASSWORD}"
          export MONEY_APK_EMAIL MONEY_APK_PASSWORD
          node tooling/e2e/money/apk.mjs --device emulator-5554 --log "$RUNNER_TEMP/money-apk.log"
          echo "walked=true" >> "$GITHUB_OUTPUT"
          echo "minutes=$(( ($(date +%s) - ${T0:-$(date +%s)}) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Remove this job's own APK buyer
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && needs.preflight.result == 'success' && needs.open-paywall.result == 'success' && !contains(fromJSON(needs.plan.outputs.held || '[]'), 'apk-android') }}
        timeout-minutes: 10
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
        run: |
          out="$RUNNER_TEMP/apk-buyer.out"
          uid=""
          if [ -f "$out" ]; then uid="$(sed -n 's/^user_id=//p' "$out")"; fi
          since=""
          if [ -s "$RUNNER_TEMP/apk-walk-started" ]; then since="$(cat "$RUNNER_TEMP/apk-walk-started")"; fi
          node tooling/e2e/money/apk.mjs --purge-buyer "$uid" ${since:+--since "$since"}

  close-paywall:
    name: Close the sandbox paywall once every money leg is done
    needs: [plan, preflight, open-paywall, legs, desktop-linux, desktop-windows, apk-android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sandbox
    concurrency:
      group: ${{ needs.plan.outputs.money == 'true' && format('money-sandbox-close-{0}', github.run_id) || format('money-sandbox-noop-close-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out private main's composite actions (generated)
        if: needs.plan.outputs.money == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        id: nikatru-trusted-tree
        if: needs.plan.outputs.money == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          NIKATRU_TRUSTED_GIT="$(command -v git)"; case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::git does not resolve to an absolute path ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          main="$(git -C .nikatru-trusted rev-parse HEAD:.github/actions)"
          if [ -z "$tree" ] || [ "$tree" != "$main" ]; then echo "::error::.nikatru-trusted: the working tree ($tree) is not private main's .github/actions ($main)"; exit 1; fi
          rm -rf "$RUNNER_TEMP/nikatru-trusted-actions" && mkdir -p "$RUNNER_TEMP/nikatru-trusted-actions" && cp -R .nikatru-trusted/.github "$RUNNER_TEMP/nikatru-trusted-actions/"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "git=$NIKATRU_TRUSTED_GIT" >> "$GITHUB_OUTPUT"
      - name: Check out the private tree (generated)
        if: needs.plan.outputs.money == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: "Check out the private history beside it (every branch's commits, no file) (generated: the private tree)"
        if: needs.plan.outputs.money == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          path: .money-history
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify private main's composite actions are the checked-out tree (generated)
        if: needs.plan.outputs.money == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TRUSTED_TREE: ${{ steps.nikatru-trusted-tree.outputs.tree }}
          NIKATRU_TRUSTED_GIT: ${{ steps.nikatru-trusted-tree.outputs.git }}
        run: |
          case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::.nikatru-trusted: no git path was recorded before the job's own steps ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          rm -rf .nikatru-trusted/.github && mkdir -p .nikatru-trusted && cp -R "$RUNNER_TEMP/nikatru-trusted-actions/.github" .nikatru-trusted/
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          if [ -z "$NIKATRU_TRUSTED_TREE" ] || [ "$tree" != "$NIKATRU_TRUSTED_TREE" ]; then echo "::error::.nikatru-trusted is not the tree checked out from private main ($NIKATRU_TRUSTED_TREE, now $tree): a step of this job edited its copy"; exit 1; fi
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: needs.plan.outputs.money == 'true'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Close the sandbox paywall again
        if: needs.plan.outputs.money == 'true'
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        run: node tooling/e2e/money/sandbox-paywall.mjs --close --unless-superseded --history .money-history --by "$GITHUB_RUN_ID"
      - name: The proof jobs, their minutes, and which to re-run
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          RAILS: ${{ needs.preflight.outputs.rails }}
          STARTED: ${{ needs.plan.outputs.started }}
          ATTEMPT: ${{ github.run_attempt }}
        run: node tooling/e2e/money/proof-table.mjs
      - name: The webhook router's per-run counts (this run)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        timeout-minutes: 5
        run: node tooling/e2e/money/route-counts.mjs --run-id "$GITHUB_RUN_ID"

  verdict:
    name: The money proof ran (every proof job walked its legs)
    needs: [plan, preflight, open-paywall, legs, desktop-linux, desktop-windows, apk-android, close-paywall]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
