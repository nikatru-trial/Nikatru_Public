        timeout-minutes: ${{ matrix.rail == 'razorpay' && 30 || 45 }}
        env:
          RAIL: ${{ matrix.rail }}
          APP: subscriptiontracker
          MONEY_EVIDENCE_DIR: ${{ runner.temp }}/money-evidence
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_EMAIL_RAZORPAY: ${{ secrets.TEST_ACCOUNT_EMAIL_RAZORPAY }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.PADDLE_SANDBOX_CLIENT_TOKEN }}
          PADDLE_SANDBOX_NOTIFICATION_SECRET: ${{ secrets.PADDLE_SANDBOX_NOTIFICATION_SECRET }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
          RAZORPAY_TEST_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          case "$RAIL" in
            paddle|razorpay) ;;
            *) echo "::error title=Money sandbox proof cannot run::matrix rail \"$RAIL\" is not one of paddle, razorpay."; exit 1 ;;
          esac
          chrome="$(command -v google-chrome)"
          status=0
          out="$RUNNER_TEMP/throwaway-${RAIL}.out"
          : > "$out"
          if ! GITHUB_OUTPUT="$out" node tooling/e2e/provision_user.mjs; then
            echo "::error title=Money sandbox proof (${RAIL})::the throwaway second account could not be provisioned; the ${RAIL} legs did not run."
            exit 1
          fi
          email="$(sed -n 's/^email=//p' "$out")"
          password="$(sed -n 's/^password=//p' "$out")"
          echo "::add-mask::${password}"
          # why: THE RAIL'S CONSENT ROWS (money run 38905635333 passed every leg and went red here on "no consent
          # anon_id resolved"): the spec logs each consent request its contexts issue (consent-log.mjs), and the
          # purge deletes by that log, or proves from it that no row was written (consent_anon_id.mjs
          # resolveMoneyConsentLog). Removed first, so a log this rail did not write is never read.
          consent_log="$RUNNER_TEMP/money-consent-${RAIL}.log"
          rm -f "$consent_log"
          MONEY_RAIL="$RAIL" THROWAWAY_EMAIL="$email" THROWAWAY_PASSWORD="$password" MONEY_CHROME="$chrome" MONEY_CONSENT_LOG="$consent_log" \
            node --import "$SPAWN_CEILING" --test-timeout=600000 --test --test-reporter=spec tooling/e2e/money/money-sandbox.spec.mjs || status=1
          uid="$(sed -n 's/^user_id=//p' "$out")"
          # why: ALWAYS after the spec, a user or not: the consent rows belong to the browser profiles, not to the user.
          E2E_USER_ID="$uid" E2E_APP_ID=subscriptiontracker E2E_MONEY_CONSENT_LOG="$consent_log" PLATFORM_D1_DATABASE_ID="$(node tooling/e2e/money/preflight.mjs --print-sandbox-platform-db)" \
            node tooling/e2e/purge.mjs || status=1
          # why: the verdict job reads this rail's own key: a proof that never reached this line proved nothing.
          echo "walked_${RAIL}=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: "Money walk fallbacks: ${{ steps.walk.outputs.fallbacks || 'none' }}"
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        env:
          FALLBACKS: ${{ steps.walk.outputs.fallbacks }}
        run: |
          if [ -n "$FALLBACKS" ]; then
            echo "::warning title=Money walk AMBER::$FALLBACKS"
            echo "**AMBER** — $FALLBACKS (a pass that leaned on a lost-event fallback, never a plain green)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no lost-event fallback carried this walk"
          fi
      - name: This rail's leg verdicts into the job summary (no ids)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' }}
        env:
          RAIL: ${{ matrix.rail }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = path.join(process.env.RUNNER_TEMP, "money-evidence");
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".json")) : [];
            const out = [`### ${process.env.RAIL}`, "", "| rail | leg | verdict |", "|---|---|---|"];
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const l of r.legs ?? []) out.push(`| ${r.rail} | ${l.id} | ${l.verdict} |`);
            }
            if (files.length === 0) out.push(`| ${process.env.RAIL} | no evidence record was written | - |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
      - name: Store money-sandbox-evidence-${{ matrix.rail }} in the bridge's private home (generated)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && inputs.evidence != 'false' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/money-evidence/
          NIKATRU_ARTIFACT_NAME: money-sandbox-evidence-${{ matrix.rail }}
          NIKATRU_IF_NO_FILES: error
          NIKATRU_RETENTION_CLASS: release
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

