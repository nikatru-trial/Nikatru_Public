          fi
          MONEY_DESKTOP_EMAIL="$(sed -n 's/^email=//p' "$out")"
          MONEY_DESKTOP_PASSWORD="$(sed -n 's/^password=//p' "$out")"
          echo "::add-mask::${MONEY_DESKTOP_PASSWORD}"
          export MONEY_DESKTOP_EMAIL MONEY_DESKTOP_PASSWORD
