          APP: ${{ needs.preflight.outputs.app }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.PADDLE_SANDBOX_CLIENT_TOKEN }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          NK_KEYRING_PROBE: required
        run: |
          set -euo pipefail
          # why ITS OWN BUYER (⏱ 2026-11-18 · bl-walkpar-1-1118, lead ruling: every proof job walks with its own accounts):
          # a fresh throwaway (tooling/e2e/provision_user.mjs, as each web rail's account B), made by THIS job on every
          # attempt, so no other job — and no earlier attempt — can touch it; desktop.mjs desktopBuyer refuses any other
          # address. Removed by this job's always() step below.
          # why (same fix round, finding 1 MAJOR): BEFORE this job buys, every plan a killed earlier walk left live on a
          # throwaway (its user gone, or kept by a remove step that could not end it) is ended (leftovers.mjs --orphans,
          # bounded; a pipeline account is never touched). Then the walk's start, before the first purchase: the remove
          # step below ends every plan the buyer bought since it, even when this step is killed mid-leg.
          # why the walk GOES ON after a failed sweep (⏱ 2026-11-21 · parallel-walk-carry-1638-1121 fix round, review of 27af9f95
          # MINOR 2): the sweep only ever touches OTHER buyers' plans; this job's buyer is fresh and its own removal step ends
          # its plans. A sweep that could not end an orphan (exit 1) or could not read the list (exit 2, UNKNOWN, never "no
