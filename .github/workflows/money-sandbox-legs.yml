          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: "Check out the private history beside it (every branch's commits, no file) (generated: the private tree)"
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          path: .money-history
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify private main's composite actions are the checked-out tree (generated)
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TRUSTED_TREE: ${{ steps.nikatru-trusted-tree.outputs.tree }}
          NIKATRU_TRUSTED_GIT: ${{ steps.nikatru-trusted-tree.outputs.git }}
        run: |
          case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::.nikatru-trusted: no git path was recorded before the job's own steps ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          rm -rf .nikatru-trusted/.github && mkdir -p .nikatru-trusted && cp -R "$RUNNER_TEMP/nikatru-trusted-actions/.github" .nikatru-trusted/
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          if [ -z "$NIKATRU_TRUSTED_TREE" ] || [ "$tree" != "$NIKATRU_TRUSTED_TREE" ]; then echo "::error::.nikatru-trusted is not the tree checked out from private main ($NIKATRU_TRUSTED_TREE, now $tree): a step of this job edited its copy"; exit 1; fi
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Stamp this proof job's start
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Verify private main's composite actions are the checked-out tree (generated)
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TRUSTED_TREE: ${{ steps.nikatru-trusted-tree.outputs.tree }}
          NIKATRU_TRUSTED_GIT: ${{ steps.nikatru-trusted-tree.outputs.git }}
        run: |
          case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::.nikatru-trusted: no git path was recorded before the job's own steps ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          rm -rf .nikatru-trusted/.github && mkdir -p .nikatru-trusted && cp -R "$RUNNER_TEMP/nikatru-trusted-actions/.github" .nikatru-trusted/
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          if [ -z "$NIKATRU_TRUSTED_TREE" ] || [ "$tree" != "$NIKATRU_TRUSTED_TREE" ]; then echo "::error::.nikatru-trusted is not the tree checked out from private main ($NIKATRU_TRUSTED_TREE, now $tree): a step of this job edited its copy"; exit 1; fi
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        with:
          cache: 'false'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Resolve the workspace
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        run: flutter pub get --enforce-lockfile
      - name: Build the web app against the sandbox Workers
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tooling/e2e/money/build-web.mjs --sha "$NIKATRU_SHA"
      - name: Install the fleet Playwright (lockfile)
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        working-directory: _playwright
        run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright's Chromium (no secrets)
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        timeout-minutes: 5
        working-directory: _playwright
        run: node node_modules/playwright/cli.js install chromium
      - name: Ensure the paywall is open on the SANDBOX Worker only (no write while it is served open)
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        env:
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
        timeout-minutes: 15
        run: node tooling/e2e/money/sandbox-paywall.mjs --ensure-open --unless-superseded --history .money-history --by "$GITHUB_RUN_ID"
      - name: The harness, the sandbox Worker and the pinned commit are one commit
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        run: node tooling/e2e/money/preflight.mjs --one-commit "$NIKATRU_SHA"
      - name: Walk every money leg on this rail
        id: walk
        if: needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail))
        timeout-minutes: ${{ matrix.rail == 'razorpay' && 69 || 75 }}
        env:
          RAIL: ${{ matrix.rail }}
          RAIL_ACCOUNT: ${{ matrix.account }}
          APP: ${{ needs.preflight.outputs.app }}
          MONEY_EVIDENCE_DIR: ${{ runner.temp }}/money-evidence
          MONEY_FAULT_INJECT: ${{ inputs.gate != true && inputs.evidence == 'false' && inputs.fault_inject || '' }}
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          MONEY_OPS_SECRET_SANDBOX: ${{ secrets.MONEY_OPS_SECRET_SANDBOX }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_EMAIL_RAZORPAY: ${{ secrets.TEST_ACCOUNT_EMAIL_RAZORPAY }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.PADDLE_SANDBOX_CLIENT_TOKEN }}
          PADDLE_SANDBOX_NOTIFICATION_SECRET: ${{ secrets.PADDLE_SANDBOX_NOTIFICATION_SECRET }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
          RAZORPAY_TEST_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          case "$RAIL" in
            paddle|razorpay) ;;
            *) echo "::error title=Money sandbox proof cannot run::matrix rail \"$RAIL\" is not one of paddle, razorpay."; exit 1 ;;
          esac
          chrome="$(command -v google-chrome)"
          status=0
          # why: the start BEFORE the buyers are provisioned, so a cancel from here on still has its purge (next step).
          walk_started="$(date +%s)"; echo "$walk_started" > "$RUNNER_TEMP/walk-started-${RAIL}"
          # why TWO per-run buyers (⏱ 2026-11-21 · lane web-rail-throwaway-1121, accounts.mjs WEB_RAIL_THROWAWAY): B, then
          # A (walkBuyerA), each its own file, so no walk of any run ever signs in as another's account; B first, so a
          # failed A still leaves B's purge a file to read.
          for who in b a; do
            out="$RUNNER_TEMP/throwaway-${who}-${RAIL}.out"; : > "$out"
            GITHUB_OUTPUT="$out" node tooling/e2e/provision_user.mjs || { echo "::error title=Money sandbox proof (${RAIL})::per-run buyer ${who} could not be provisioned; the ${RAIL} legs did not run."; exit 1; }
            echo "::add-mask::$(sed -n 's/^password=//p' "$out")"
          done
          kv() { sed -n "s/^$2=//p" "$RUNNER_TEMP/throwaway-$1-${RAIL}.out"; }
          export THROWAWAY_EMAIL="$(kv b email)" THROWAWAY_PASSWORD="$(kv b password)" THROWAWAY_A_EMAIL="$(kv a email)" THROWAWAY_A_PASSWORD="$(kv a password)"
          # why: THE RAIL'S CONSENT ROWS (money run 38905635333 passed every leg and went red here on "no consent
          # anon_id resolved"): the spec logs each consent request its contexts issue (consent-log.mjs), and the
          # purge deletes by that log, or proves from it that no row was written (consent_anon_id.mjs
          # resolveMoneyConsentLog). Removed first, so a log this rail did not write is never read.
          consent_log="$RUNNER_TEMP/money-consent-${RAIL}.log"
          rm -f "$consent_log"
          # why: the before-walk purge, then the spec under the rail's bound, as ONE chain: a purge that could not finish
          # leaves A Pro, so this rail's legs are NOT walked (red, named by the purge); the buyers' purge below still
          # runs. One line, so this step stays under the inline-run standard (24 code lines, O-STD-INLINE-RUN-CEILING).
          # A is the walk's own per-run buyer (--email-var THROWAWAY_A_EMAIL): a fresh account, so the purge finds nothing —
          # KEPT as a cheap invariant (one sign-in, one list; review nit): a provisioner that ever hands back a used address
          # gets its plans ended before the first leg instead of a red purchase-sandbox.
          node tooling/e2e/money/leftovers.mjs --before-walk --budget-minutes 3 --email-var THROWAWAY_A_EMAIL && MONEY_RAIL="$RAIL" MONEY_CHROME="$chrome" MONEY_CONSENT_LOG="$consent_log" node tooling/e2e/money/rail-bound.mjs --rail "$RAIL" -- node --import "$SPAWN_CEILING" --test-timeout=600000 --test --test-reporter=spec tooling/e2e/money/money-sandbox.spec.mjs || status=1
          # why: the verdict job reads this rail's own key: a proof that never reached this line proved nothing.
          echo "walked_${RAIL}=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: This rail's result and minutes (for the proof-job table)
        id: stamp
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        env:
          RAIL: ${{ matrix.rail }}
          OUTCOME: ${{ steps.walk.outcome }}
        run: |
          m="$(( ($(date +%s) - ${T0:-$(date +%s)}) / 60 ))"
          r="${OUTCOME:-not run}"
          case "$RAIL" in
            paddle) { echo "minutes_paddle=$m"; echo "result_paddle=$r"; } >> "$GITHUB_OUTPUT" ;;
            razorpay) { echo "minutes_razorpay=$m"; echo "result_razorpay=$r"; } >> "$GITHUB_OUTPUT" ;;
            *) echo "::error title=Unknown rail::the stamp step has no output key for this rail"; exit 1 ;;
          esac
      - name: End every plan this rail's walk bought, and purge its throwaway (always)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        timeout-minutes: 10
        env:
          RAIL: ${{ matrix.rail }}
          RAIL_ACCOUNT: ${{ matrix.account }}
          SANDBOX_ADMIN_ROUTE_SECRET: ${{ secrets.SANDBOX_ADMIN_ROUTE_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_EMAIL_RAZORPAY: ${{ secrets.TEST_ACCOUNT_EMAIL_RAZORPAY }}
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
        run: |
          set -uo pipefail
          status=0
          started="$RUNNER_TEMP/walk-started-${RAIL}"
          if [ ! -s "$started" ]; then
            echo "the ${RAIL} walk never reached its start (no start file): it provisioned no buyer and bought no plan, none to end."
          else
            # why both per-run buyers (lane web-rail-throwaway-1121): B's and A's plans since the start are ended (one
            # comma list), and each is purged. A never provisioned (its file empty) falls back to the rail's account A.
            uid_of() { sed -n 's/^user_id=//p' "$RUNNER_TEMP/throwaway-$1-${RAIL}.out" 2>/dev/null; }
            THROWAWAY_A_EMAIL="$(sed -n 's/^email=//p' "$RUNNER_TEMP/throwaway-a-${RAIL}.out" 2>/dev/null)"; export THROWAWAY_A_EMAIL
            # why a NAME, never a value (review of 9c25e9ff F1): --email-var takes the env var's name; A's when it was provisioned.
            a_var=THROWAWAY_A_EMAIL; [ -n "$THROWAWAY_A_EMAIL" ] || a_var="$RAIL_ACCOUNT"
            node tooling/e2e/money/leftovers.mjs --after-walk --since "$(cat "$started")" --user-id "$(uid_of b),$(uid_of a)" --budget-minutes 3 --email-var "$a_var" || status=1
            # why the id and the app in variables: env values with no space, so assert-live-writer-provenance reads the purge
            # line; the app from its ONE source (preflight.mjs --print-app, review of 9c25e9ff F4), never typed here.
            db="$(node tooling/e2e/money/preflight.mjs --print-sandbox-platform-db)"
            app="$(node tooling/e2e/money/preflight.mjs --print-app)"
            for who in b a; do
              uid="$(uid_of "$who")"
              if [ "$who" = a ] && [ -z "$uid" ]; then continue; fi
              # why: B a user or not: the consent rows belong to the browser profiles (the same log twice deletes nothing more).
              E2E_USER_ID="$uid" E2E_APP_ID="$app" E2E_MONEY_CONSENT_LOG="$RUNNER_TEMP/money-consent-${RAIL}.log" PLATFORM_D1_DATABASE_ID="$db" node tooling/e2e/purge.mjs || status=1
            done
          fi
          exit "$status"
      - name: "Money walk fallbacks: ${{ steps.walk.outputs.fallbacks || 'none' }}"
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        env:
          FALLBACKS: ${{ steps.walk.outputs.fallbacks }}
        run: |
          if [ -n "$FALLBACKS" ]; then
            echo "::warning title=Money walk AMBER::$FALLBACKS"
            echo "**AMBER** — $FALLBACKS (a pass that leaned on a lost-event fallback, never a plain green)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no lost-event fallback carried this walk"
          fi
      - name: This rail's leg verdicts into the job summary (no ids)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        env:
          RAIL: ${{ matrix.rail }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = path.join(process.env.RUNNER_TEMP, "money-evidence");
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith(".json")) : [];
            const out = [`### ${process.env.RAIL}`, "", "| rail | leg | verdict |", "|---|---|---|"];
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const l of r.legs ?? []) out.push(`| ${r.rail} | ${l.id} | ${l.verdict} |`);
            }
            if (files.length === 0) out.push(`| ${process.env.RAIL} | no evidence record was written | - |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
      - name: Store money-sandbox-evidence-${{ matrix.rail }} in the bridge's private home (generated)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) && inputs.evidence != 'false' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/money-evidence/
          NIKATRU_ARTIFACT_NAME: money-sandbox-evidence-${{ matrix.rail }}
          NIKATRU_IF_NO_FILES: error
          NIKATRU_RETENTION_CLASS: release
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: This rail's leg results (a per-run record, never evidence)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        env:
          RAIL: ${{ matrix.rail }}
          PROOF_SHA: ${{ inputs.ref || env.NIKATRU_SHA }}
        run: |
          if grep -q -- "'--leg-results'" tooling/e2e/money/walked.mjs; then
            node tooling/e2e/money/walked.mjs --leg-results --unit "${RAIL}-web" --evidence-dir "$RUNNER_TEMP/money-evidence" --out "$RUNNER_TEMP/money-leg-results"
          else
            echo "::warning title=Money leg results::this checkout predates walked.mjs --leg-results: no leg-results record for ${RAIL}-web."
          fi
      - name: Store money-leg-results-${{ matrix.rail }}-web in the bridge's private home (generated)
        if: ${{ (always()) && needs.plan.outputs.money == 'true' && !contains(fromJSON(needs.plan.outputs.held || '[]'), format('{0}-web', matrix.rail)) }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/money-leg-results/
          NIKATRU_ARTIFACT_NAME: money-leg-results-${{ matrix.rail }}-web
          NIKATRU_IF_NO_FILES: warn
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  desktop-linux:
    name: Desktop money legs — Linux app under xvfb (sandbox)
    needs: [plan, preflight, open-paywall]
    if: always()
    outputs:
      walked: ${{ steps.walk.outputs.walked }}
      minutes: ${{ steps.walk.outputs.minutes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 114
    environment: sandbox
    concurrency:
      group: ${{ format('money-sandbox-desktop-linux-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
