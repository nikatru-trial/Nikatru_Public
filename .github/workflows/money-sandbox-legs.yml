          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "git=$NIKATRU_TRUSTED_GIT" >> "$GITHUB_OUTPUT"
      - name: Check out the private tree (generated)
        if: needs.plan.outputs.money == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.ref || inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: A re-run of failed jobs never redeploys the head, so it is refused (dispatch a resume)
        if: inputs.gate_attempt != '' && inputs.gate_attempt != github.run_attempt
        env:
          RUN_ID: ${{ github.run_id }}
          GATE_ATTEMPT: ${{ inputs.gate_attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "::error title=Re-run of failed jobs refused::attempt $RUN_ATTEMPT re-runs the legs but not the gate and deploy of attempt $GATE_ATTEMPT, so the sandbox does not run this head. Dispatch a resume instead - gh workflow run money-sandbox-e2e.yml -f resume_of=$RUN_ID (or re-run all jobs)." && exit 1
