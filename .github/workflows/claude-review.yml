name: Claude review

run-name: "Claude review · ${{ github.event.client_payload.sha }}${{ github.event.client_payload.pr && format(' (PR #{0})', github.event.client_payload.pr) || '' }}"

on:
  repository_dispatch:
    types: [claude-review]
  workflow_dispatch:
    inputs:
      review_account:
        description: 'The Claude account whose subscription token reviews this run: acct1..acct4. A bridge dispatch with none takes the evidence pack''s reviewAccount.'
        required: false
        type: choice
        options:
          - acct1
          - acct2
          - acct3
          - acct4
      red_drill:
        description: 'A drill: the quiet step of this exact name (e.g. build-platforms.gate.2) goes red after it runs green, so its red detail must reach the private home. Empty: no drill.'
