        run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --prefix tooling/wrangler
      - name: Throw the switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCH: ${{ inputs.switch }}
          RAIL: ${{ inputs.rail }}
          APP: ${{ inputs.app }}
          REASON: ${{ inputs.reason }}
          INCIDENT: ${{ inputs.incident }}
          TARGET_ENV: ${{ inputs.environment }}
          EXECUTE: ${{ inputs.execute }}
          OWNER_PAGE_PUSH_URL: ${{ secrets.OWNER_PAGE_PUSH_URL }}
          OWNER_PAGE_PUSH_TOKEN: ${{ secrets.OWNER_PAGE_PUSH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
