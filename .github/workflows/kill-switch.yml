env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Kill switch

run-name: "${{ (github.event.schedule || github.event.inputs.worker_slot) && '[slot] ' || '[hand] ' }}Kill switch · ${{ inputs.switch }} · ${{ inputs.reason }} · ${{ inputs.environment }} · ${{ inputs.execute }}${{ inputs.rail && format(' · rail {0}', inputs.rail) || '' }}${{ inputs.app && format(' · app {0}', inputs.app) || '' }}"

on:
  workflow_dispatch:
    inputs:
      switch:
        description: 'pause-rail / resume-rail stop or restart ONE rail''s sales; paywall-off stops every sale AND unlocks Pro for everyone; paywall-restore undoes it.'
        required: true
        type: choice
        options:
          - pause-rail
          - resume-rail
          - paywall-off
          - paywall-restore
          - ai-off
          - ai-restore
      rail:
        description: 'pause-rail / resume-rail only: paddle (everywhere but India) or razorpay (India).'
        required: false
        type: string
        default: ''
      app:
        description: 'paywall-off / paywall-restore only: the app id. Empty means the writer''s own default (the workspace app).'
        required: false
        type: string
        default: ''
      reason:
        description: 'One line: what is wrong, or why it is undone. REQUIRED on every dispatch, a dry run too (a drill says why): executed, it pages the owner and goes to the audit line in this run''s PUBLIC log and is the public CI shell''s run TITLE, shown in run lists and notification mails (write it as for the status page, no user or payment detail), never to the served config.'
        required: true
        type: string
      incident:
        description: 'Optional incident id (the status-page slug).'
        required: false
        type: string
        default: ''
      environment:
        description: 'production, or sandbox for a drill.'
        required: true
        type: choice
        options:
          - production
          - sandbox
      execute:
        description: 'Write it. Unticked prints the exact command and changes nothing.'
        required: true
        type: boolean
        default: false

concurrency:
  group: kill-switch
  cancel-in-progress: false

permissions: {}

jobs:
  switch:
    name: Throw the switch, read it back, verify the live Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
