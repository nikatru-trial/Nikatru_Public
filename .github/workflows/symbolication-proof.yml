# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/symbolication-proof.yml of com-nikatru/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Symbolication proof

run-name: "Symbolication proof · ${{ inputs.app }}${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The app whose crash probe to prove: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string

concurrency:
  group: symbolication-proof-${{ ((github.event.client_payload.event || github.event_name) == 'schedule' || inputs.worker_slot != '') && '(schedule)' || inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
              second="$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | sed -n 2p)"
              if [ "$second" = "$NIKATRU_P_SHA" ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "attempt $NIKATRU_ATTEMPT: $sha is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${second:-none})"
            else
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$NIKATRU_ATTEMPT" -lt "$NIKATRU_ATTEMPTS" ]; then sleep "$NIKATRU_WAIT_S"; fi
      - name: Pin the commit every job of this run checks out (generated)
        id: pin
        shell: bash
        env:
          NIKATRU_PINNED: ${{ steps.nikatru-pin-test-1.outputs.sha }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$NIKATRU_P_SHA" ] && ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the dispatched sha \"$NIKATRU_P_SHA\" is not 40 lowercase hex characters: nothing is pinned"
            exit 1
          fi
          if [ "$NIKATRU_P_MAIN_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a push to main pinned $NIKATRU_PINNED, not the pushed sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
            tip="$(git -C .nikatru-main rev-parse HEAD)"
            if [ "$NIKATRU_PINNED" != "$tip" ]; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not private main's tip $tip (an older commit of main, or a push main has moved past: the tip's own run builds it): nothing is pinned"
              exit 1
            fi
          fi
          if [ "$NIKATRU_P_TAG_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a tag push pinned $NIKATRU_PINNED, not the dispatched sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            tagged="$(git -C .nikatru-tag rev-parse HEAD 2>/dev/null || true)"
            if [ "$tagged" != "$NIKATRU_PINNED" ]; then
              echo "::error::the dispatched tag resolves to ${tagged:-nothing}, not the dispatched sha $NIKATRU_PINNED: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the tagged sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
          fi
          if [ -z "$NIKATRU_PINNED" ]; then
            echo "::error::no candidate became the commit this run builds in 1 attempt(s) (a pull request's merge ref never named the dispatched head $NIKATRU_P_SHA as its second parent): nothing is built — push again, or re-run this workflow"
            exit 1
          fi
          echo "pinned $NIKATRU_PINNED"
          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

  gate:
    needs: [nikatru-pin]
    name: Require ci-gate to have passed, for the apps this run proves
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    outputs:
      sha: ${{ steps.verdict.outputs.sha }}
      apps: ${{ steps.app.outputs.apps }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          fetch-depth: 20
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: The app input names one app of the workspace
        id: app
        env:
          APP_INPUT: ${{ inputs.app }}
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          WORKER_SLOT: ${{ inputs.worker_slot }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          # why: ⏱ 2026-10-26 · cron-off-github-1026: the platform Worker's slot (worker_slot set) IS the schedule, so it
          # proves the whole set. `app` is required, so the Worker sends the placeholder `weekly-rotation`, never read
          # as an app: a worker-slot run carrying any other value is refused; a hand dispatch keeps its own check.
          if [ -n "$WORKER_SLOT" ] && [ "$APP_INPUT" != weekly-rotation ]; then
            echo "::error::a worker-slot run (${WORKER_SLOT}) proves every app; its app input must be the placeholder weekly-rotation, not '${APP_INPUT}'"
            exit 1
          fi
          if [ "$EVENT" = schedule ] || [ -n "$WORKER_SLOT" ]; then
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          else
            apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps --app "$APP_INPUT")"
          fi
          echo "apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.gate.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Require ci-gate to have passed for this commit
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ (github.event.client_payload.event || github.event_name) }}
          GATE_MODE: ${{ inputs.worker_slot != '' && 'newest-green' || '' }}
          NIKATRU_SHELL_DIGEST_FILE: ${{ github.workspace }}/../.nikatru-shell/shell-steps.sha256
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-gate-passed.mjs ${{ env.NIKATRU_SHA }} --schedule-lookback 20 --event "$EVENT_NAME" --output sha --gate-mode "$GATE_MODE"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.gate.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-symbolication-proof.gate.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  prove:
    name: An obfuscated ${{ matrix.target }} crash, symbolicated by GlitchTip, against its known line
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [nikatru-pin, gate]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.gate.outputs.apps) }}
        target: [android-x64, linux-x64]
    env:
      APP: ${{ matrix.app }}
      TARGET: ${{ matrix.target }}
      PROBE_SOURCE: live_probe/symbolication_crash_probe.dart
      SYMBOLS_DIR: build/symbols/probe-${{ matrix.target }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.gate.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Preflight — the two GlitchTip secrets must be present
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          missing=""
          [ -z "$GLITCHTIP_DSN" ] && missing="$missing GLITCHTIP_DSN"
          [ -z "$GLITCHTIP_TOKEN" ] && missing="$missing GLITCHTIP_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Symbolication proof cannot run::Missing secret(s):$missing. This is a failed run, not a skipped one."
            exit 1
          fi
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          android-ndk: 'true'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Resolve the workspace
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The expected crash site, read from the probe source
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node ../../tooling/ops/symbolication-proof.mjs expect --source "$PROBE_SOURCE"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the crash probe (obfuscated release apk)
        if: ${{ matrix.target == 'android-x64' }}
        working-directory: apps/${{ matrix.app }}
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build apk --release --obfuscate --split-debug-info="$SYMBOLS_DIR" --target-platform android-x64 -t "$PROBE_SOURCE" --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        if: ${{ matrix.target == 'linux-x64' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Install the Linux desktop toolchain and a virtual display
        if: ${{ matrix.target == 'linux-x64' }}
        timeout-minutes: 9
        uses: ./.nikatru-trusted/.github/actions/cached-install
        with:
          install: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev xvfb
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Build the crash probe (obfuscated release Linux bundle)
        if: ${{ matrix.target == 'linux-x64' }}
        working-directory: apps/${{ matrix.app }}
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter build linux --release --obfuscate --split-debug-info="$SYMBOLS_DIR" -t "$PROBE_SOURCE" --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$RUNNER_TEMP"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Upload the probe's native debug symbols to GlitchTip
        timeout-minutes: 12
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          gt_org="$(node -p "require('./tooling/ops/glitchtip-project.json').org")"
          gt_project="$(node -p "require('./tooling/ops/glitchtip-project.json').project")"
          node tooling/ops/upload-native-symbols.mjs \
            --cli "${RUNNER_TEMP}/glitchtip-cli" \
            --dir "apps/${APP}/${SYMBOLS_DIR}" \
            --org "$gt_org" --project "$gt_project"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
        if: ${{ matrix.target == 'android-x64' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: ${{ matrix.target == 'android-x64' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/enable-kvm
        if: ${{ matrix.target == 'android-x64' }}
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Boot an emulator, run the probe, capture logcat
        if: ${{ matrix.target == 'android-x64' }}
        env:
          API_LEVEL: '34'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          bash tooling/ci/boot-emulator.sh --avd probe --api "$API_LEVEL"
          # The pinned adb the script installed (it reaches $GITHUB_PATH only from the next step on).
          adb="$(sed -n 's/^BOOT_EMULATOR_ADB=//p' "$GITHUB_ENV" | tail -n 1)"
          [ -x "$adb" ] || { echo "::error title=Emulator::boot-emulator.sh exported no BOOT_EMULATOR_ADB"; exit 1; }
          pkg="com.nikatru.${APP}"
          # Each sub-phase is ASSERTED, in order, and a failure prints the logcat
          # slice that says why (run 35458257697 reached SENT and nothing before
          # it, and the next step could only say "the probe did not run").
          probe_why() {
            "$adb" logcat -d > "${RUNNER_TEMP}/logcat.txt" 2>/dev/null || true
            echo "::error title=Probe::$1"
            echo "── logcat: flutter, crashes, and the app's own pid (tail) ──"
            pid="$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
            grep -E " flutter *:|AndroidRuntime|FATAL|SYMPROBE| Sentry|sentry|${pid:-NO_PID} " "${RUNNER_TEMP}/logcat.txt" | tail -n 120 || true
            exit 1
          }
          timeout 120 "$adb" install -r "apps/${APP}/build/app/outputs/flutter-apk/app-release.apk"
          "$adb" shell pm path "$pkg" | awk '/^package:/ { hit = 1 } END { exit !hit }' || probe_why "INSTALLED: pm has no path for $pkg after install"
          echo "phase ok: installed"
          "$adb" logcat -c
          timeout 120 "$adb" shell am start -W -n "$pkg/.MainActivity"
          # Poll the whole log to a file, never `logcat | grep -q`: under pipefail
          # an early grep exit SIGPIPEs logcat and a match reads as a miss.
          poll() { "$adb" logcat -d -s flutter:I > "${RUNNER_TEMP}/logcat-poll.txt" 2>/dev/null || true; }
          wait_for() {
            local what="$1" needle="$2" ceiling="$3" until_s=$((SECONDS + $3))
            while :; do
              poll
              if grep -qF "$needle" "${RUNNER_TEMP}/logcat-poll.txt"; then
                echo "phase ok: ${what} (${SECONDS}s)"
                return 0
              fi
              if [ -z "$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)" ]; then
                poll
                grep -qF "$needle" "${RUNNER_TEMP}/logcat-poll.txt" && { echo "phase ok: ${what} (${SECONDS}s)"; return 0; }
                probe_why "${what}: the app process is gone before \"${needle}\" appeared"
              fi
              [ "$SECONDS" -gt "$until_s" ] && probe_why "${what}: \"${needle}\" not in logcat within ${ceiling}s"
              sleep 3
            done
          }
          [ -n "$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)" ] \
            || probe_why "LAUNCHED: am start returned but no $pkg process is running"
          echo "phase ok: launched"
          wait_for "BEGIN (probe main ran)" "SYMPROBE|BEGIN " 60
          wait_for "TRACE (the throw was caught and printed)" "SYMPROBE|TRACE-END" 60
          wait_for "SENT (captureException returned)" "SYMPROBE|SENT " 120
          # The native transport sends the envelope it was handed asynchronously.
          sleep 20
          "$adb" logcat -d > "${RUNNER_TEMP}/logcat.txt"
          grep -F 'SYMPROBE|' "${RUNNER_TEMP}/logcat.txt"
          # The SDK's own transport lines, and the app's sockets, printed on every
          # run so a send that never lands is diagnosable from this log alone.
          # Release builds log little here (the SDK's debug flag is off, as in
          # every shipped app); what does appear is kept.
          echo "── SDK / network lines from ${pkg} ──"
          app_pid="$(grep -m1 -F 'SYMPROBE|BEGIN ' "${RUNNER_TEMP}/logcat.txt" | awk '{print $3}')"
          grep -E "^[0-9-]+ [0-9:.]+ +${app_pid:-NO_PID} .*(Sentry|sentry|TrafficStats|okhttp|SSL|Unknown[Hh]ost|[Cc]onnect)" \
            "${RUNNER_TEMP}/logcat.txt" | tail -n 40 || echo "(none)"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Run the probe under xvfb, capture its output
        if: ${{ matrix.target == 'linux-x64' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          out="${RUNNER_TEMP}/logcat.txt"
          bundle="apps/${APP}/build/linux/x64/release/bundle"
          bin="$(find "$bundle" -maxdepth 1 -type f -perm -u+x | sed -n 1p)"
          if [ -z "$bin" ]; then
            ls -la "$bundle" || true
            echo "::error title=Probe::no executable in ${bundle}"
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" "$bin" > "$out" 2>&1 &
          probe_pid=$!
          probe_why() {
            echo "::error title=Probe::$1"
            echo "── probe output (tail) ──"
            tail -n 120 "$out" || true
            kill "$probe_pid" 2>/dev/null || true
            exit 1
          }
          wait_for() {
            local what="$1" needle="$2" until_s=$((SECONDS + $3))
            while :; do
              if grep -qF "$needle" "$out"; then
                echo "phase ok: ${what} (${SECONDS}s)"
                return 0
              fi
              kill -0 "$probe_pid" 2>/dev/null || { grep -qF "$needle" "$out" && return 0; probe_why "${what}: the probe exited before \"${needle}\" appeared"; }
              [ "$SECONDS" -gt "$until_s" ] && probe_why "${what}: \"${needle}\" not in the output within ${3}s"
              sleep 3
            done
          }
          wait_for "BEGIN (probe main ran)" "SYMPROBE|BEGIN " 60
          wait_for "TRACE (the throw was caught and printed)" "SYMPROBE|TRACE-END" 60
          wait_for "SENT (captureException returned)" "SYMPROBE|SENT " 120
          # The Dart HTTP transport sends the envelope asynchronously; the bundle is still running.
          sleep 20
          kill "$probe_pid" 2>/dev/null || true
          grep -F 'SYMPROBE|' "$out"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Extract the raw trace and this run's marker from logcat
        id: extract
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node ../../tooling/ops/symbolication-proof.mjs extract-trace --logcat "${RUNNER_TEMP}/logcat.txt" --out "${RUNNER_TEMP}/trace.txt" --marker-out "${RUNNER_TEMP}/marker.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Ground truth — decode the raw trace offline against the build's own symbols
        id: truth
        working-directory: apps/${{ matrix.app }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          nst="$(node -p "require('../../tooling/versions.json').native_stack_traces")"
          dart pub global activate native_stack_traces "$nst"
          dart pub global run native_stack_traces:decode translate \
            -d "${SYMBOLS_DIR}/app.${TARGET}.symbols" \
            -i "${RUNNER_TEMP}/trace.txt" -o "${RUNNER_TEMP}/symbolized.txt"
          cat "${RUNNER_TEMP}/symbolized.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verdict — both readings against the RECORDED state (ADR 090)
        if: ${{ always() && steps.extract.outcome == 'success' }}
        working-directory: apps/${{ matrix.app }}
        env:
          GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          VERDICT_WAIT_SECONDS: ${{ matrix.target == 'android-x64' && '900' || '300' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node ../../tooling/ops/symbolication-proof.mjs verdict --target "$TARGET" --source "$PROBE_SOURCE" --trace "${RUNNER_TEMP}/trace.txt" --symbolized "${RUNNER_TEMP}/symbolized.txt" --marker "$(cat "${RUNNER_TEMP}/marker.txt")" --report "${RUNNER_TEMP}/symbolication-report.json" --wait-seconds "$VERDICT_WAIT_SECONDS"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store symbolication-proof-evidence-${{ matrix.app }}-${{ matrix.target }} in the bridge's private home (generated)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: |
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/trace.txt
            ${{ runner.temp }}/symbolized.txt
            ${{ runner.temp }}/symbolication-report.json
            ${{ runner.temp }}/marker.txt
            ${{ runner.temp }}/emulator.log
          NIKATRU_ARTIFACT_NAME: symbolication-proof-evidence-${{ matrix.app }}-${{ matrix.target }}
          NIKATRU_IF_NO_FILES: warn
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Stop the emulator
        if: ${{ always() && matrix.target == 'android-x64' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          adb="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb"
          [ -x "$adb" ] && timeout 30 "$adb" emu kill || true
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name symbolication-proof.prove.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-symbolication-proof.prove.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [gate, prove]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: gate=${{ needs.gate.result }} prove=${{ needs.prove.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
