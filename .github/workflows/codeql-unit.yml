        if: ${{ always() && !((github.event.client_payload.event || github.event_name) != 'pull_request' && (github.event.client_payload.ref || 'refs/heads/main') == 'refs/heads/main') }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_BASELINE_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/baseline.key
        run: rm -f "$NIKATRU_BASELINE_KEY_FILE"
      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
          trap-caching: false
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false
      - name: CodeQL counts, the alerts to the private pull request
        if: ${{ env.NIKATRU_PRIVATE_REPO != '' }}
        id: sarif-report
        env:
          BASELINE_KEY: ${{ steps.baseline.outputs.cache-matched-key }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/codeql-sarif-report.mjs "$RUNNER_TEMP/codeql-sarif" --baseline "$RUNNER_TEMP/codeql-baseline/baseline.json" --baseline-verified "$RUNNER_TEMP/codeql-baseline/baseline.verified" --baseline-key "$BASELINE_KEY" --write-baseline "$RUNNER_TEMP/codeql-baseline/baseline.json"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name codeql-unit.analyze.7 --public -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Seal this main analysis's baseline (generated)
        if: ${{ always() && (github.event.client_payload.event || github.event_name) != 'pull_request' && env.NIKATRU_PRIVATE_REPO != '' && steps.sarif-report.outcome != 'skipped' && (github.event.client_payload.event || github.event_name) != 'pull_request' && (github.event.client_payload.ref || 'refs/heads/main') == 'refs/heads/main' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_BASELINE_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/baseline.key
          NIKATRU_BASELINE_CACHE_KEY: codeql-main-baseline-${{ env.NIKATRU_SHA }}
          NIKATRU_BASELINE_DIR: ${{ runner.temp }}/codeql-baseline
        run: |
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          if [ -f "$NIKATRU_BASELINE_DIR/baseline.json" ]; then "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" baseline-seal "$NIKATRU_BASELINE_DIR"; else echo "baseline: none written, nothing to seal"; fi
      - name: Save this main analysis's CodeQL baseline
        if: ${{ always() && (github.event.client_payload.event || github.event_name) != 'pull_request' && env.NIKATRU_PRIVATE_REPO != '' && steps.sarif-report.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/codeql-baseline
          key: codeql-main-baseline-${{ env.NIKATRU_SHA }}
      - name: Forget the baseline key once the baseline is sealed (generated)
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_BASELINE_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/baseline.key
        run: rm -f "$NIKATRU_BASELINE_KEY_FILE"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-codeql-unit.analyze.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-codeql-unit.analyze.${{ strategy.job-index }}
          enableCrossOsArchive: true
