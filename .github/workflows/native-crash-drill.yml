# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Native crash drill

run-name: "${{ (github.event.schedule || github.event.inputs.worker_slot) && '[slot] ' || '[hand] ' }}Native crash drill · ${{ inputs.app }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'The app whose debug build runs the drill: one id of the workspace app set (tooling/ci/assert-release-lane-generic.mjs --emit-apps). The gate job refuses any other value.'
        required: true
        type: string

concurrency:
  group: native-crash-drill-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
