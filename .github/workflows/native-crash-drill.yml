          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

  gate:
    needs: [nikatru-pin]
    name: Require ci-gate to have passed, for the app this drill runs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    outputs:
      sha: ${{ steps.verdict.outputs.sha }}
      app: ${{ steps.app.outputs.app }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
