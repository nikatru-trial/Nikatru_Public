      - name: Turn the NDK handler on in this runner's manifest, and place the drill entrypoint
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          manifest="apps/${APP}/android/app/src/main/AndroidManifest.xml"
