        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/native-crash-drill.mjs verdict --marker "$MARKER" --report "${RUNNER_TEMP}/native-crash-drill-report.json" --wait-seconds 300
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-crash-drill.drill.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store native-crash-drill-evidence-${{ needs.gate.outputs.app }} in the bridge's private home (generated)
        if: always()
