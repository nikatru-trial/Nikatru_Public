    name: A native SIGSEGV on an emulator, read back from GlitchTip with the planted PII gone
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [nikatru-pin, gate]
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ needs.gate.outputs.app }}
      DRILL_SOURCE: live_probe/native_crash_drill.dart
    steps:
      - name: Check out the private tree (generated)
