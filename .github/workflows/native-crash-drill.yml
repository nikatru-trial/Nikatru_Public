          perl -0pi -e 's/(android:name="io\.sentry\.ndk\.enable"\s*android:value=")false"/${1}true"/' "$manifest"
          if cmp -s "$manifest" "${RUNNER_TEMP}/AndroidManifest.orig.xml"; then
            echo "::error title=Native crash drill::${manifest} carries no io.sentry.ndk.enable=false to turn on; the drill would prove nothing"
            exit 1
          fi
          grep -n -A1 'io.sentry.ndk.enable' "$manifest"
          mkdir -p "apps/${APP}/live_probe"
          cp packages/telemetry/drill/native_crash_drill_main.dart "apps/${APP}/${DRILL_SOURCE}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-crash-drill.drill.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Build the drill (debug apk, NDK on)
        working-directory: apps/${{ env.APP }}
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          plant="$(node ../../tooling/ops/native-crash-drill.mjs plant)"
          flutter build apk --debug --target-platform android-x64 -t "$DRILL_SOURCE" \
            --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN" \
            --dart-define=NCDRILL_APP="$APP" \
            --dart-define=NCDRILL_PLANT="$plant"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-crash-drill.drill.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verify private main's composite actions are the checked-out tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_TRUSTED_TREE: ${{ steps.nikatru-trusted-tree.outputs.tree }}
          NIKATRU_TRUSTED_GIT: ${{ steps.nikatru-trusted-tree.outputs.git }}
        run: |
          case "$NIKATRU_TRUSTED_GIT" in /*) ;; *) echo "::error::.nikatru-trusted: no git path was recorded before the job's own steps ($NIKATRU_TRUSTED_GIT)"; exit 1 ;; esac
          rm -rf .nikatru-trusted/.github && mkdir -p .nikatru-trusted && cp -R "$RUNNER_TEMP/nikatru-trusted-actions/.github" .nikatru-trusted/
          if x="$(git rev-parse --git-path info/exclude 2>/dev/null)"; then mkdir -p "${x%/*}"; grep -qxF '/.nikatru-trusted/' "$x" 2>/dev/null || printf '/.nikatru-trusted/\n' >> "$x"; fi
          tree="$(for v in $(compgen -e); do case "$v" in (GIT_*) unset "$v" ;; esac; done && d="$RUNNER_TEMP/nikatru-trusted.$$.$RANDOM" && [ ! -e "$d.git" ] && [ ! -e "$d.index" ] && export GIT_DIR="$d.git" GIT_INDEX_FILE="$d.index" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 && "$NIKATRU_TRUSTED_GIT" init -q --bare --template= "$GIT_DIR" && "$NIKATRU_TRUSTED_GIT" -C .nikatru-trusted --work-tree=. add -A -f .github/actions && "$NIKATRU_TRUSTED_GIT" write-tree --prefix=.github/actions/)"
          if [ -z "$NIKATRU_TRUSTED_TREE" ] || [ "$tree" != "$NIKATRU_TRUSTED_TREE" ]; then echo "::error::.nikatru-trusted is not the tree checked out from private main ($NIKATRU_TRUSTED_TREE, now $tree): a step of this job edited its copy"; exit 1; fi
      - uses: ./.nikatru-trusted/.github/actions/enable-kvm
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Boot an emulator, crash the drill, relaunch it, capture logcat
        env:
          API_LEVEL: '34'
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          bash tooling/ci/boot-emulator.sh --avd drill --api "$API_LEVEL"
          adb="$(sed -n 's/^BOOT_EMULATOR_ADB=//p' "$GITHUB_ENV" | tail -n 1)"
          [ -x "$adb" ] || { echo "::error title=Emulator::boot-emulator.sh exported no BOOT_EMULATOR_ADB"; exit 1; }
          pkg="com.nikatru.${APP}"
          log="${RUNNER_TEMP}/logcat.txt"
          drill_why() {
            "$adb" logcat -d > "$log" 2>/dev/null || true
            echo "::error title=Drill::$1"
            grep -E " flutter *:|AndroidRuntime|FATAL|DEBUG *:|NCDRILL| Sentry|sentry|libc *:" "$log" | tail -n 150 || true
            exit 1
          }
          wait_for() {
            local what="$1" needle="$2" until_s=$((SECONDS + $3))
            while :; do
              "$adb" logcat -d > "$log" 2>/dev/null || true
              grep -qF "$needle" "$log" && { echo "phase ok: ${what} (${SECONDS}s)"; return 0; }
              [ "$SECONDS" -gt "$until_s" ] && drill_why "${what}: \"${needle}\" not in logcat within ${3}s"
              sleep 3
            done
          }
          timeout 180 "$adb" install -r "apps/${APP}/build/app/outputs/flutter-apk/app-debug.apk"
          "$adb" logcat -c
          timeout 120 "$adb" shell am start -W -n "$pkg/.MainActivity"
          wait_for "BEGIN (the drill minted its marker)" "NCDRILL|BEGIN " 120
          # The process must DIE of the signal: poll until it is gone.
          gone=""
          until_gone=$((SECONDS + 120))
          while [ "$SECONDS" -le "$until_gone" ]; do
            if [ -z "$("$adb" shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)" ]; then gone=1; break; fi
            sleep 3
          done
          [ -n "$gone" ] || drill_why "CRASHED: ${pkg} is still running 120 s after BEGIN"
          echo "phase ok: crashed"
          cp "$log" "${RUNNER_TEMP}/logcat-crash.txt"
          timeout 120 "$adb" shell am start -W -n "$pkg/.MainActivity"
          wait_for "RELAUNCH (the held crash was read back)" "NCDRILL|RELAUNCH " 120
          # The release runs on its own thread and the native transport sends asynchronously.
          sleep 30
          "$adb" logcat -d > "$log"
          cat "${RUNNER_TEMP}/logcat-crash.txt" "$log" > "${RUNNER_TEMP}/logcat-all.txt"
          grep -F 'NCDRILL|' "${RUNNER_TEMP}/logcat-all.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-crash-drill.drill.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The marker the drill minted, and the relaunch read back
        id: marker
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          marker="$(node tooling/ops/native-crash-drill.mjs marker --logcat "${RUNNER_TEMP}/logcat-all.txt")"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name native-crash-drill.drill.10 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Verdict — the native event in GlitchTip, scrubbed
