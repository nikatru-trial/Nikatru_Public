          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name lane-guards.guards-platform.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: D1 bindings are real and consistent across Workers
        if: ${{ !cancelled() }}
        run: |
