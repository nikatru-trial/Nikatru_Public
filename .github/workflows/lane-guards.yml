          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name lane-guards.guards-store.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every pin in versions.json carries its reason, and every retire condition is read at the flutter pin
