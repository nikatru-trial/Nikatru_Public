  guards-legal:
    name: Guards — privacy, legal and money
    needs: [detect, pool-guards]
    if: needs.detect.outputs.affected == 'true' && !contains(fromJSON(needs.pool-guards.outputs.adopted), 'guards-legal')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
