          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_LEGS: .nikatru-handoff/legs-10
          NIKATRU_HANDOFF_LEG: '^names-reworded-[A-Za-z0-9._-]+$'
          NIKATRU_HANDOFF_RUN: ${{ github.run_id }}
          NIKATRU_TO: ${{ runner.temp }}/in
          NIKATRU_HANDOFF_FLAT: 'true'
        run: node tooling/ci/shell-handoff.mjs unseal-legs
      - name: Apply every slice and batch
        id: apply
        timeout-minutes: 15
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          base="$(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          for p in "$RUNNER_TEMP"/in/render-*.patch; do [ -s "$p" ] && git apply --index "$p"; done
          # A reworded batch's patch holds its rendered slices too: apply only what is not in the index yet.
          for p in "$RUNNER_TEMP"/in/reword-*.patch; do [ -s "$p" ] && git apply --index --3way "$p"; done
          if git diff --cached --quiet; then
            : > "$RUNNER_TEMP/changed.txt"
          else
            git -c user.name=names-render -c user.email=names-render@invalid commit -qm "names-render ${GITHUB_RUN_ID}"
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          fi
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Re-measure the ledger (the typed list only shrinks)
        timeout-minutes: 15
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/rename-drill.mjs --all --write-ledger
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The entity render is current
        timeout-minutes: 15
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/entity/render.mjs --check
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Keep the merged change
        timeout-minutes: 5
        env:
          NAMES_BASE: ${{ steps.apply.outputs.base }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          test -n "$NAMES_BASE"
          mkdir -p "$RUNNER_TEMP/merged"
          git add -A
          git diff --cached --binary "$NAMES_BASE" > "$RUNNER_TEMP/merged/names-render.patch"
          git diff --cached --name-only "$NAMES_BASE" > "$RUNNER_TEMP/merged/paths.txt"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store names-merged-${{ github.run_id }} in the bridge's private home (generated)
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/merged
          NIKATRU_ARTIFACT_NAME: names-merged-${{ github.run_id }}
          NIKATRU_IF_NO_FILES: error
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload
      - name: Propose names/render-<run_id> (pull request)
        if: env.NAMES_MODE == 'commit' && steps.apply.outputs.count != '0'
        timeout-minutes: 10
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          {
            echo "NIKATRU_PROPOSE_PATH_LINES<<__PATHS__"
            cat "$RUNNER_TEMP/merged/paths.txt"
            echo "__PATHS__"
          } >> "$GITHUB_ENV"
          echo "NIKATRU_PROPOSE_BRANCH=names/render-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "NIKATRU_PROPOSE_BASE=main" >> "$GITHUB_ENV"
          echo "NIKATRU_PROPOSE_TITLE=names: typed copies rendered into their name tokens (run ${GITHUB_RUN_ID})" >> "$GITHUB_ENV"
          echo "NIKATRU_PROPOSE_MESSAGE=names: typed copies rendered into their name tokens (run ${GITHUB_RUN_ID})" >> "$GITHUB_ENV"
          echo "NIKATRU_PROPOSE_BODY=Rows: O-NAMES-TYPED-COPIES-NOT-RENDERED, O-NAMES-CHANGE-IN-ONE-PLACE. Rendered by names-render.yml run ${GITHUB_RUN_ID}; the drill and render.mjs --check passed on the merged tree." >> "$GITHUB_ENV"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Send the proposal
        if: env.NAMES_MODE == 'commit' && steps.apply.outputs.count != '0'
        timeout-minutes: 10
        env:
          NIKATRU_PROPOSE_ARTIFACT: proposal-names-render.merge
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
          NIKATRU_BRIDGE_PROPOSE_URL: https://gh-bridge.nikatru.workers.dev/propose
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/bridge-propose.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name names-render.merge.9 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-names-render.merge.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [plan, render, reword-plan, reword, merge]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: plan=${{ needs.plan.result }} render=${{ needs.render.result }} reword-plan=${{ needs.reword-plan.result }} reword=${{ needs.reword.result }} merge=${{ needs.merge.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
