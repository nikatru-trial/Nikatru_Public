name: names-render

run-name: "names-render · ${{ inputs.classes }} · ${{ inputs.mode }}${{ inputs.prefix && format(' · under {0}', inputs.prefix) || '' }}${{ inputs.limit && inputs.limit != '0' && format(' · limit {0}', inputs.limit) || '' }}${{ inputs.reword == 'true' && ' · reword' || '' }}${{ inputs.account && format(' · {0}', inputs.account) || '' }}"

on:
