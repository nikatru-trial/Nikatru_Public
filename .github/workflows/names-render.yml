    inputs:
      classes:
        description: Comma-separated name classes (brand, support email, app name, extension name).
        required: true
        default: brand
      prefix:
        description: Only typed files under this path prefix (e.g. content/help/), or empty for all.
        required: false
        default: ''
      limit:
        description: At most this many files (0 = all) — a dry run on one slice.
        required: false
        default: '0'
      reword:
        description: Run the Claude reword matrix on the needs-rewording files (true/false).
        required: false
        default: 'false'
      account:
        description: The Claude account for the reword matrix (acct1..acct4).
        required: false
        default: ''
      mode:
        description: artifact keeps the merged patch as an artifact; commit has the bridge open names/render-<run_id>.
        required: true
        default: artifact

