          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.first-sign-in.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Apply the platform D1 migrations (local)
        working-directory: services/platform
        run: |
