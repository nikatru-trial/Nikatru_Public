          exit "$drive_code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.email-sign-up.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stack and Worker logs
