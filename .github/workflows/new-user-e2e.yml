          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.first-sign-in.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Start the platform Worker against the ephemeral GoTrue
        working-directory: services/platform
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
