          set -euo pipefail
          envfile="$(node ../../tooling/e2e/first-sign-in/stack.mjs worker-env)"
          nohup npx wrangler dev --env sandbox --local --ip 127.0.0.1 --port 8787 \
            --persist-to "$RUNNER_TEMP/wrangler-state" --env-file "$envfile" \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          tries=0
          while [ "$tries" -lt 90 ]; do
            if curl -sf http://127.0.0.1:8787/v1/health > /dev/null; then exit 0; fi
            tries=$((tries + 1))
            sleep 1
          done
          echo "::error::the Worker did not answer on :8787"
          tail -60 "$RUNNER_TEMP/wrangler.log"
          exit 2
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.first-sign-in.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
