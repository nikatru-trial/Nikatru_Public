          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name new-user-e2e.first-sign-in.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Check out private main's composite actions (generated)
