  nikatru-report:
    name: Report to the private repository (generated)
    needs: [dry-run, nikatru-collect]
    if: always() && (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out this shell repository only, no private code (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/nikatru
      - name: Report every lane and the gate to the private repository (generated)
        id: send
        if: always()
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL: ${{ needs.nikatru-collect.outputs.detail }}
          NIKATRU_DETAIL_2: ${{ needs.nikatru-collect.outputs.detail_2 }}
          NIKATRU_DETAIL_3: ${{ needs.nikatru-collect.outputs.detail_3 }}
          NIKATRU_RED_LOGS: ${{ needs.nikatru-collect.outputs.red_logs }}
          NIKATRU_RED_LOGS_2: ${{ needs.nikatru-collect.outputs.red_logs_2 }}
          NIKATRU_RED_LOGS_3: ${{ needs.nikatru-collect.outputs.red_logs_3 }}
          NIKATRU_RED_LOGS_4: ${{ needs.nikatru-collect.outputs.red_logs_4 }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref }}
          NIKATRU_RESULTS: '{"dry-run": "${{ needs.dry-run.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/catalog-sync.json
      - name: Report every lane and the gate without detail, as the step above did not run to its end (generated)
        if: always() && steps.send.outputs.reported != 'true'
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref }}
          NIKATRU_RESULTS: '{"dry-run": "${{ needs.dry-run.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/catalog-sync.json
