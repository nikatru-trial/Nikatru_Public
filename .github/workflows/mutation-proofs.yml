# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/mutation-proofs.yml of com-nikatru/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private

name: Mutation proofs

run-name: "Mutation proofs${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  workflow_dispatch:
    inputs:
      worker_slot:
        description: 'Set by the platform Worker cron only: the slot of record it fired for. Empty on a hand dispatch.'
        required: false
        default: ''
        type: string
      private_ref:
        description: The PRIVATE ref this run builds, refs/heads/<branch> (generated; empty is the private main).
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-proofs-${{ (github.event.client_payload.pr || github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') }}
  cancel-in-progress: false

jobs:
  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || inputs.private_ref || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Refuse a private_ref that is not a plain branch other than main (generated)
        shell: bash
        env:
          NIKATRU_PRIVATE_REF: ${{ inputs.private_ref }}
        run: |
          r="$NIKATRU_PRIVATE_REF"
          if [ -z "$r" ]; then echo "private_ref is empty: this run builds private main"; exit 0; fi
          lower="${r,,}"
          case "$lower" in
            main|refs/heads/main) echo "::error title=private_ref names main::$r names private main (in any case); dispatch with an EMPTY private_ref to build main"; exit 1 ;;
          esac
          re='^refs/heads/[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*$'
          # no pipe: a `grep -q` consumer under pipefail can exit before its producer (assert-pipe-consumers)
          if [[ ! "$r" =~ $re ]] || [[ "$r" == *..* ]] || [[ "$r" == *.lock ]] || [[ "$r" == *.lock/* ]] || [[ "$r" == */ ]]; then
            echo "::error title=private_ref is not a plain branch::$r is not refs/heads/<branch> (letters, digits, . _ - and /)"
            exit 1
          fi
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
              second="$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | sed -n 2p)"
              if [ "$second" = "$NIKATRU_P_SHA" ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "attempt $NIKATRU_ATTEMPT: $sha is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${second:-none})"
            else
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$NIKATRU_ATTEMPT" -lt "$NIKATRU_ATTEMPTS" ]; then sleep "$NIKATRU_WAIT_S"; fi
      - name: Pin the commit every job of this run checks out (generated)
        id: pin
        shell: bash
        env:
          NIKATRU_PINNED: ${{ steps.nikatru-pin-test-1.outputs.sha }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$NIKATRU_P_SHA" ] && ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the dispatched sha \"$NIKATRU_P_SHA\" is not 40 lowercase hex characters: nothing is pinned"
            exit 1
          fi
          if [ "$NIKATRU_P_MAIN_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a push to main pinned $NIKATRU_PINNED, not the pushed sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
            tip="$(git -C .nikatru-main rev-parse HEAD)"
            if [ "$NIKATRU_PINNED" != "$tip" ]; then
              echo "::error::the pushed sha $NIKATRU_PINNED is not private main's tip $tip (an older commit of main, or a push main has moved past: the tip's own run builds it): nothing is pinned"
              exit 1
            fi
          fi
          if [ "$NIKATRU_P_TAG_PUSH" = true ] && [ -n "$NIKATRU_PINNED" ]; then
            if [ "$NIKATRU_PINNED" != "$NIKATRU_P_SHA" ]; then
              echo "::error::a tag push pinned $NIKATRU_PINNED, not the dispatched sha $NIKATRU_P_SHA: nothing is pinned"
              exit 1
            fi
            tagged="$(git -C .nikatru-tag rev-parse HEAD 2>/dev/null || true)"
            if [ "$tagged" != "$NIKATRU_PINNED" ]; then
              echo "::error::the dispatched tag resolves to ${tagged:-nothing}, not the dispatched sha $NIKATRU_PINNED: nothing is pinned"
              exit 1
            fi
            if ! git -C .nikatru-main merge-base --is-ancestor "$NIKATRU_PINNED" HEAD; then
              echo "::error::the tagged sha $NIKATRU_PINNED is not a commit of private main: nothing is pinned"
              exit 1
            fi
          fi
          if [ -z "$NIKATRU_PINNED" ]; then
            echo "::error::no candidate became the commit this run builds in 1 attempt(s) (a pull request's merge ref never named the dispatched head $NIKATRU_P_SHA as its second parent): nothing is built — push again, or re-run this workflow"
            exit 1
          fi
          echo "pinned $NIKATRU_PINNED"
          echo "sha=$NIKATRU_PINNED" >> "$GITHUB_OUTPUT"

  execute:
    needs: [nikatru-pin]
    name: Every proven mutation still turns its test red, green control first
    if: (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          cache: 'false'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: flutter pub get
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name mutation-proofs.execute.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Install mason_cli
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          dart pub global activate mason_cli 0.1.4
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name mutation-proofs.execute.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Execute every proven mutation, green control first
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          export PATH="$PATH:$HOME/.pub-cache/bin"
          set +e
          node tooling/ci/assert-mutation-proofs.mjs . --execute
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Mutation proofs are UNKNOWN - nothing was concluded::A green control was red, the named test did not load, or the output carried a loader/analyzer failure, so no mutant's red can be read. The step log names the row."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A recorded mutation no longer turns its test red::The named test passed against the mutated tree, or went red without the recorded message. The row's proof is stale: re-earn it with --execute --only and record the new hash. The step log names the row."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name mutation-proofs.execute.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-mutation-proofs.execute.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  keys:
    needs: [nikatru-pin]
    name: Make this branch run's one-time key for the re-earned records
    if: (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      recipient: ${{ steps.pair.outputs.recipient }}
      node: ${{ steps.pair.outputs.node }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: main
          sparse-checkout: |
            tooling/ci
            tooling/versions.json
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: Make the pair, the private half to a file
        id: pair
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          dir="$RUNNER_TEMP/mutation-proofs-key"
          mkdir -p "$dir"
          node tooling/ci/shell-handoff.mjs keygen --private-out "$dir/private.key" > "$RUNNER_TEMP/mutation-proofs-keygen.txt"
          echo "recipient=$(tail -n 1 "$RUNNER_TEMP/mutation-proofs-keygen.txt")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./tooling/versions.json').node")" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name mutation-proofs.keys.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Stage mutation-proofs-refresh-key for this run's later jobs (generated)
        id: nikatru-stage-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/mutation-proofs-key/
          NIKATRU_IF_NO_FILES: error
        run: node tooling/ci/shell-handoff.mjs stage
      - name: Seal mutation-proofs-refresh-key for this run's later jobs (generated)
        id: nikatru-seal-1
        if: ${{ (success()) && steps.nikatru-stage-1.outputs.has == 'true' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_HANDOFF_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/handoff.key
          NIKATRU_HANDOFF_KEY: nikatru-handoff-mutation-proofs-refresh-key-${{ github.run_id }}-run
        run: node tooling/ci/shell-handoff.mjs seal
      - name: Hand off mutation-proofs-refresh-key to this run's later jobs, sealed (generated)
        if: ${{ (success()) && steps.nikatru-seal-1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nikatru-handoff-mutation-proofs-refresh-key
          path: .nikatru-handoff/sealed
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          overwrite: true
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-mutation-proofs.keys.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  refresh:
    name: Re-earn the proven rows this branch moved (--refresh), green control first
    needs: [nikatru-pin, keys]
    if: (github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main') != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
