        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          export PATH="$PATH:$HOME/.pub-cache/bin"
          out="$RUNNER_TEMP/mutation-proofs-refresh"
          mkdir -p "$out"
          set +e
          (
            base=$(git merge-base origin/main HEAD) || { echo "::error title=No merge-base with main::COVERAGE LOST: the branch shares no history with origin/main in this clone."; exit 2; }
            echo "merge-base with main: $base"
            node tooling/ci/assert-mutation-proofs.mjs . --refresh --base "$base" || exit $?
            node tooling/ci/assert-mutation-proofs.mjs . --refresh --check --base "$base"
          ) > "$out/full.log" 2>&1
          code=$?
          set -e
          cat "$out/full.log"
          tail -c 262144 "$out/full.log" > "$out/refresh.log"
