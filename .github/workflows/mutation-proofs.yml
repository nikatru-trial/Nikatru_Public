        id: seal
        if: always()
        env:
          NIKATRU_HANDOFF_RECIPIENT: ${{ needs.keys.outputs.recipient }}
          NIKATRU_HANDOFF_KEY: mutation-proofs-refresh/${{ github.run_id }}/${{ github.run_attempt }}
          NIKATRU_IF_NO_FILES: error
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          ws="$RUNNER_TEMP/mutation-proofs-seal"
          rm -rf "$ws" && mkdir -p "$ws"
          export NIKATRU_PATHS="$RUNNER_TEMP/mutation-proofs-refresh/"
          (cd "$ws" && node "$GITHUB_WORKSPACE/tooling/ci/shell-handoff.mjs" stage && node "$GITHUB_WORKSPACE/tooling/ci/shell-handoff.mjs" seal)
          echo "sealed=$(base64 -w0 "$ws/.nikatru-handoff/sealed/handoff.bin")" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name mutation-proofs.refresh.7 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"

