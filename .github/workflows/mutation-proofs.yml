        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          dir="$RUNNER_TEMP/mutation-proofs-refresh"
          listing=$(cd "$dir" && find . -mindepth 1 | LC_ALL=C sort | tr '\n' ' ')
          if [ "$listing" != "./refresh.log ./refresh.patch " ]; then echo "::error title=Unexpected hand-off layout::$listing"; exit 1; fi
          for f in refresh.log refresh.patch; do
            if [ ! -f "$dir/$f" ] || [ -L "$dir/$f" ]; then echo "::error title=Not a regular file::$f"; exit 1; fi
            if [ "$(wc -c < "$dir/$f")" -gt 262144 ]; then echo "::error title=Over its cap::$f is above 262144 bytes"; exit 1; fi
