      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-flutter
        with:
          cache: 'false'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || inputs.private_ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - name: flutter pub get
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          flutter pub get --enforce-lockfile
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
