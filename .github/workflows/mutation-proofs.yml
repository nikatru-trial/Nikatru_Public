          node --input-type=module -e "const { unsealStageWith } = await import('./tooling/ci/shell-handoff.mjs'); const fs = await import('node:fs'); await unsealStageWith(process.argv[1], fs.readFileSync(process.argv[2], 'utf8').trim(), process.env.NIKATRU_HANDOFF_KEY);" "$ws" "$RUNNER_TEMP/mutation-proofs-key/private.key"
