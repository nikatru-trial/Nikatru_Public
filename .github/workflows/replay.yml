          sum=0
          n=0; bad=0
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            read -ra w <<< "$line" || true
            [ "${#w[@]}" -eq 0 ] && continue
            n=$((n + 1))
            ok=0
            min=15
            if [ "$n" -gt "$max" ]; then
              echo "REFUSED check $n: more than $max checks in one replay (dispatch the rest as another replay)"; bad=1; continue
            fi
            if [ "${w[0]}" = node ] && [ "${#w[@]}" -eq 3 ] && [ "${w[1]}" = "$runner_flag" ] \
