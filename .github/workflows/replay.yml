            elif [ "${w[0]}" = node ] && [ "${#w[@]}" -ge 2 ] && [ "${#w[@]}" -le 14 ] \
              && [[ "${w[1]}" =~ ^tooling/ci/[a-z0-9][a-z0-9-]*\.mjs$ ]] && [ -f "${w[1]}" ]; then
              ok=1
              for a in "${w[@]:2}"; do [[ "$a" =~ $safe ]] && [[ "/$a/" != */../* ]] || ok=0; done
            elif [ "${w[0]}" = node ] && [ "${#w[@]}" -eq 5 ] && [ "${w[1]}" = tooling/scripts/first-pass.mjs ] \
              && [ "${w[2]}" = --ci ] && [ "${w[3]}" = --only ] && [[ "${w[4]}" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]{0,79}$ ]]; then
