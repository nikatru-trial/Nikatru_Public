              && [ "${w[2]}" = --base ] && [[ "${w[3]}" =~ $hex ]] && [ "${w[4]}" = --no-budget ]; then
              if [ "$aff" -ne 0 ]; then
                echo "REFUSED check $n: a second affected-guards line (one per replay: it is the whole affected set)"; bad=1; continue
              fi
              if ! git cat-file -e "${w[3]}^{commit}" 2>/dev/null; then
