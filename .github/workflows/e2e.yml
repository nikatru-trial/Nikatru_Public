env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private
  NIKATRU_GRADES_SERVED_UNITS: deploy-web deploy-workers

name: E2E live

run-name: "${{ !(github.event.client_payload.pr) && (startsWith(github.event.client_payload.ref, 'refs/tags/') && '[tag] ' || '[main] ') || startsWith(github.event.client_payload.ref, 'refs/heads/rehearsal/') && '[rehearsal] ' || startsWith(github.event.client_payload.ref, 'refs/heads/club/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/train/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/integ/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/renovate/') && '[bot] ' || startsWith(github.event.client_payload.ref, 'refs/heads/dependabot/') && '[bot] ' || '[single] ' }}E2E live · ${{ github.event.client_payload.sha }}${{ github.event.client_payload.pr && format(' (PR #{0})', github.event.client_payload.pr) || '' }}${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  repository_dispatch:
    types: [e2e]
  workflow_dispatch:
    inputs:
      auth_target:
        description: 'Which secret set to run against: production (SUPABASE_*) or selfhosted (SELFHOSTED_SUPABASE_*, Box C).'
        type: choice
        required: false
        default: production
        options:
          - production
          - selfhosted
      pending_flows:
        description: 'run (default): walk the changed flows. skip: skip them and say so.'
        type: choice
        required: false
        default: run
        options:
          - skip
          - run
      worker_slot:
        description: 'Set by the platform Worker cron (the slot of record it fired for) or autopilot-watch after a web deploy (after-deploy). Empty on a hand dispatch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  nikatru-approve:
    name: Wait for a reviewer before unmerged code meets production credentials (generated)
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    environment: store-publish
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name what a reviewer approved (generated)
        shell: bash
        env:
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: echo "approved a run of unmerged code at ${NIKATRU_P_SHA:-the dispatched ref}"

  nikatru-pin:
    name: Pin the private commit this run builds (generated)
    needs: [nikatru-approve]
    if: always() && (needs.nikatru-approve.result == 'success' || (needs.nikatru-approve.result == 'skipped' && !(github.event_name == 'repository_dispatch')))
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out the candidate commit, attempt 1 (generated)
        id: nikatru-pin-checkout-1
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.event == 'pull_request' && github.event.client_payload.bridge.merge_state == 'ready' && github.event.client_payload.bridge.merge_sha) || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Test the candidate commit, attempt 1 (generated)
        id: nikatru-pin-test-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_CHECKOUT: ${{ steps.nikatru-pin-checkout-1.outcome }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_ATTEMPT: '1'
          NIKATRU_ATTEMPTS: '1'
          NIKATRU_WAIT_S: '10'
        run: |
          if [ "$NIKATRU_CHECKOUT" != success ]; then
            echo "attempt $NIKATRU_ATTEMPT: the candidate could not be checked out"
          else
            sha="$(git rev-parse HEAD)"
            if [ "$NIKATRU_P_EVENT" = pull_request ]; then
              if ! [[ $NIKATRU_P_SHA =~ ^[0-9a-f]{40}$ ]]; then echo "::error::the dispatch of a pull request names no 40-hex head sha (\"$NIKATRU_P_SHA\"): nothing is pinned"; exit 1; fi
              second="$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | sed -n 2p)"
              if [ "$second" = "$NIKATRU_P_SHA" ]; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
              echo "attempt $NIKATRU_ATTEMPT: $sha is not yet the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${second:-none})"
            else
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$NIKATRU_ATTEMPT" -lt "$NIKATRU_ATTEMPTS" ]; then sleep "$NIKATRU_WAIT_S"; fi
      - name: Pin the commit every job of this run checks out (generated)
        id: pin
        shell: bash
        env:
          NIKATRU_PINNED: ${{ steps.nikatru-pin-test-1.outputs.sha }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
