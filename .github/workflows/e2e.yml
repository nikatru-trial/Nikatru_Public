          NIKATRU_PROPOSE_PATHS: tooling/e2e-leg-register.json
          NIKATRU_PROPOSE_BRANCH: chore/e2e-last-green-${{ github.run_id }}
          NIKATRU_PROPOSE_BASE: main
          NIKATRU_PROPOSE_TITLE: 'e2e: the legs last green run, written by the run itself'
