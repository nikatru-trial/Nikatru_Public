name: E2E live

run-name: "${{ !(github.event.client_payload.pr) && (startsWith(github.event.client_payload.ref, 'refs/tags/') && '[tag] ' || '[main] ') || startsWith(github.event.client_payload.ref, 'refs/heads/rehearsal/') && '[rehearsal] ' || startsWith(github.event.client_payload.ref, 'refs/heads/club/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/train/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/integ/') && '[club] ' || startsWith(github.event.client_payload.ref, 'refs/heads/renovate/') && '[bot] ' || startsWith(github.event.client_payload.ref, 'refs/heads/dependabot/') && '[bot] ' || '[single] ' }}E2E live · ${{ github.event.client_payload.sha }}${{ github.event.client_payload.pr && format(' (PR #{0})', github.event.client_payload.pr) || '' }}${{ inputs.worker_slot && format(' [worker slot {0}]', inputs.worker_slot) || '' }}"

on:
  repository_dispatch:
    types: [e2e]
  workflow_dispatch:
    inputs:
      auth_target:
        description: 'Which secret set to run against: production (SUPABASE_*) or selfhosted (SELFHOSTED_SUPABASE_*, Box C).'
        type: choice
        required: false
        default: production
        options:
          - production
          - selfhosted
      pending_flows:
        description: 'run (default): walk the changed flows. skip: skip them and say so.'
        type: choice
        required: false
        default: run
        options:
          - skip
          - run
      worker_slot:
        description: 'Set by the platform Worker cron (the slot of record it fired for) or autopilot-watch after a web deploy (after-deploy). Empty on a hand dispatch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  nikatru-approve:
    name: Wait for a reviewer before unmerged code meets production credentials (generated)
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    environment: store-publish
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name what a reviewer approved (generated)
        shell: bash
        env:
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: echo "approved a run of unmerged code at ${NIKATRU_P_SHA:-the dispatched ref}"

