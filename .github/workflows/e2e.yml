    needs: [nikatru-pin]
    name: e2e
    if: needs.nikatru-pin.result == 'success' && !cancelled() && !failure()
    uses: ./.github/workflows/e2e-leg.yml
    with:
      leg: e2e
      auth_target: ${{ (github.event.client_payload.inputs.auth_target || inputs.auth_target) }}
      pending_flows: ${{ inputs.pending_flows }}
      worker_slot: ${{ inputs.worker_slot }}
      nikatru_sha: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
    permissions:
      contents: read
      id-token: write
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SELFHOSTED_SUPABASE_URL: ${{ secrets.SELFHOSTED_SUPABASE_URL }}
      SELFHOSTED_SUPABASE_ANON_KEY: ${{ secrets.SELFHOSTED_SUPABASE_ANON_KEY }}
      SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SELFHOSTED_SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      TEST_INBOX_READ_TOKEN: ${{ secrets.TEST_INBOX_READ_TOKEN }}
      PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
      NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
      BRIDGE_ARTIFACT_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_ARTIFACT_SECRET || '' }}

