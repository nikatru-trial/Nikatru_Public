        working-directory: ${{ github.workspace }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out this shell repository only, no private code (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
