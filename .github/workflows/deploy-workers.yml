# GENERATED by tooling/ci/gen-public-shell.mjs from .github/workflows/deploy-workers.yml of com-nikatru/Nikatru_Private.
# Do not edit: `node tooling/ci/gen-public-shell.mjs --check` re-generates it and fails on any difference.
env:
  NIKATRU_PRIVATE_REPO: com-nikatru/Nikatru_Private
  NIKATRU_SHELL_FINGERPRINT: 1d51f130cd35ed675f8b052d0f260978315cfc8bfb1834aa788ae761e66644fe

name: Part of CI · Deploy workers

on:
  workflow_call:
    inputs:
      nikatru_sha:
        description: The private commit the calling run pinned (generated; empty resolves it here).
        required: false
        default: ''
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      GLITCHTIP_DSN:
        required: true
      SUPABASE_ANON_KEY:
        required: true
      OWNER_PAGE_PUSH_URL:
        required: false
      OWNER_PAGE_PUSH_TOKEN:
        required: false
      PRIVATE_DEPLOY_KEY:
        required: true
      NIKATRU_DETAIL_KEY:
        required: true

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workers:
    name: The app Worker set comes from the register
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workers: ${{ steps.set.outputs.workers }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
          py=python3; python3 -c '' >/dev/null 2>&1 || py=python
          "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" derive
      - name: The matrix comes from worker-set.mjs, never from this file
        id: set
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          workers="$(node tooling/ci/worker-set.mjs --for-deploy --json --app-workers)"
          if [ "$workers" = "[]" ]; then
            echo "::error::worker-set.mjs names no app Worker, and a matrix over none fails: the register holds no appWorkers row with a services/ directory."
            exit 1
          fi
          echo "workers=${workers}" >> "$GITHUB_OUTPUT"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name deploy-workers.workers.2 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Hand this job's red detail to the report job, sealed (generated)
        id: nikatru-handoff
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_DETAIL_KEY_FILE: ${{ github.workspace }}/../.nikatru-shell/detail.key
          NIKATRU_HANDOFF: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-deploy-workers.workers.${{ strategy.job-index }}
        run: |
          if [ -s "$RUNNER_TEMP/report-detail.md" ]; then
            py=python3; python3 -c '' >/dev/null 2>&1 || py=python
            "$py" -I "$GITHUB_WORKSPACE/../.nikatru-shell/report.py" handoff
          fi
      - name: Save the hand-off (generated)
        if: always() && steps.nikatru-handoff.outputs.has == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nikatru-detail
          key: nikatru-detail-${{ github.run_id }}-${{ github.run_attempt }}-deploy-workers.workers.${{ strategy.job-index }}
          enableCrossOsArchive: true

  app-worker:
    name: Deploy ${{ matrix.worker.worker }}
    concurrency:
      group: deploy-workers-${{ matrix.worker.worker }}
      cancel-in-progress: false
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.workers.outputs.workers) }}
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: The shell running this deploy was generated from this commit
        run: node tooling/ci/assert-shell-current.mjs deploy-workers.yml
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs ${{ matrix.worker.worker }} --recipe deploy-workers.yml
      - name: The crash-sink secret this Worker's row names reached this job
        if: steps.plan.outputs.deploy == 'true'
        env:
          DSN_SECRET: ${{ matrix.worker.dsnSecret }}
          DSN: ${{ secrets[matrix.worker.dsnSecret] }}
        run: |
          if [ -z "$DSN" ]; then
            echo "::error::the secret ${DSN_SECRET} (tooling/platform-register.json dsnSecret) is empty in this job: it is unset, or ci.yml's deploy-workers call does not deliver it. Nothing was deployed."
            exit 1
          fi
      - name: Check out private main's composite actions (generated)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts
        if: steps.plan.outputs.deploy == 'true'
        working-directory: ${{ matrix.worker.dir }}
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund --prefix services/_shared
        if: steps.plan.outputs.deploy == 'true'
      - name: Read the Worker's D1 Time Travel bookmark (the restore point before the apply)
        id: time_travel
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: d1 time-travel info ${{ matrix.worker.migrations }} --json
      - name: Record the restore bookmark (refuse the apply without one)
        id: restore_point
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        env:
          D1_TIME_TRAVEL_OUTPUT: ${{ steps.time_travel.outputs.command-output }}
          D1_DATABASE: ${{ matrix.worker.migrations }}
        run: node tooling/ops/d1-restore-bookmark.mjs --database "$D1_DATABASE"
      - name: Name the export bucket (services/platform/wrangler.jsonc BACKUPS_R2)
        id: export_bucket
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        run: node tooling/ops/pre-migration-export.mjs --bucket
      - name: Read the newest export's manifest (the second copy before the apply)
        id: export_manifest
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: r2 object get ${{ steps.export_bucket.outputs.bucket }}/manifests/latest.json --remote --pipe
      - name: Refuse the apply without a complete, fresh export
        id: pre_export
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        env:
          PRE_MIGRATION_MANIFEST: ${{ steps.export_manifest.outputs.command-output }}
          PRE_MIGRATION_DATABASE: ${{ matrix.worker.worker }}/${{ matrix.worker.migrations }}
        run: node tooling/ops/pre-migration-export.mjs
      - name: Record this apply's rollback point in the migration ledger (refuse the apply without it)
        id: ledger
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_MIGRATION_EXPORT_ID: ${{ steps.pre_export.outputs.export }}
          RESTORE_BOOKMARK: ${{ steps.restore_point.outputs.bookmark }}
          PRE_MIGRATION_DATABASE: ${{ matrix.worker.worker }}/${{ matrix.worker.migrations }}
        run: node tooling/ops/pre-migration-export.mjs --record
      - name: Apply the Worker's D1 migrations (before deploy)
        if: steps.plan.outputs.deploy == 'true' && matrix.worker.migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: d1 migrations apply ${{ matrix.worker.migrations }} --remote
      - name: The deployed SQL is SQL live D1 will run
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.dir }}
          command: deploy --var GLITCHTIP_DSN:${{ secrets[matrix.worker.dsnSecret] }} --var RELEASE:${{ env.NIKATRU_SHA }}
      - name: Smoke — the live Worker answers at THIS commit
        id: smoke
        if: steps.plan.outputs.deploy == 'true'
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url ${{ matrix.worker.smokeUrl }}
          --field build --expect ${{ env.NIKATRU_SHA }} --require-ok
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: node tooling/ci/record-deployment.mjs ${{ matrix.worker.worker }} ${{ matrix.worker.origin }} --wrangler-output-env DEPLOY_OUTPUT --recipe deploy-workers.yml --smoke-outcome "${{ steps.smoke.outcome }}"
      - name: Page the owner — this build is live and its smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          OWNER_PAGE_PUSH_URL: ${{ secrets.OWNER_PAGE_PUSH_URL }}
          OWNER_PAGE_PUSH_TOKEN: ${{ secrets.OWNER_PAGE_PUSH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_SHA: ${{ env.NIKATRU_SHA }}
          UNIT: ${{ matrix.worker.worker }}
        run: node tooling/ci/deploy-smoke-page.mjs --unit "$UNIT"

  platform:
    name: Deploy platform
    concurrency:
      group: deploy-workers-platform
      cancel-in-progress: false
    needs: [workers, app-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: The shell running this deploy was generated from this commit
        run: node tooling/ci/assert-shell-current.mjs deploy-workers.yml
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs platform --recipe deploy-workers.yml
      - name: Read this unit's public origin from the register
        id: target
        run: node tooling/ci/site-target.mjs --origin platform >> "$GITHUB_OUTPUT"
      - name: Check out private main's composite actions (generated)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts
        if: steps.plan.outputs.deploy == 'true'
        working-directory: services/platform
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts --no-audit --no-fund --prefix services/_shared
        if: steps.plan.outputs.deploy == 'true'
      - name: The deployed SQL is SQL live D1 will run
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tooling/ops/check-d1-accepts-live-sql.mjs
      - name: Write this version's secrets file
        if: steps.plan.outputs.deploy == 'true'
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const names = ["SUPABASE_ANON_KEY"];
            const empty = names.filter((n) => !process.env[n]);
            if (empty.length) {
              console.error(`${empty.join(", ")} is unset or empty; refusing to upload a version without it.`);
              process.exit(1);
            }
            const body = JSON.stringify(Object.fromEntries(names.map((n) => [n, process.env[n]])));
            require("node:fs").writeFileSync(process.argv[1], body, { mode: 0o600, flag: "wx" });
          ' "$RUNNER_TEMP/platform-secrets.json"
      - name: Deploy platform gradually — 10 %, then 100 %, rolled back on a red probe
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          UNIT_ORIGIN: ${{ steps.target.outputs.origin }}
        run: >
          node tooling/ops/gradual-deploy.mjs
          --worker platform --cwd services/platform
          --origin "$UNIT_ORIGIN" --expect ${{ env.NIKATRU_SHA }}
          --steps 10,100 --window-seconds 120
          --var GLITCHTIP_DSN:"$GLITCHTIP_DSN" --var RELEASE:${{ env.NIKATRU_SHA }}
          --secrets-file "$RUNNER_TEMP/platform-secrets.json"
      - name: Delete this version's secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/platform-secrets.json"
      - name: Smoke — the live Worker answers at THIS commit
        id: smoke
        if: steps.plan.outputs.deploy == 'true'
        env:
          UNIT_ORIGIN: ${{ steps.target.outputs.origin }}
        run: >
          node tooling/ops/post-deploy-smoke.mjs
          --url "$UNIT_ORIGIN/v1/health"
          --field build --expect ${{ env.NIKATRU_SHA }} --require-ok
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          UNIT_ORIGIN: ${{ steps.target.outputs.origin }}
        run: node tooling/ci/record-deployment.mjs platform "$UNIT_ORIGIN" --wrangler-output-env DEPLOY_OUTPUT --recipe deploy-workers.yml --smoke-outcome "${{ steps.smoke.outcome }}"

  edge-shield:
    name: Deploy edge-shield
    concurrency:
      group: deploy-workers-edge-shield
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ inputs.nikatru_sha || (github.event.client_payload.event == 'pull_request' && format('refs/pull/{0}/merge', github.event.client_payload.pr) || github.event.client_payload.sha || 'main') }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Refuse any ref but main
        run: node tooling/ci/assert-deploy-ref.mjs --allow main
      - name: The shell running this deploy was generated from this commit
        run: node tooling/ci/assert-shell-current.mjs deploy-workers.yml
      - name: Plan from the Deployment ledger
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/ci/plan-deploy.mjs edge-shield --recipe deploy-workers.yml
      - name: Read this unit's public origin from the register
        id: target
        run: node tooling/ci/site-target.mjs --origin edge-shield >> "$GITHUB_OUTPUT"
      - name: Check out private main's composite actions (generated)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
        if: steps.plan.outputs.deploy == 'true'
        env:
          NIKATRU_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_EVENT_NAME: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_PR: ${{ github.event.client_payload.pr }}
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --ignore-scripts
        if: steps.plan.outputs.deploy == 'true'
        working-directory: services/edge-shield
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/edge-shield
          command: deploy --var GLITCHTIP_DSN:${{ secrets.GLITCHTIP_DSN }} --var RELEASE:${{ env.NIKATRU_SHA }}
      - name: Smoke — this commit's shield is in path on both routes
        id: smoke
        if: steps.plan.outputs.deploy == 'true'
        run: node tooling/ops/check-edge-shield.mjs --settle --expect-release ${{ env.NIKATRU_SHA }}
      - name: Apply the zone's per-IP credential rule (tooling/edge-ratelimit-rule.json)
        id: ratelimit
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tooling/ops/edge-ratelimit-rule.mjs --apply
      - name: Apply the www -> apex redirect rule, then the www DNS record (tooling/edge/zone.json)
        id: www
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tooling/ops/www-redirect-rule.mjs --apply
      - name: Smoke — this commit's shield is in path and both zone rules are applied
        id: proven
        if: always() && steps.deploy.outcome == 'success'
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          RATELIMIT: ${{ steps.ratelimit.outcome }}
          WWW: ${{ steps.www.outcome }}
        run: |
          for o in "smoke=$SMOKE" "ratelimit=$RATELIMIT" "www=$WWW"; do
            if [ "${o#*=}" != success ]; then
              echo "::error title=edge-shield::step ${o%%=*} is '${o#*=}', so this deploy is recorded as failure and the next run re-applies"
              exit 1
            fi
          done
      - name: Record the deployed SHA
        if: always() && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          UNIT_ORIGIN: ${{ steps.target.outputs.origin }}
        run: node tooling/ci/record-deployment.mjs edge-shield "$UNIT_ORIGIN" --wrangler-output-env DEPLOY_OUTPUT --recipe deploy-workers.yml --smoke-outcome "${{ steps.proven.outcome }}"
      - name: Page the owner — this build is live and its smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          OWNER_PAGE_PUSH_URL: ${{ secrets.OWNER_PAGE_PUSH_URL }}
          OWNER_PAGE_PUSH_TOKEN: ${{ secrets.OWNER_PAGE_PUSH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_SHA: ${{ env.NIKATRU_SHA }}
          UNIT: edge-shield
        run: node tooling/ci/deploy-smoke-page.mjs --unit "$UNIT"
