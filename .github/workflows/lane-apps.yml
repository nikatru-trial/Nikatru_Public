    name: Workspace gate (melos analyze + test) · ${{ matrix.part }}
    needs: [detect]
    if: needs.detect.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        part: [analyze, packages, apps-1, apps-2, apps-3, apps-4, apps-5, apps-6, apps-7, apps-8, apps-9, apps-10]
