              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Read the Actions usage ledger and compare it to the declared ceiling
        id: budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRIDGE_READ_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_READ_SECRET || '' }}
          BRIDGE_OPS_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_OPS_SECRET || '' }}
          NIKATRU_BRIDGE_OPS_URL: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && 'https://gh-bridge.nikatru.workers.dev/ops' || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/assert-runner-budget.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Actions quota is UNKNOWN — the duty did not run::NOTHING read the account's Actions billing ledger, so 'can the scheduled proofs still run tomorrow?' is unanswered. This fails on purpose: 'I could not look' must never read as 'I looked and it was fine'. In the shell the ledger is read through the bridge's POST /ops billing: a LOST line above names a missing NIKATRU_BRIDGE_OPS_URL or BRIDGE_READ_SECRET, or the bridge's own refusal. GITHUB_TOKEN is repository-scoped and carries no billing dimension. The repository's visibility is a gate too (macOS minutes are print-only only on a repository that READS public): an unread GET repos/{repo} with this step's GITHUB_TOKEN, or no token, is exit 2."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Actions usage is not free — billed spend, a non-public repository or a larger runner class::Read the FAIL line(s) above. Either the current billing period's net-billed Actions MINUTES spend is over the declared ceiling, so a spending limit can stop runs from STARTING and every scheduled proof in this repository goes dark together; or the repository reads private or internal, so every minute draws on the 2,000-minute free allowance (Windows x2, macOS x10); or a current-period Minutes SKU is not one of the measured standard runners (a larger or GPU class, billed on public repositories too, or a renamed SKU to add from a ledger read). With any of those red, the macOS minutes are graded again at the private-allowance line and their FAIL shows the exposure. Establish WHICH assumption broke before touching a ceiling; the per-SKU and per-repo lines name the lane."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.runner-budget.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Plan the sweep of superseded Actions cache generations
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/cache-sweep.mjs --dry-run
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.runner-budget.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Sweep the superseded Actions cache generations before the line is read
        if: ${{ !cancelled() && ((env.NIKATRU_REF || (github.event.client_payload.ref || 'refs/heads/main')) == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), env.NIKATRU_EVENT_NAME || (github.event.client_payload.event || github.event_name)) && !env.NIKATRU_PR) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/cache-sweep.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Actions cache sweep is UNKNOWN - nothing was deleted::The cache listing of this repository was not read in full (no token, a non-200, or fewer entries than total_count). A partial listing could delete a family's newest entry, so nothing was deleted."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Actions cache sweep could not delete a superseded entry::A DELETE was refused (the job token needs actions: write). The FAIL lines above name each entry; the line below still grades what is left."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.runner-budget.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Sweep the merged wip/* safety branches of the code repository
        if: ${{ !cancelled() && inputs.worker_slot != '' && ((env.NIKATRU_REF || (github.event.client_payload.ref || 'refs/heads/main')) == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), env.NIKATRU_EVENT_NAME || (github.event.client_payload.event || github.event_name)) && !env.NIKATRU_PR) }}
        timeout-minutes: 4
        env:
          BRIDGE_READ_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_READ_SECRET || '' }}
          BRIDGE_OPS_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_OPS_SECRET || '' }}
          NIKATRU_BRIDGE_OPS_URL: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && 'https://gh-bridge.nikatru.workers.dev/ops' || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/sweep-wip-branches.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The wip/* branch sweep is UNKNOWN - nothing more was deleted::The bridge's wip-sweep list could not be read, or a delete call was not answered (the step holds no bridge ops URL, or no BRIDGE_OPS_SECRET - the sweep is never signed with the read key -, the bridge refused, or GitHub failed it). The step log names which; every branch the bridge did not delete is still there."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.runner-budget.6 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The CI repository's Actions cache is under its red line
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/assert-cache-budget.mjs --live
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Actions cache usage is UNKNOWN - nothing was graded::GET /repos/{repo}/actions/cache/usage was not read: no token, or a non-200 (the job token needs actions: read). Unread usage is not usage under the line."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Actions cache usage is over 8.5 GB::GitHub evicts past 10 GB, and the per-run hand-offs are what go: a CI run whose tests all pass then reds at a hand-off restore. Compare the entries to tooling/cache-budget.json: a family over its ceiling, or a rotated key's old generation. Never delete a hand-off to make room."
          fi
          exit "$code"
