          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ci/scan-dependencies.mjs --osv "${RUNNER_TEMP}/osv-scanner"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=The dependency scan is UNKNOWN - nothing was graded::OSV did not flag its canary lockfile, did not read every tracked lockfile, could not reach its database, or answered in a shape the script cannot read. NOTHING about main's dependencies is known from this run, and that is never a pass. The step log names which."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A known advisory stands against a lockfile on main::The step log names each vulnerable package, its lockfile and its advisory ids. Move it to a fixed version in a pull request; one that cannot be fixed yet is acknowledged in osv-scanner.toml with a dated ignoreUntil. THIS job owns it: a pull request's security-scan fails on it only when that pull request changes its lockfile (or osv-scanner.toml), and prints it otherwise."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.11 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Each box runs what its declaration says
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-box-declared.mjs --from-manifest --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the analytics step above).
            echo "::error title=What the boxes run is UNKNOWN - nothing was compared::The box_runtime_manifest table could not be read, a box has never posted a runtime block past its firstDue, a read the box posted is null, or a declared version is still UNREAD. NOTHING was judged, and that is never a pass. The step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A box runs something its declaration does not say::A container runs that no service declares, a declared container or unit is not running, a version differs, the box has needed a reboot for more than 7 days, or it stopped posting. The step log names the box and the item. Edit tooling/boxes/BOX.json to what should run, or put the box back; the box script is tooling/ops/boxes/post-config-manifest.sh."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.12 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No box image is floating, superseded 90 days, or behind a security fix
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-box-image-currency.mjs --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the analytics step above).
            echo "::error title=Box image currency is UNKNOWN - nothing was graded::The runtime manifest, a Docker Hub tag list or an upstream's advisories could not be read, or a running image is not in the reader's upstream table. NOTHING about those images is known, and that is never a pass. The step log names what could not be read."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A box image is floating, months behind, or missing a security fix::The step log names the box, the image, and the advisory or release. Upgrade it on the box with the box runbook step (back up, change, verify), pin a release tag and digest, and edit tooling/boxes/BOX.json in the same change."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.13 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every Paddle payout has its e-FIRC inside 30 days
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/gst/efirc.mjs watch
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the analytics step above).
            echo "::error title=The e-FIRC state is UNKNOWN - nothing was judged::The state file is unreadable or carries a field outside its money-free schema, or it does not yet cover the payouts of the month that must be known by now. Run the GST sales register for each month named, then efirc.mjs sync, and merge the state file (docs/ops/gst-sales-register.md). NOTHING was judged, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A Paddle payout is past 30 days with no e-FIRC::The step log names the payout key and its age. Get the e-FIRC from SBI, then efirc.mjs mark --received and efirc.mjs sync on the operator machine, and merge the state file (docs/ops/gst-sales-register.md)."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.14 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The DigiLocker audit log is still being written
        if: ${{ !cancelled() }}
        env:
          DIGILOCKER_OPS_READ_TOKEN: ${{ secrets.DIGILOCKER_OPS_READ_TOKEN }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-digilocker-audit.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS (see the step above).
            echo "::error title=DigiLocker audit liveness is UNKNOWN — nothing was read::The India host is declared on Box C but DIGILOCKER_OPS_READ_TOKEN is unset, or digilocker.nikatru.com did not answer the liveness read. NOTHING was judged, and that is never a pass."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=The DigiLocker audit log stopped being written::Connections exist and the newest audit row is older than the window. NeGD's 4-hour audit request could not be answered in full. Check the digilocker container's daily sync on Box C; docs/ops/digilocker-audit-export.md."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.15 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every Worker cron slot fired on its own cadence and its newest vouched run is green
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/check-schedule-truth.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.16 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No workflow is red run after run on main without an owner named (red streak)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/check-red-streak.mjs --advisory
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.17 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: A live-user, money, security or monthly workflow red on main pages its owner (red streak, page class)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_PAGE_OUT: ${{ runner.temp }}/pipeline-pages.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-red-streak.mjs --pages
          code=$?
          set -e
          if [ -s "$NIKATRU_PAGE_OUT" ]; then
            echo "::error title=A page-class workflow is red on main::$(wc -l < "$NIKATRU_PAGE_OUT") PAGE line(s) above name the workflow and its owner area; alert files this run."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.18 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No date that flips a gate arrives unannounced (deadline register)
        if: ${{ !cancelled() }}
        env:
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-deadline-register.mjs --warn --advisory
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.19 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No register date expires unseen within 72 h (expiry forecast)
        if: ${{ !cancelled() }}
        env:
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/expiry-forecast.mjs --advisory
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.20 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: The store dry runs are fresh
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node --single-threaded tooling/ci/assert-platform-proof-fresh.mjs --store-lanes
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.21 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No matrix cell runs close to its timeout (p95 against timeout-minutes)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ci/assert-timeout-budget.mjs --advisory
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.22 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: No CI runner pool is unreachable at main's newest pool-sync
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/check-pool-sync.mjs --advisory
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.23 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: File the pipeline watches' warnings against one durable issue
        if: ${{ !cancelled() }}
        env:
          TITLE: 'Pipeline watch: a date, a streak or a timeout needs its owner'
          NIKATRU_ADVISORY_OUT: ${{ runner.temp }}/pipeline-watch.md
          BRIDGE_READ_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_READ_SECRET || '' }}
          BRIDGE_OPS_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_OPS_SECRET || '' }}
          NIKATRU_BRIDGE_OPS_URL: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && 'https://gh-bridge.nikatru.workers.dev/ops' || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          if [ ! -s "$NIKATRU_ADVISORY_OUT" ]; then
            echo "pipeline watch: nothing to file (no warning from the red-streak, deadline or timeout-budget watch)"
            exit 0
          fi
          body="${RUNNER_TEMP}/pipeline-watch-body.md"
          {
            # no run link here: the bridge re-reads THIS run (GITHUB_RUN_ID) and names it; a repository read in
            # this step's env would be one more GITHUB_REPOSITORY reader (repo-phase.mjs NOT_CODE_READERS)
            printf '### %s\n\n' "$(date -u '+%Y-%m-%d')"
            cat "$NIKATRU_ADVISORY_OUT"
            printf '\n_Filed by the heartbeats job of `.github/workflows/ops-watch.yml` (pipeline-hardening rules 2, 4, 7). Each line names its owner._\n'
          } > "$body"
          node tooling/ops/ops-issue.mjs --kind pipeline-watch --body-file "$body"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.24 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Mark this period's weekly readers as run
        if: ${{ !cancelled() && inputs.worker_slot != '' && (needs.status.outputs.mark_weekly == 'true' || needs.status.outputs.mark_twice == 'true') && needs.status.outputs.week != '' }}
        env:
          WEEK: ${{ needs.status.outputs.week }}
          HALF: ${{ needs.status.outputs.half }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          mkdir -p .cache/ops-watch-weekly
          printf '%s %s %s\n' "$WEEK" "$HALF" "$GITHUB_RUN_ID" > .cache/ops-watch-weekly/marker
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.25 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Save this ISO week's weekly marker
        if: ${{ !cancelled() && inputs.worker_slot != '' && needs.status.outputs.mark_weekly == 'true' && needs.status.outputs.week != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ops-watch-weekly
          key: ops-watch-weekly-${{ needs.status.outputs.week }}
      - name: Save this half week's marker
        if: ${{ !cancelled() && inputs.worker_slot != '' && needs.status.outputs.mark_twice == 'true' && needs.status.outputs.week != '' && needs.status.outputs.half != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ops-watch-weekly
          key: ops-watch-twice-${{ needs.status.outputs.week }}-${{ needs.status.outputs.half }}
      - name: No outside read was answered from a last-good copy
        if: ${{ !cancelled() }}
        env:
          RUNNER_BUDGET_LAST_GOOD: ${{ needs.runner-budget.outputs.last_good }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/check-last-good-reads.mjs
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.heartbeats.28 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.heartbeats.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  status:
    needs: [nikatru-pin]
    name: Every enumerated surface produced its expected output
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      weekly: ${{ steps.due.outputs.weekly }}
      twice: ${{ steps.due.outputs.twice }}
      mark_weekly: ${{ steps.due.outputs.mark_weekly }}
      mark_twice: ${{ steps.due.outputs.mark_twice }}
      repeat_weekly: ${{ steps.due.outputs.repeat_weekly }}
      repeat_twice: ${{ steps.due.outputs.repeat_twice }}
      week: ${{ steps.period.outputs.week }}
      half: ${{ steps.period.outputs.half }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
