        id: period
        if: ${{ !cancelled() }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/ops-watch-weekly-slot.mjs --periods
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.status.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Has this ISO week's weekly run happened
        id: weekly-hit
        if: ${{ !cancelled() && inputs.worker_slot != '' && steps.period.outputs.week != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ops-watch-weekly
          key: ops-watch-weekly-${{ steps.period.outputs.week }}
          lookup-only: true
      - name: Has this half week's run happened
        id: twice-hit
        if: ${{ !cancelled() && inputs.worker_slot != '' && steps.period.outputs.week != '' && steps.period.outputs.half != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ops-watch-weekly
          key: ops-watch-twice-${{ steps.period.outputs.week }}-${{ steps.period.outputs.half }}
          lookup-only: true
      - name: Which weekly readers are due
        id: due
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          WORKER_SLOT: ${{ inputs.worker_slot }}
          WEEKLY_HIT: ${{ steps.weekly-hit.outputs.cache-hit }}
          TWICE_HIT: ${{ steps.twice-hit.outputs.cache-hit }}
          WEEKLY_ASKED: ${{ inputs.failure_ledger }}
          TWICE_ASKED: ${{ inputs.renovate_backlog }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          node tooling/ops/ops-watch-weekly-slot.mjs --decide --event "$EVENT" --weekly-hit "${WEEKLY_HIT:-false}" --twice-hit "${TWICE_HIT:-false}" --slot "$WORKER_SLOT" --weekly-asked "${WEEKLY_ASKED:-false}" --twice-asked "${TWICE_ASKED:-false}"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.status.8 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.status.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

