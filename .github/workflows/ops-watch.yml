          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATUS_PAGE_LIVE: ${{ vars.STATUS_PAGE_LIVE }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-pages-deployments.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # NO BACKTICKS ANYWHERE IN THESE STRINGS: they are double-quoted, so
            # a backtick opens a command substitution and the annotation would
            # silently execute part of itself.
            echo "::error title=Cloudflare Pages deployments are UNKNOWN — nothing was graded::No credential, a non-200, unparseable JSON, a preview row returned for a production query, or a project set that derived to EMPTY. NOTHING was judged. An empty sweep prints the same ok as a complete one, and this is the one rail with no second witness anywhere — no commit status, no GitHub Deployment, no Actions run."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A Cloudflare Pages project is RED or STALE::Its newest production deployment failed, or it succeeded at a commit older than the newest one on main touching its source directory. Production is serving the PREVIOUS build, which answers 200 with older bytes. For the nikatru project this is the ROUTER for nikatru.com/<id>/, so the app can be perfectly deployed and still unreachable. The step log names the project, the deployment id and both commits."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.pages-deployments.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Every live Worker serves the ledger's newest record
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-worker-versions.mjs --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Live Worker versions are UNKNOWN - nothing was compared::A ledger read, a /v1/health read or the shield's Cloudflare read did not answer, a record carried nothing to compare, or deploy-workers.yml records a Worker this check cannot read. An unread Worker is not a matching one. The step log names the unit."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A live Worker is NOT the ledger's newest record::Production serves a build the deployment ledger does not name as newest: a rollback or a deploy outside deploy-workers.yml, or a record that never landed. Every reader of the ledger is now reasoning from the wrong build. The step log names the Worker and both commits."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.pages-deployments.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Cloudflare usage keeps half its declared ceilings free
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-cloudflare-usage.mjs --cloudflare-read-paged
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Cloudflare usage is UNKNOWN - nothing was graded::No read token past the deferral, a non-200, GraphQL errors, or a ceiling row this check grades against is missing. Unread usage is not usage inside its ceilings."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=Cloudflare usage is past half a declared ceiling::A Workers, D1 or KV daily total used more than 50 percent of its ceiling in tooling/ceilings.json. The step log names the metric, the number and the ceiling."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.pages-deployments.5 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.pages-deployments.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  worker-source-drift:
    needs: [nikatru-pin]
    name: Every hand-deployed Worker runs what main would build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the private tree (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: ${{ needs.nikatru-pin.outputs.sha || 'nikatru-pin-did-not-succeed..' }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Name the private commit (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event || github.event_name }}
          NIKATRU_P_REF: ${{ github.event.client_payload.ref || 'refs/heads/main' }}
          NIKATRU_P_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          NIKATRU_P_BASE_REF: ${{ github.event.client_payload.base_ref }}
          NIKATRU_P_PR: ${{ github.event.client_payload.pr }}
          NIKATRU_P_PR_CREATED_AT: ${{ github.event.client_payload.pr_created_at }}
          NIKATRU_P_DRAFT: ${{ github.event.client_payload.draft }}
          NIKATRU_P_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ "$NIKATRU_P_EVENT" = pull_request ]; then
            set -- $(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p')
            if [ "${2:-}" != "$NIKATRU_P_SHA" ]; then
              echo "::error::the checked-out merge of PR #$NIKATRU_P_PR is not the merge of the dispatched head $NIKATRU_P_SHA (its second parent is ${2:-none}); the nikatru-pin job pins it — re-run the whole workflow, not this job"
              exit 1
            fi
          fi
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=${NIKATRU_P_SHA:-$(git rev-parse HEAD)}"
            echo "NIKATRU_EVENT_NAME=$NIKATRU_P_EVENT"
            echo "NIKATRU_REF=$NIKATRU_P_REF"
            echo "NIKATRU_REF_NAME=${NIKATRU_P_REF#refs/*/}"
            echo "NIKATRU_BASE_SHA=$NIKATRU_P_BASE_SHA"
            echo "NIKATRU_BASE_REF=$NIKATRU_P_BASE_REF"
            echo "NIKATRU_PR=$NIKATRU_P_PR"
            echo "NIKATRU_PR_CREATED_AT=$NIKATRU_P_PR_CREATED_AT"
            echo "NIKATRU_DRAFT=$NIKATRU_P_DRAFT"
          } >> "$GITHUB_ENV"
      - name: Check out this shell repository's own step wrapper and reporter (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .nikatru-shell
          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Every hand-deployed Worker runs what main would build
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          node tooling/ops/check-worker-source-drift.mjs --cloudflare-read-paged --unstamped-until 2026-11-30
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error title=Hand-deployed Worker drift is UNKNOWN - nothing was compared::A Cloudflare read did not answer, a version carries no source stamp past the deferral, an input set could not be read from git, or a Worker imports a file outside its directory. The step log names the Worker."
          elif [ "$code" -eq 1 ]; then
            echo "::error title=A hand-deployed Worker does not run what main would build::Main changed its inputs over a day ago and the live version is another build. Deploy it from main with the stamped command the step log prints."
          fi
          exit "$code"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.worker-source-drift.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.worker-source-drift.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

