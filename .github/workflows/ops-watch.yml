          sparse-checkout: .github/nikatru
          persist-credentials: false
      - name: Stage the shell's own copies outside the private checkout (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ../.nikatru-shell
          mv .nikatru-shell/.github/nikatru ../.nikatru-shell
          rm -rf .nikatru-shell
      - name: Check out private main's composite actions (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          ref: refs/heads/main
          path: .nikatru-trusted
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Keep private main's composite actions out of the branch's tree (generated)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: printf '/.nikatru-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - uses: ./.nikatru-trusted/.github/actions/setup-node
      - name: Collect what the readers say
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEDGER_RESULT: ${{ needs.failure-ledger.result }}
          LEDGER_EXIT: ${{ needs.failure-ledger.outputs.exit }}
          LEDGER_UNEXPLAINED: ${{ needs.failure-ledger.outputs.unexplained }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set +e
          {
            echo '## Surfaces'
            echo '```'
            node tooling/ops/status.mjs 2>&1
            echo "exit: $?"
            echo '```'
            echo '## Scheduled duties'
            echo '```'
            node tooling/ops/check-heartbeats.mjs 2>&1
            echo "exit: $?"
            echo '```'
            echo '## Declared gaps in the operations register'
            echo '```'
            # 🔴 THIS READER USED TO BE ONE PIPED LINE AND IT LIED IN BOTH
            # DIRECTIONS. `node … | grep -E '^(⬜|⚠)' || echo '(none printed)'`
            # threw the guard's exit away (a pipeline reports its LAST stage, so
            # the digest recorded grep's status, never the register's) AND the
            # grep filtered out every failure line, which this guard writes as
            # `✗ …`. A register in COVERAGE LOST therefore rendered in the weekly
            # digest as the single line "(none printed)" — the most reassuring
            # possible presentation of a red check. Repaired 2026-08-08 to match
            # its two siblings above: capture output and status SEPARATELY, then
            # echo the status.
            #
            # The status is captured on its own line, immediately after the
            # assignment and before any other command runs. `$?` inside an
            # argument list that contains a command substitution is the
            # SUBSTITUTION's status, which is how a whole session's guard checks
            # once read EXIT 0 while a guard was exiting 1 (CLAUDE.md).
            #
            # On a red register the WHOLE output is included, not a filtered
            # slice: filtering is what hid the failure, and the one run where the
            # digest is worth reading in full is the run where something broke.
            out="$(node tooling/ci/assert-ops-register.mjs 2>&1)"
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$out" | grep -E '^(⬜|⚠)' || echo '(none printed)'
            else
              printf '%s\n' "$out"
            fi
            echo "exit: $code"
            echo '```'
            # A skipped or cancelled ledger job leaves no exit output: that prints
            # as "did not run", never as a blank line that reads like a pass.
            echo '## Failed-run ledger'
            if [ -n "${LEDGER_EXIT}" ]; then
              echo "exit ${LEDGER_EXIT} — UNEXPLAINED ${LEDGER_UNEXPLAINED:-none printed} (0 = every failure in the last 8 days maps to a recorded cause)"
            else
              echo "exit: did not run (the failure-ledger job was ${LEDGER_RESULT:-not reached})"
            fi
          } > "${RUNNER_TEMP}/digest-body.md"
          set -e
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.digest.3 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Deliver it to one durable issue
        if: ${{ !cancelled() }}
        env:
          TITLE: 'Weekly ops digest'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRIDGE_READ_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_READ_SECRET || '' }}
          BRIDGE_OPS_SECRET: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && secrets.BRIDGE_OPS_SECRET || '' }}
          NIKATRU_BRIDGE_OPS_URL: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' && 'https://gh-bridge.nikatru.workers.dev/ops' || '' }}
        run: |
          NIKATRU_QUIET="$(mktemp "${RUNNER_TEMP:-/tmp}/nikatru-step.XXXXXX")"
          cat > "$NIKATRU_QUIET" <<'NIKATRU_QUIET_EOF'
          set -euo pipefail
          body="${RUNNER_TEMP}/digest.md"
          {
            printf '### %s — [run](%s)\n\n' "$(date -u '+%Y-%m-%d')" "${RUN_URL}"
            cat "${RUNNER_TEMP}/digest-body.md"
            printf '\n_Posted by the `digest` job in `.github/workflows/ops-watch.yml`. This issue is REUSED and is never closed automatically._\n'
          } > "$body"

          node tooling/ops/ops-issue.mjs --kind digest --body-file "$body"
          NIKATRU_QUIET_EOF
          NIKATRU_SHELL="${BASH:-bash}"; if command -v cygpath >/dev/null 2>&1; then NIKATRU_SHELL="$(cygpath -w "$NIKATRU_SHELL")"; fi
          node "$GITHUB_WORKSPACE/../.nikatru-shell/quiet-step.mjs" --name ops-watch.digest.4 -- "$NIKATRU_SHELL" -e "$NIKATRU_QUIET"
      - name: Store this job's red detail in the bridge's private home (generated)
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NIKATRU_PATHS: ${{ runner.temp }}/report-detail.md
          NIKATRU_ARTIFACT_NAME: report-detail-ops-watch.digest.${{ strategy.job-index }}
          NIKATRU_IF_NO_FILES: ignore
          BRIDGE_ARTIFACT_SECRET: ${{ secrets.BRIDGE_ARTIFACT_SECRET }}
          NIKATRU_BRIDGE_ARTIFACT_URL: https://gh-bridge.nikatru.workers.dev/artifact
        run: node tooling/ops/bridge-artifact.mjs upload

  nikatru-ran:
    name: Fail this run if it ran nothing (generated)
    needs: [heartbeats, status, supabase-drift, prod-provenance, pages-deployments, worker-source-drift, runner-budget, shell-barriers, store-vitals-state, store-vitals, glitchtip, config-drift, edge-shield, failure-ledger, renovate-backlog, code-scanning-age, tech-currency, self-review, alert, digest]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out nothing of the private tree but its issue templates (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.NIKATRU_PRIVATE_REPO }}
          sparse-checkout: .github/ISSUE_TEMPLATE
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Fail when every job of this run was skipped (generated)
        shell: bash
        env:
          NIKATRU_RESULTS: heartbeats=${{ needs.heartbeats.result }} status=${{ needs.status.result }} supabase-drift=${{ needs.supabase-drift.result }} prod-provenance=${{ needs.prod-provenance.result }} pages-deployments=${{ needs.pages-deployments.result }} worker-source-drift=${{ needs.worker-source-drift.result }} runner-budget=${{ needs.runner-budget.result }} shell-barriers=${{ needs.shell-barriers.result }} store-vitals-state=${{ needs.store-vitals-state.result }} store-vitals=${{ needs.store-vitals.result }} glitchtip=${{ needs.glitchtip.result }} config-drift=${{ needs.config-drift.result }} edge-shield=${{ needs.edge-shield.result }} failure-ledger=${{ needs.failure-ledger.result }} renovate-backlog=${{ needs.renovate-backlog.result }} code-scanning-age=${{ needs.code-scanning-age.result }} tech-currency=${{ needs.tech-currency.result }} self-review=${{ needs.self-review.result }} alert=${{ needs.alert.result }} digest=${{ needs.digest.result }}
        run: |
          for r in $NIKATRU_RESULTS; do
            if [ "${r#*=}" != skipped ]; then echo "ran: $NIKATRU_RESULTS"; exit 0; fi
          done
          echo "::error::ran nothing: every job of this $GITHUB_EVENT_NAME run was skipped ($NIKATRU_RESULTS), so a green run would claim work that never ran. If a generated job before them failed, that failure is the cause. A workflow whose no-op run is legitimate is named in tooling/ci/public-shell.json noopRuns."
          exit 1
