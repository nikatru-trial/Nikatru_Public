  store-vitals-state:
    needs: [nikatru-pin]
    name: The last known vitals grades, handed on as data (no checkout, no secret)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      state: ${{ steps.state.outputs.state }}
      seal: ${{ steps.state.outputs.seal }}
      matched: ${{ steps.restore.outputs.cache-matched-key }}
    steps:
      - name: Restore the last known vitals grades
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: restore
        with:
          path: .cache/store-vitals
          key: store-vitals-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            store-vitals-
      - name: Hand the grades on as a size-capped output
        id: state
        shell: bash
        run: |
          set -euo pipefail
          f=.cache/store-vitals/state.json
          if [ -f "$f" ] && [ ! -L "$f" ] && [ "$(wc -c < "$f")" -le 32768 ]; then
            echo "state=$(base64 -w0 "$f")" >> "$GITHUB_OUTPUT"
          else
            echo "state=" >> "$GITHUB_OUTPUT"
            echo "no state.json of at most 32768 bytes restored: store-vitals starts from no known grade"
          fi
          # why (⏱ 2026-11-02 · review F2): the seal store-vitals wrote beside it, `<run_id>.<run_attempt> <64 hex>`
          # (⏱ 2026-11-03: the run that sealed it), or nothing. This job holds no key and checks nothing: store-vitals
          # verifies it (state-intake.mjs) before it believes a byte.
          s=.cache/store-vitals/state.seal
          seal=""
          if [ -f "$s" ] && [ ! -L "$s" ] && [ "$(wc -c < "$s")" -le 128 ]; then seal="$(head -n 1 "$s" | tr -dc '0-9a-f. ')"; fi
          if ! [[ "$seal" =~ ^[0-9]{1,20}\.[0-9]{1,4}\ [0-9a-f]{64}$ ]]; then seal=""; fi
          echo "seal=$seal" >> "$GITHUB_OUTPUT"

