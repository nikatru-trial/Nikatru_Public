  nikatru-relay:
    name: Start the workflows that follow this run (generated)
    needs: [nikatru-pin, first-pass, lane-workers, lane-guards, lane-sites, lane-apps, lane-build, extensions, as-if-main, ci-gate, platform-db-migrate, deploy-web, money-plan, sandbox-slot, money-sandbox, money-walk-tip, money-gate, deploy-workers, main-only-setup-plan, main-only-setup, nikatru-ran, nikatru-collect, nikatru-report, nikatru-collect-deploys, nikatru-report-deploys]
    if: always() && (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request') && github.event.client_payload.event != 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Start autopilot-watch.yml after this run (generated)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_RELAY_RUN: ${{ github.run_id }}
          NIKATRU_RELAY_ATTEMPT: ${{ github.run_attempt }}
          NIKATRU_RELAY_NAME: CI
          NIKATRU_RELAY_PATH: .github/workflows/ci.yml
          NIKATRU_RELAY_CONCLUSION: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          NIKATRU_RELAY_HEAD_SHA: ${{ needs.nikatru-pin.outputs.sha }}
          NIKATRU_RELAY_EVENT: ${{ github.event.client_payload.event || github.event_name }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-watch.yml/dispatches" -f ref=main -f "inputs[nikatru_relay_run]=$NIKATRU_RELAY_RUN" -f "inputs[nikatru_relay_attempt]=$NIKATRU_RELAY_ATTEMPT" -f "inputs[nikatru_relay_name]=$NIKATRU_RELAY_NAME" -f "inputs[nikatru_relay_path]=$NIKATRU_RELAY_PATH" -f "inputs[nikatru_relay_conclusion]=$NIKATRU_RELAY_CONCLUSION" -f "inputs[nikatru_relay_head_sha]=$NIKATRU_RELAY_HEAD_SHA" -f "inputs[nikatru_relay_event]=$NIKATRU_RELAY_EVENT" --silent || echo "::warning::could not start autopilot-watch.yml after run $NIKATRU_RELAY_RUN attempt $NIKATRU_RELAY_ATTEMPT"
      - name: Start main-healthy.yml after this run (generated)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NIKATRU_RELAY_RUN: ${{ github.run_id }}
          NIKATRU_RELAY_ATTEMPT: ${{ github.run_attempt }}
          NIKATRU_RELAY_NAME: CI
          NIKATRU_RELAY_PATH: .github/workflows/ci.yml
          NIKATRU_RELAY_CONCLUSION: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          NIKATRU_RELAY_HEAD_SHA: ${{ needs.nikatru-pin.outputs.sha }}
          NIKATRU_RELAY_EVENT: ${{ github.event.client_payload.event || github.event_name }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/main-healthy.yml/dispatches" -f ref=main -f "inputs[nikatru_relay_run]=$NIKATRU_RELAY_RUN" -f "inputs[nikatru_relay_attempt]=$NIKATRU_RELAY_ATTEMPT" -f "inputs[nikatru_relay_name]=$NIKATRU_RELAY_NAME" -f "inputs[nikatru_relay_path]=$NIKATRU_RELAY_PATH" -f "inputs[nikatru_relay_conclusion]=$NIKATRU_RELAY_CONCLUSION" -f "inputs[nikatru_relay_head_sha]=$NIKATRU_RELAY_HEAD_SHA" -f "inputs[nikatru_relay_event]=$NIKATRU_RELAY_EVENT" --silent || echo "::warning::could not start main-healthy.yml after run $NIKATRU_RELAY_RUN attempt $NIKATRU_RELAY_ATTEMPT"
