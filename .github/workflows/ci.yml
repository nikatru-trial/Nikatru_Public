          NIKATRU_RESULTS: '{"platform-db-migrate": "${{ needs.platform-db-migrate.result }}", "deploy-web": "${{ needs.deploy-web.result }}", "money-plan": "${{ needs.money-plan.result }}", "sandbox-slot": "${{ needs.sandbox-slot.result }}", "money-sandbox": "${{ needs.money-sandbox.result }}", "money-walk-tip": "${{ needs.money-walk-tip.result }}", "money-gate": "${{ needs.money-gate.result }}", "deploy-workers": "${{ needs.deploy-workers.result }}"}'
        run: /usr/bin/python3 -I .github/nikatru/report.py send .github/nikatru/ci-deploys.json
      - name: Report every lane and the gate without detail, as the step above did not run to its end (generated)
        if: always() && steps.send.outputs.reported != 'true'
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
