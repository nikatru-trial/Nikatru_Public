  nikatru-report-deploys:
    name: Report to the private repository (generated)
    needs: [platform-db-migrate, deploy-web, money-plan, sandbox-slot, money-sandbox, money-walk-tip, money-gate, deploy-workers, nikatru-collect-deploys]
    if: always() && github.event_name == 'repository_dispatch' && !(needs.platform-db-migrate.result == 'skipped' && needs.deploy-web.result == 'skipped' && needs.money-plan.result == 'skipped' && needs.sandbox-slot.result == 'skipped' && needs.money-sandbox.result == 'skipped' && needs.money-walk-tip.result == 'skipped' && needs.money-gate.result == 'skipped' && needs.deploy-workers.result == 'skipped') && (github.event_name != 'repository_dispatch' || (github.event.client_payload.event == 'push' && github.event.client_payload.ref == 'refs/heads/main') || github.event.client_payload.event == 'pull_request')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out this shell repository only, no private code (generated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/nikatru
      - name: Report every lane and the gate to the private repository (generated)
        id: send
        if: always()
        env:
          BRIDGE_REPORT_SECRET: ${{ secrets.BRIDGE_REPORT_SECRET }}
          NIKATRU_DETAIL_KEY: ${{ secrets.NIKATRU_DETAIL_KEY }}
          NIKATRU_DETAIL: ${{ needs.nikatru-collect-deploys.outputs.detail }}
          NIKATRU_DETAIL_2: ${{ needs.nikatru-collect-deploys.outputs.detail_2 }}
          NIKATRU_DETAIL_3: ${{ needs.nikatru-collect-deploys.outputs.detail_3 }}
          NIKATRU_RED_LOGS: ${{ needs.nikatru-collect-deploys.outputs.red_logs }}
          NIKATRU_RED_LOGS_2: ${{ needs.nikatru-collect-deploys.outputs.red_logs_2 }}
          NIKATRU_RED_LOGS_3: ${{ needs.nikatru-collect-deploys.outputs.red_logs_3 }}
          NIKATRU_RED_LOGS_4: ${{ needs.nikatru-collect-deploys.outputs.red_logs_4 }}
          NIKATRU_HEAD_SHA: ${{ github.event.client_payload.sha }}
          NIKATRU_P_EVENT: ${{ github.event.client_payload.event }}
